name: Issue68 Stage0 authority diagnostic record

on:
  push:
    branches: [issue68-joint-constraint-tournament]
    paths:
      - '.github/workflows/issue68-stage0-authority-diagnostic-record.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue68-joint-constraint-tournament
          fetch-depth: 0

      - name: Checkout frozen ZL3b source
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: _cipher_benchmark
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Checkout frozen CREMMA controls
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: _cremma
          sparse-checkout: |
            data/BIS-193
            data/CLM13027
            data/Mazarine915
            data/UBL758
          sparse-checkout-cone-mode: false

      - name: Checkout pinned Naibbe publication code
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: _naibbe
          sparse-checkout: |
            naibbe_v2.py
            sixteentables.csv
          sparse-checkout-cone-mode: false

      - name: Persist actual authority identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/joint-constraint-tournament/stage0-diagnostic
          ZLC=$(git -C _cipher_benchmark rev-parse HEAD)
          ZLB=$(git -C _cipher_benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)
          CRC=$(git -C _cremma rev-parse HEAD)
          NAC=$(git -C _naibbe rev-parse HEAD)
          NAP=$(git -C _naibbe hash-object naibbe_v2.py)
          NAT=$(git -C _naibbe hash-object sixteentables.csv)
          python - <<PY
          import json, os
          obj={
            'diagnostic_only_no_science': True,
            'actual': {
              'zl_commit': os.environ['ZLC'] if 'ZLC' in os.environ else '$ZLC',
              'zl_blob': os.environ['ZLB'] if 'ZLB' in os.environ else '$ZLB',
              'cremma_commit': '$CRC',
              'naibbe_commit': '$NAC',
              'naibbe_py_blob': '$NAP',
              'naibbe_table_blob': '$NAT',
            },
            'expected': {
              'zl_commit': '315f0cad4de3d021bd4185765c037cf2a28d341c',
              'zl_blob': '2a4533ab9bdfa85db9bad602d590978953055df1',
              'cremma_commit': '292525969ad98380b398e6606a9c2a36d51913ae',
              'naibbe_commit': 'f2675ec5dd275268bc64dd48ea64fc0e0e9827a2',
              'naibbe_py_blob': 'b566ad82e4b6ff0782ecdddebf77718dac44f292',
              'naibbe_table_blob': '5cd34fb81d80faf3b4d57dbf1719c05ffde25302',
            }
          }
          obj['matches']={k: obj['actual'][k] == obj['expected'][k] for k in obj['actual']}
          open('experiments/joint-constraint-tournament/stage0-diagnostic/external_authorities.json','w').write(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit diagnostic snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/joint-constraint-tournament/stage0-diagnostic/external_authorities.json
          git commit -m 'Record Issue68 external authority diagnostic'
          git push origin HEAD:issue68-joint-constraint-tournament
