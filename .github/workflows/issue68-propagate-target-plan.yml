name: Issue68 propagate tournament plan after Stage0

on:
  push:
    branches: [issue68-joint-constraint-tournament]
    paths:
      - '.github/workflows/issue68-propagate-target-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue68-joint-constraint-tournament
          fetch-depth: 0

      - name: Resolve verified Stage0 report
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 60); do
            git fetch -q origin issue68-joint-constraint-tournament
            git reset -q --hard origin/issue68-joint-constraint-tournament
            if [ -f experiments/joint-constraint-tournament/STAGE0_REPORT.md ]; then
              python - <<'PY'
          import json
          r=json.load(open('experiments/joint-constraint-tournament/stage0/STAGE0_OUTCOME.json'))
          assert r['all_checks_pass'] is True
          assert r['new_joint_candidate_scores_computed'] is False
          PY
              FOUND=1
              break
            fi
            sleep 5
          done
          test "$FOUND" = "1"

      - name: Materialize already-frozen plan template as separate commit
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE=.github/workflows/issue68-freeze-target-plan.yml
          TARGET=experiments/joint-constraint-tournament/PLAN_A.md
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/issue68-freeze-target-plan.yml').read_text().splitlines()
          start=None; end=None
          marker="cat > experiments/joint-constraint-tournament/PLAN_A.md <<'EOF'"
          for i,line in enumerate(src):
              if line.strip()==marker:
                  start=i+1
                  continue
              if start is not None and line.strip()=='EOF':
                  end=i
                  break
          if start is None or end is None:
              raise SystemExit('cannot locate frozen plan template')
          lines=[]
          for line in src[start:end]:
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          text='\n'.join(lines)+'\n'
          target=Path('experiments/joint-constraint-tournament/PLAN_A.md')
          if target.exists():
              if target.read_text()!=text:
                  raise SystemExit('existing PLAN_A differs from frozen template')
              Path('/tmp/NOOP').write_text('already identical')
          else:
              target.write_text(text)
          PY
          if [ -f /tmp/NOOP ]; then
            echo 'PLAN_A already exists and is identical.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TARGET"
          git commit -m 'Issue68: preregister first joint-constraint tournament'
          git push origin HEAD:issue68-joint-constraint-tournament
