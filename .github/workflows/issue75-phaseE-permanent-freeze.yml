name: Issue75 Phase E permanent M5 first-reveal freeze

on:
  push:
    branches: [issue75-minimal-occupancy-generator]
    paths: ['.github/workflows/issue75-phaseE-permanent-freeze.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current research branch
        uses: actions/checkout@v4
        with:
          ref: issue75-minimal-occupancy-generator
          fetch-depth: 0

      - name: Verify exact successful first-reveal authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN=33513977559
          SCI=5f345bdbd855f53c14668ac9c1eb81dc97e46d1f
          ART=9802934733
          INFO=$(gh api "repos/daito-dot/LETSGO-Voynich/actions/runs/${RUN}")
          test "$(echo "$INFO" | jq -r .conclusion)" = success
          test "$(echo "$INFO" | jq -r .head_sha)" = "$SCI"
          test "$(echo "$INFO" | jq -r .path)" = '.github/workflows/issue75-phaseE-first-reveal.yml'
          AINFO=$(gh api "repos/daito-dot/LETSGO-Voynich/actions/artifacts/${ART}")
          test "$(echo "$AINFO" | jq -r .name)" = "issue75-phaseE-FIRST-REVEAL-${SCI}"
          test "$(echo "$AINFO" | jq -r .digest)" = 'sha256:63b4376fc89b5037f5fc3d413b36b3393bea388c5c01346695a36f4959324378'
          test "$(echo "$AINFO" | jq -r .workflow_run.id)" = "$RUN"
          test "$(echo "$AINFO" | jq -r .workflow_run.head_sha)" = "$SCI"
          git merge-base --is-ancestor "$SCI" HEAD
          test ! -e experiments/minimal-occupancy-generator/stage-e-first-reveal
          test ! -e experiments/minimal-occupancy-generator/REPORT_E.md
          test ! -e experiments/minimal-occupancy-generator/DECISION_E_RICHER_LATENT_REQUIRED.md
          test ! -e experiments/minimal-occupancy-generator/DECISION_E_STOP_LADDER.md

      - name: Download exact successful Phase E first-reveal artifact
        uses: actions/download-artifact@v4
        with:
          name: issue75-phaseE-FIRST-REVEAL-5f345bdbd855f53c14668ac9c1eb81dc97e46d1f
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: daito-dot/LETSGO-Voynich
          run-id: 33513977559

      - name: Verify complete frozen result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          test "$(find /tmp/source/individual -maxdepth 1 -name 'M5-KRS-2MIX-CHAIN_*.json' | wc -l)" -eq 31
          (cd /tmp/source && sha256sum -c SHA256SUMS.txt)
          AGGSHA=$(sha256sum /tmp/source/phase75e_aggregate.json | cut -d' ' -f1)
          test "$AGGSHA" = 983aa0370d949690d7e117fbf2f1273f3a157975d51a06a5e149f4ea1861c0c5
          python - <<'PY'
          import glob,json
          paths=glob.glob('/tmp/source/individual/M5-KRS-2MIX-CHAIN_*.json')
          assert len(paths)==31
          reps=set()
          e0=None
          for p in paths:
              r=json.load(open(p, encoding='utf-8'))
              assert r['schema']=='issue75-phaseE-m5-r1-score-v1'
              assert r['status']=='PHASE_E_M5_FIRST_REVEAL_CASE_SCORED'
              assert r['family']=='M5-KRS-2MIX-CHAIN'
              reps.add(r['rep'])
              assert r['candidate_audit']['exact_phase_e0_replay'] is True
              assert r['candidate_audit']['frozen_parameters_reconstructed'] is True
              assert r['no_case_selection'] is True and r['no_reroll'] is True
              assert all(v is True for v in r['target_access'].values())
              if e0 is None: e0=r['candidate_audit']['phase_e0_authority_sha256']
              assert r['candidate_audit']['phase_e0_authority_sha256']==e0
          assert reps==set(range(31))
          assert e0=='4c406e60872f8fcfd27901cc41901db04c1aa192fa9ee91a14c01ea3dbe46a89'
          a=json.load(open('/tmp/source/phase75e_aggregate.json', encoding='utf-8'))
          assert a['schema']=='issue75-phaseE-m5-aggregate-v1'
          assert a['status']=='PHASE_E_M5_COMPLETE_31_CASE_POPULATION_AGGREGATED'
          assert a['scientific_head']=='5f345bdbd855f53c14668ac9c1eb81dc97e46d1f'
          assert a['phase_e0_authority_sha256']==e0
          assert a['phase_a_positive_control_aggregate_sha256']=='fc3788c01bfa908bcae528a7a2606d508d26f694bf5ae51bc6cb537232efb540'
          assert a['phase_c_m3_aggregate_sha256']=='34affe98b68a1e410ea3d4384a917450c2b58e7a8e02a30da8befa660712421a'
          assert a['phase_d_m4_aggregate_sha256']=='c15ffb92030220596cacef9db9cb3bdb26c92607f675c24ff0fa607e16764489'
          assert a['population']['family']=='M5-KRS-2MIX-CHAIN'
          assert a['population']['total_results']==31 and a['population']['complete_population'] is True
          assert a['population']['no_drops'] is True and a['population']['no_rerolls'] is True
          assert a['model_complexity']['latent_states']==2
          assert a['model_complexity']['free_continuous_parameters_per_fold']==43
          assert a['model_complexity']['explicit_nonadjacent_parameters']==0
          assert a['model_complexity']['generic_distance_parameters']==0
          assert a['model_complexity']['named_distant_pair_parameters']==0
          assert a['model_complexity']['signature_specific_parameters']==0
          assert a['frozen_phase_a_positive_control']['delta_plus_q95']==0.009768313008182594
          assert a['primary']['gap_M5']==-0.23982656369491107
          assert a['primary']['no_material_loss'] is False
          assert a['primary']['classification']=='M5_KRS_TWO_LATENT_CHAIN_MODES_INSUFFICIENT_RICHER_LATENT_OR_CONFIGURATION_RULE_REQUIRED'
          assert a['measurement']['T']['median']==0.7251534248148385
          assert a['measurement']['R_ZL3b']['median']==0.7251534248148385
          assert a['measurement']['R_IT2a']['median']==0.7394869078765621
          assert a['measurement']['sign_ZL3b']['median']==56.0
          assert a['measurement']['sign_IT2a']['median']==56.0
          assert a['measurement']['residual_energy']['median']==3.111551507419741
          assert a['measurement']['p_exist']['median']==0.000999000999000999
          assert a['measurement']['reliability_W']['finite']['median']==0.9648883601379059
          assert a['secondary_nonpromoting']['summary_T_M5_minus_M3']['median']==0.12883426927468355
          assert a['secondary_nonpromoting']['summary_T_M5_minus_M4']['median']==0.10392347349458042
          assert all(v is False for v in a['guardrails'].values())
          print({
              'classification':a['primary']['classification'],
              'T_median':a['measurement']['T']['median'],
              'R_ZL3b_median':a['measurement']['R_ZL3b']['median'],
              'R_IT2a_median':a['measurement']['R_IT2a']['median'],
              'gap_M5':a['primary']['gap_M5'],
              'median_T_M5_minus_M3':a['secondary_nonpromoting']['summary_T_M5_minus_M3']['median'],
              'median_T_M5_minus_M4':a['secondary_nonpromoting']['summary_T_M5_minus_M4']['median'],
          })
          PY
          echo "aggregate_sha=$AGGSHA" >> "$GITHUB_OUTPUT"

      - name: Copy exact evidence into repository
        shell: bash
        run: |
          set -euo pipefail
          DEST=experiments/minimal-occupancy-generator/stage-e-first-reveal
          test ! -e "$DEST"
          mkdir -p "$DEST"
          cp -a /tmp/source/individual "$DEST/"
          cp /tmp/source/phase75e_aggregate.json "$DEST/"
          cp /tmp/source/aggregate.stdout.txt "$DEST/"
          cp /tmp/source/SHA256SUMS.txt "$DEST/"
          cp /tmp/source/PROVENANCE.txt "$DEST/"
          cat > "$DEST/ARTIFACT_AUTHORITY.txt" <<EOF
          scientific_role=POSTREVEAL_TRANSPORT_ONLY_PERMANENT_AUTHORITY
          source_workflow_run=33513977559
          source_workflow_conclusion=success
          source_artifact_id=9802934733
          source_artifact_name=issue75-phaseE-FIRST-REVEAL-5f345bdbd855f53c14668ac9c1eb81dc97e46d1f
          source_artifact_digest=sha256:63b4376fc89b5037f5fc3d413b36b3393bea388c5c01346695a36f4959324378
          aggregate_sha256=${{ steps.result.outputs.aggregate_sha }}
          scientific_head=5f345bdbd855f53c14668ac9c1eb81dc97e46d1f
          e0_authority_sha256=4c406e60872f8fcfd27901cc41901db04c1aa192fa9ee91a14c01ea3dbe46a89
          phase_a_positive_control_aggregate_sha256=fc3788c01bfa908bcae528a7a2606d508d26f694bf5ae51bc6cb537232efb540
          phase_c_aggregate_sha256=34affe98b68a1e410ea3d4384a917450c2b58e7a8e02a30da8befa660712421a
          phase_d_aggregate_sha256=c15ffb92030220596cacef9db9cb3bdb26c92607f675c24ff0fa607e16764489
          total_results=31
          drops=0
          rerolls=0
          permanent_freeze_is_post_reveal_transport_only=true
          EOF

      - name: Commit permanent Phase E first-reveal authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/minimal-occupancy-generator/stage-e-first-reveal
          git commit -m 'Issue75 Phase E: freeze exact 31-case M5 first-reveal authority'
          git push origin HEAD:issue75-minimal-occupancy-generator
