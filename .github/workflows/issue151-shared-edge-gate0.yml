name: Issue151 shared common-EVA edge Gate0

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/common-eva-edge/ISSUE151_SHARED_EDGE_CONSOLIDATION_PLAN.md'
      - 'experiments/predictive-information/common-eva-edge/issue151_shared_edge_gate0.py'
      - '.github/workflows/issue151-shared-edge-gate0.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
  IT2A: external/IT2a-n.txt
  OUT: issue151_shared_edge_gate0.json
  GATE: experiments/predictive-information/common-eva-edge/issue151_shared_edge_gate0.py

jobs:
  score-free-gate0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert entry ancestry and frozen blobs
        shell: bash
        run: |
          git merge-base --is-ancestor b7e643a0d3075a9f09dbd9ec3a8f50149cb4a131 HEAD
          test "$(git hash-object "$GATE")" = "d5e3bd22501f8caebabc7c2728bc7f8d5cb59018"
          test "$(git hash-object experiments/predictive-information/common-eva-edge/ISSUE151_SHARED_EDGE_CONSOLIDATION_PLAN.md)" = "e903bfbdd3742e578f784dc9c358f98f44ad42d2"
          test "$(git hash-object experiments/predictive-information/common-eva-edge/issue148_common_eva_table_gate0.py)" = "a8029aac50ccc6e09ec975b7b86a1bde44415f9f"
          test "$(git hash-object experiments/predictive-information/common-eva-edge/ISSUE148_GATE0_PROVENANCE.md)" = "7f97b9731a6e72e2456ede436e837a3735f265fd"
          test "$(git hash-object experiments/predictive-information/common-eva-edge/issue148_common_eva_table_first_reveal.py)" = "7847c0fea1dcfc4ace5752d0188d70e3739679d3"
          test "$(git hash-object experiments/predictive-information/common-eva-edge/issue145_common_eva_first_reveal.py)" = "ce8a167c607fbcf2807f567439ab6837471f4f07"

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Retrieve exact IT2a authority
        shell: bash
        run: |
          mkdir -p external
          curl --fail --location --retry 3 --retry-delay 2 --output "$IT2A" https://www.voynich.nu/data/IT2a-n.txt

      - name: Verify frozen sources
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(sha256sum "$ZL3B" | awk '{print $1}')" = "bf5b6d4ac1e3a51b1847a9c388318d609020441ccd56984c901c32b09beccafc"
          test "$(git hash-object "$IT2A")" = "4d6d3f2537b1f507a257529b49c94af7d6e03446"
          test "$(sha256sum "$IT2A" | awk '{print $1}')" = "7f27a8b0feed8f6de0a99900df6bf912dd1d295c38e5f830bac8b41c3f536fb5"

      - name: Install frozen parser runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Compile and target-free synthetic self-test
        shell: bash
        run: |
          python -m py_compile "$GATE"
          python "$GATE" --self-test

      - name: Run score-free shared-table Gate0
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          python "$GATE" --run "$ZL3B" "$IT2A" "$OUT"
          python -m json.tool "$OUT" > /dev/null
          sha256sum "$OUT" | tee issue151_shared_edge_gate0.sha256

      - name: Preserve Gate output
        if: always()
        shell: bash
        run: |
          if test -f "$OUT"; then
            cat "$OUT"
            sha256sum "$OUT" | tee issue151_shared_edge_gate0.sha256
          else
            echo "Gate produced no result JSON" >&2
          fi

      - name: Assert score-free Gate contract
        if: steps.gate.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open('issue151_shared_edge_gate0.json',encoding='utf-8'))
          assert x['schema']=='issue151-shared-edge-gate0-v1'
          assert x['issue']==151
          assert x['gate_pass'] is True
          assert x['scientific_shared_table_metrics_computed'] is False
          assert x['gate_disposition']=='PASS — PROCEED TO SEPARATELY COMMITTED SHARED-EDGE SCORER'
          a=x['entry_authority']
          assert a['issue148_gate_reproduced'] is True
          assert a['issue148_gate_result_sha256']=='f324264b814ef02d8de70b804754750ec579f8a9e0d8dffb0f1575439867d1bf'
          assert a['issue148_gate_script_blob']=='a8029aac50ccc6e09ec975b7b86a1bde44415f9f'
          assert a['issue148_gate_provenance_blob']=='7f97b9731a6e72e2456ede436e837a3735f265fd'
          assert a['issue148_scorer_blob']=='7847c0fea1dcfc4ace5752d0188d70e3739679d3'
          assert a['issue148_declared_first_reveal_result_sha256']=='305e6e4e6eb59dcc969f1d4075eb5b64b06621c7a0cac8077c4cdedd76874923'
          assert a['fold_identity_sha256']=='cf2df8edcf2b25c2f6388c4a9e2c1ee58a24ae05a9cf489ff9a43d2d28f0b64b'
          c=x['shared_table_contract']
          assert c['weights']=={'ZL3b':0.5,'IT2a':0.5}
          assert c['alpha_for_future_scorer']==0.01
          assert c['V_with_END_for_future_scorer']==32
          assert c['target_native_fallback'] is False
          assert len(x['outer'])==5
          for f,row in enumerate(x['outer']):
              assert row['outer_fold']==f
              for overlap in row['leakage'].values():
                  assert overlap==[]
              z=row['ZL3b_training']; i=row['IT2a_training']; s=row['shared_training_table']
              assert s['weights']=={'ZL3b':0.5,'IT2a':0.5}
              assert math.isclose(s['matrix_total_mass'],0.5*z['training_run_body_tokens']+0.5*i['training_run_body_tokens'],rel_tol=0.0,abs_tol=0.0)
              assert s['real_target_probability_computed'] is False
              for key in ('ZL3b_target_context_support','IT2a_target_context_support'):
                  t=row[key]
                  assert t['target_primary_run_body_targets']>=300
                  assert t['consensus_context_supported_primary_run_body_targets']>=300
                  assert t['heldout_current_first_atom_used_for_support_selection'] is False
          fw=x['firewall']
          assert all(v is False for v in fw.values())
          assert x['synthetic_fractional_count_test']['uses_real_target_data'] is False
          print(json.dumps({
            'gate_disposition':x['gate_disposition'],
            'folds':[
              {
                'fold':r['outer_fold'],
                'ZL3b_target_context_coverage':r['ZL3b_target_context_support']['consensus_context_coverage_fraction'],
                'IT2a_target_context_coverage':r['IT2a_target_context_support']['consensus_context_coverage_fraction'],
                'consensus_contexts':r['shared_training_table']['n_previous_terminal_contexts'],
                'consensus_pairs':r['shared_training_table']['n_positive_context_outcome_pairs'],
                'consensus_mass':r['shared_training_table']['matrix_total_mass'],
              } for r in x['outer']
            ]
          },indent=2,sort_keys=True))
          PY

      - name: Upload Gate0 authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue151-shared-edge-gate0-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          path: |
            issue151_shared_edge_gate0.json
            issue151_shared_edge_gate0.sha256

      - name: Preserve Gate failure status
        if: steps.gate.outcome == 'failure'
        shell: bash
        run: exit 1
