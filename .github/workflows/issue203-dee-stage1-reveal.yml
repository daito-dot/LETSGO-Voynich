name: Issue203 Dee Stage1 prereveal authority audit

on:
  push:
    branches: [issue203-dee-stage1-reveal]
    paths:
      - '.github/workflows/issue203-dee-stage1-reveal.yml'

permissions:
  contents: read

env:
  PREREG_COMMIT: 1ef994ddd53f8e74f62fe0642dbfb86fa38abe37

jobs:
  authority-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact merged preregistration
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREREG_COMMIT }}

      - name: Record exact committed scorer identity only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREREG_COMMIT"
          test ! -e experiments/issue203-dee-stage1/issue203_dee_stage1_result.json
          {
            echo "prereg_commit=$PREREG_COMMIT"
            echo "scorer_sha256=$(sha256sum experiments/issue203-dee-stage1/issue203_dee_stage1_scorer.py | awk '{print $1}')"
            echo "scorer_git_blob_sha1=$(git hash-object experiments/issue203-dee-stage1/issue203_dee_stage1_scorer.py)"
            echo "result_emitted=false"
            echo "dee_xlsx_retrieved=false"
          } | tee issue203_prereveal_authority.txt

      - name: Upload authority audit
        uses: actions/upload-artifact@v4
        with:
          name: issue203-prereveal-authority
          path: issue203_prereveal_authority.txt
          if-no-files-found: error
