name: Issue26E8A2 vowel-fixed exhaustive control

on:
  push:
    branches: [issue26-music-e8-philip-cipher]
    paths:
      - 'experiments/issue26-music/PLAN_E8A2.md'
      - 'experiments/issue26-music/phaseE8A2_vowel_fixed.py'
      - 'experiments/issue26-music/phaseE8A2_json_runner.py'
      - 'experiments/issue26-music/phaseE8_philip_duration.py'
      - 'experiments/issue26-music/issue26e_core.py'
      - '.github/workflows/issue26e8a2-vowel-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout E8 branch
        uses: actions/checkout@v4
        with:
          ref: issue26-music-e8-philip-cipher
          fetch-depth: 0

      - name: Verify E8A2 plan predates executable and serialization wrapper
        shell: bash
        run: |
          PLAN=$(git log --format=%H -- experiments/issue26-music/PLAN_E8A2.md | tail -1)
          SCRIPT=$(git log --format=%H -- experiments/issue26-music/phaseE8A2_vowel_fixed.py | tail -1)
          RUNNER=$(git log --format=%H -- experiments/issue26-music/phaseE8A2_json_runner.py | tail -1)
          echo plan_first=$PLAN script_first=$SCRIPT runner_first=$RUNNER
          test "$PLAN" != "$SCRIPT"
          git merge-base --is-ancestor "$PLAN" "$SCRIPT"
          git merge-base --is-ancestor "$PLAN" "$RUNNER"

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark
          sparse-checkout: |
            benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Checkout frozen CREMMA comparator
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma
          sparse-checkout: |
            data/BIS-193
            data/CLM13027
            data/Mazarine915
            data/UBL758
          sparse-checkout-cone-mode: false

      - name: Verify exact inputs
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"

      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1

      - name: Run E8A2 exhaustive first emitted reveal
        shell: bash
        run: |
          python experiments/issue26-music/phaseE8A2_json_runner.py \
            external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            external/cremma > issue26e8a2_results.json

      - name: Print audit summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open('issue26e8a2_results.json'))
          print('classification=',r['frozen_primary_classification'])
          for k in ['primary_min','max_sensitivity']:
              x=r[k]
              print('\n',k)
              for name in ['classification','universe_size','target_mean_distance','rank_strict','ties_or_better','p_cond','universe_median','universe_q05','universe_q01','universe_min','fold_median_wins']:
                  print(name,'=',x[name])
              print('target_fold_distances=',x['target_fold_distances'])
              print('fold_universe_medians=',x['fold_universe_medians'])
              print('target_keys=',x['target_keys_vectorized'])
              print('replay=',x['replay_checks'])
              print('best5=')
              for z in x['best_five_non_philip']:
                  print(z)
          print('hashes=',r['inputs'])
          PY
          sha256sum issue26e8a2_results.json

      - name: Upload E8A2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue26e8a2-first-emitted-reveal-${{ github.sha }}
          path: issue26e8a2_results.json
          if-no-files-found: error
          retention-days: 90
