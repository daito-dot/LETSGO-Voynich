name: Phase64B Naibbe preflight B4

on:
  push:
    branches: [phase64b-naibbe-science]
    paths:
      - 'experiments/phase64/PREFLIGHT_AMENDMENT_B3.md'
      - 'experiments/phase64/phase64b_naibbe.py'
      - '.github/workflows/phase64b-naibbe-preflight-b4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation head
        uses: actions/checkout@v4
        with:
          ref: phase64b-naibbe-science

      - name: Checkout exact published Naibbe source only
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: external/naibbe

      - name: Install adapter dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas

      - name: Compile corrected adapter
        run: python -m py_compile experiments/phase64/phase64b_naibbe.py experiments/phase64/phase64b_science.py

      - name: Verify drop-only effective-alphabet projection and toy encryption
        shell: bash
        run: |
          python - <<'PY'
          import contextlib, io, random, sys
          from pathlib import Path
          sys.path.insert(0, 'experiments/phase64')
          import phase64b_naibbe as x

          root = Path('external/naibbe').resolve()
          captured = io.StringIO()
          with contextlib.redirect_stdout(captured):
              m = x.load_naibbe(root)

          assert set(x.EFFECTIVE_LETTERS) == set('abcdefghilmnopqrstuvxyz')
          assert len(x.EFFECTIVE_LETTERS) == 23

          source = 'Arma ꝯ virumque ꝑ œ þ WJK'
          published = m.clean_line(source)
          assert 'ꝯ' in published
          assert 'ꝑ' in published
          projected, dropped = x.project_effective_plaintext(published)
          assert 'ꝯ' in dropped and 'ꝑ' in dropped
          assert all(ch in x.EFFECTIVE_LETTERS for ch in projected)
          assert 'ꝯ' not in projected and 'ꝑ' not in projected

          normalized = m.clean_line('WJK æ œ þ')
          normalized_projected, normalized_dropped = x.project_effective_plaintext(normalized)
          assert normalized_projected == normalized
          assert normalized_dropped == []
          assert normalized == 'uuicaeoeth'

          original = dict(m.placeholder_to_glyph)
          x.set_glyph_map(m, original)
          random.seed(6480000)
          enc1 = m.encrypt_naibbe(projected, m.naibbe_tables, original, use_78=m.USE_78_CARD_DECK)
          out1 = m.respace_line(' '.join(enc1), m.SPACE_REMOVAL_RATE)
          random.seed(6480000)
          enc2 = m.encrypt_naibbe(projected, m.naibbe_tables, original, use_78=m.USE_78_CARD_DECK)
          out2 = m.respace_line(' '.join(enc2), m.SPACE_REMOVAL_RATE)
          assert enc1 == enc2 and out1 == out2 and enc1

          print({
              'published_cleaned': published,
              'projected': projected,
              'dropped': dropped,
              'supported_normalization': normalized,
              'toy_raw_tokens': len(enc1),
              'toy_published_tokens': len(out1.split()),
              'external_import_stdout_chars': len(captured.getvalue()),
          })
          print('B4 PASS: drop-only alphabet compatibility is deterministic; no ZL3b or CREMMA scientific source was checked out or read.')
          PY
