name: Issue26E12 Porta plaintext probe

on:
  push:
    branches: [issue26-music-e12-porta-probe]
    paths:
      - 'experiments/issue26-music/PLAN_E12.md'
      - 'experiments/issue26-music/PLAN_E12_AMENDMENT.md'
      - 'experiments/issue26-music/phaseE12_porta_probe.py'
      - 'experiments/issue26-music/phaseE12_porta_probe_v2.py'
      - '.github/workflows/issue26e12-porta-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout E12 branch
        uses: actions/checkout@v4
        with:
          ref: issue26-music-e12-porta-probe
          fetch-depth: 0

      - name: Verify plans predate executables
        shell: bash
        run: |
          PLAN=$(git log --format=%H -- experiments/issue26-music/PLAN_E12.md | tail -1)
          AMEND=$(git log --format=%H -- experiments/issue26-music/PLAN_E12_AMENDMENT.md | tail -1)
          SCRIPT=$(git log --format=%H -- experiments/issue26-music/phaseE12_porta_probe.py | tail -1)
          WRAP=$(git log --format=%H -- experiments/issue26-music/phaseE12_porta_probe_v2.py | tail -1)
          echo plan_first=$PLAN amendment_first=$AMEND script_first=$SCRIPT wrapper_first=$WRAP
          git merge-base --is-ancestor "$PLAN" "$SCRIPT"
          git merge-base --is-ancestor "$PLAN" "$WRAP"
          git merge-base --is-ancestor "$AMEND" "$SCRIPT"
          git merge-base --is-ancestor "$AMEND" "$WRAP"
          test "$PLAN" != "$SCRIPT"
          test "$AMEND" != "$SCRIPT"

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark
          sparse-checkout: |
            benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Checkout frozen CREMMA comparator
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma
          sparse-checkout: |
            data/BIS-193
            data/CLM13027
            data/Mazarine915
            data/UBL758
          sparse-checkout-cone-mode: false

      - name: Verify exact external inputs
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"

      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1 numba==0.61.2

      - name: Run Porta plaintext probe
        shell: bash
        run: |
          python experiments/issue26-music/phaseE12_porta_probe_v2.py \
            external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            external/cremma > issue26e12_results.json

      - name: Print E12 summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open('issue26e12_results.json'))
          print('classification=',r['classification'])
          print('anti_collapse=',r['interpretation']['low_diversity_label'])
          print('analysis_leaf_count=',r['analysis_leaf_count'])
          print('latin_baseline_ce=',r['latin_self_baseline']['mean_cross_entropy'])
          print('latin_top5=',r['latin_self_baseline']['top5_char_fraction'])
          p=r['positive_control']
          print('positive_pass=',p['passed'])
          print('positive_true_ce=',p['mean_true_held_cross_entropy'])
          print('positive_recovered_ce=',p['mean_recovered_held_cross_entropy'])
          print('positive_accuracy=',p['mean_decoded_letter_accuracy'])
          for name in ['primary_min','max_sensitivity']:
              x=r[name]
              print('\n'+name)
              print('mean_held_ce=',x['mean_held_cross_entropy'])
              print('orientation_recurrence=',x['duration_orientation_recurrence'])
              print('modal_orientation=',x['modal_duration_orientation'])
              print('pooled_top5=',x['pooled_top5_char_fraction'])
              print('words_ge6=',x['distinct_words_ge6_count'])
              print('folds_with_words_ge6=',x['folds_with_any_word_ge6'])
              print('words=',x['distinct_words_ge6'][:40])
              for f in x['folds']:
                  print(' fold',f['fold'],'train_types=',f['training_types'],'train_bg=',f['selected_key']['training_bigram_cross_entropy'],'held=',f['held']['cross_entropy'],'orientation=',f['selected_key']['duration_orientation'],'perm=',f['selected_key']['pitch_permutation'])
                  for s in f['held']['samples'][:3]: print('  sample',s['page'],s['text'])
                  print('  long_hits=',[z for z in f['held']['lexicon_hits'] if z['length']>=6][:5])
          print('gates=',r['interpretation'].get('gates'))
          PY
          sha256sum issue26e12_results.json

      - name: Upload E12 artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue26e12-porta-probe-${{ github.sha }}
          path: issue26e12_results.json
          if-no-files-found: error
          retention-days: 90
