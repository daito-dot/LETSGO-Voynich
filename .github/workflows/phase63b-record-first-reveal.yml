name: Phase63B record exact first reveal

on:
  push:
    branches: [phase63b-record]
    paths:
      - '.github/workflows/phase63b-record-first-reveal.yml'

permissions:
  contents: write
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recording branch
        uses: actions/checkout@v4
        with:
          ref: phase63b-record

      - name: Download exact first-reveal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9738599590/zip" \
            --output first-reveal.zip
          echo "4b9448e655d539528357ee4b51de1ebdea70003730c593f49c96bdbb4a6d9324  first-reveal.zip" | sha256sum -c -
          rm -rf first-reveal
          mkdir first-reveal
          unzip -q first-reveal.zip -d first-reveal
          echo "77653133af22cd26141bc695a8ee6243cc3d924ba44a41a685cb148b9167db91  first-reveal/phase63b_science_results.json" | sha256sum -c -

      - name: Verify frozen scientific verdict
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='first-reveal/phase63b_science_results.json'
          x=json.load(open(p))
          assert x['phase']=='63B'
          assert x['across_phase63B']['strong_replication'] is True
          assert x['observational_frozen_criteria']['GC2a']['R1_pass'] is True
          assert x['observational_frozen_criteria']['GC2a']['R2_pass'] is True
          assert x['observational_frozen_criteria']['IT2a']['R1_pass'] is True
          assert x['observational_frozen_criteria']['IT2a']['R2_pass'] is True
          assert x['IT_full_A1_R1_transfer']['W1']['across_fold']['frozen_IT_R3_criterion_pass'] is True
          PY

      - name: Record exact first-reveal JSON
        shell: bash
        run: |
          cp first-reveal/phase63b_science_results.json experiments/phase63/phase63b_science_results.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/phase63/phase63b_science_results.json
          git commit -m "Record exact first-reveal Phase 63B replication result"
          git push origin HEAD:phase63b-record
