name: Issue72 V2 Stage C0 archive transport repair

on:
  push:
    branches: [issue72-r1-causal-decomposition-v2]
    paths:
      - '.github/workflows/issue72-v2-stage-c0-archive-transport.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  archive-c0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact transport-repair head
        uses: actions/checkout@v4
        with:
          ref: issue72-r1-causal-decomposition-v2
          fetch-depth: 0

      - name: Verify incident chronology and no target scorer
        shell: bash
        run: |
          set -euo pipefail
          INCIDENT=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/STAGE_C0_ARCHIVE_TRANSPORT_INCIDENT_20260901.md | tail -1)
          WORKFLOW=$(git log --diff-filter=A --format=%H -- .github/workflows/issue72-v2-stage-c0-archive-transport.yml | tail -1)
          git merge-base --is-ancestor d21ce72c756ab9ed09ee58302366b2df9ea692c2 "$INCIDENT"
          git merge-base --is-ancestor "$INCIDENT" "$WORKFLOW"
          test ! -e experiments/naibbe-r1-decomposition-v2/c1_r1_target72_v2.py
          test ! -e experiments/naibbe-r1-decomposition-v2/STAGE_C_TARGET_IMPLEMENTATION.md
          echo "INCIDENT_FIRST_ADD=$INCIDENT" >> "$GITHUB_ENV"
          echo "WORKFLOW_FIRST_ADD=$WORKFLOW" >> "$GITHUB_ENV"
          echo "TRANSPORT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download exact successful C0 artifact
        uses: actions/download-artifact@v4
        with:
          name: issue72-v2-stageC0-recovery2-d21ce72c756ab9ed09ee58302366b2df9ea692c2
          path: /tmp/c0-authority
          github-token: ${{ github.token }}
          repository: daito-dot/LETSGO-Voynich
          run-id: 33468199347

      - name: Verify exact artifact contents and deterministic compression
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/c0-authority/stage_c0_support.json)" -eq 206486933
          echo 'da00a66b77a90eb36a158a9942927a27743e64aba7fac69337ff3a67424d695a  /tmp/c0-authority/stage_c0_support.json' | sha256sum -c -
          echo 'aba822be57bbac0c04a9fa785a0a835eafe192b406fead5cd7166051825f45ae  /tmp/c0-authority/MANIFEST.json' | sha256sum -c -
          sed 's#/tmp/issue72-c0/#/tmp/c0-authority/#g' /tmp/c0-authority/SHA256SUMS.txt > /tmp/c0-authority/SHA256SUMS.relocated.txt
          sha256sum -c /tmp/c0-authority/SHA256SUMS.relocated.txt
          gzip -n -9 -c /tmp/c0-authority/stage_c0_support.json > /tmp/c0-authority/stage_c0_support.json.gz
          test "$(wc -c < /tmp/c0-authority/stage_c0_support.json.gz)" -eq 12780097
          echo '946d8f8fa61d996a548a344f7e303f804283230ce8bef0d51add473d811e4ed3  /tmp/c0-authority/stage_c0_support.json.gz' | sha256sum -c -
          gzip -dc /tmp/c0-authority/stage_c0_support.json.gz | sha256sum | grep '^da00a66b77a90eb36a158a9942927a27743e64aba7fac69337ff3a67424d695a  -$'
          test "$(find /tmp/c0-authority -maxdepth 1 -name 'trace_rep*_*.json.gz' | wc -l)" -eq 20

      - name: Build size-safe permanent archive
        shell: bash
        run: |
          set -euo pipefail
          DEST=experiments/naibbe-r1-decomposition-v2/stage-c0
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp /tmp/c0-authority/stage_c0_support.json.gz "$DEST/"
          cp /tmp/c0-authority/MANIFEST.json "$DEST/"
          cp /tmp/c0-authority/trace_rep*_*.json.gz "$DEST/"
          cp /tmp/c0-authority/SHA256SUMS.txt "$DEST/SCIENTIFIC_SHA256SUMS.txt"
          cp /tmp/c0-authority/PROVENANCE.txt "$DEST/SCIENTIFIC_PROVENANCE.txt"
          cat > "$DEST/ARCHIVE_README.md" <<EOF
          # Issue #72 V2 Stage C0 permanent archive

          This directory is the size-safe repository archive of the scientifically successful target-blind C0 artifact from Actions run \`33468199347\`, job \`99732343946\`, scientific head \`d21ce72c756ab9ed09ee58302366b2df9ea692c2\`.

          The raw scientific file was not altered semantically. It is stored as deterministic gzip because the exact raw JSON is 206,486,933 bytes and GitHub rejects single files above 100 MiB.

          ## Exact identities

          - Actions artifact: \`9785652875\`
          - artifact ZIP SHA-256: \`c642519356f477441dcbb7d910988966a0c1c2b661e03be5cee078564e1426da\`
          - raw \`stage_c0_support.json\` bytes: \`206486933\`
          - raw SHA-256: \`da00a66b77a90eb36a158a9942927a27743e64aba7fac69337ff3a67424d695a\`
          - deterministic \`gzip -n -9\` bytes: \`12780097\`
          - gzip SHA-256: \`946d8f8fa61d996a548a344f7e303f804283230ce8bef0d51add473d811e4ed3\`
          - \`MANIFEST.json\` SHA-256: \`aba822be57bbac0c04a9fa785a0a835eafe192b406fead5cd7166051825f45ae\`

          ## Reconstruction

          \`gzip -dc stage_c0_support.json.gz > stage_c0_support.json\`

          Then require:

          \`sha256sum stage_c0_support.json\`

          to equal:

          \`da00a66b77a90eb36a158a9942927a27743e64aba7fac69337ff3a67424d695a\`.

          \`SCIENTIFIC_SHA256SUMS.txt\` and \`SCIENTIFIC_PROVENANCE.txt\` are copied byte-for-byte from the successful scientific artifact. The SHA list contains the original runner prefix \`/tmp/issue72-c0/\`; relocate that prefix to the reconstruction directory when verifying archived files.

          ## Scientific status

          C0 is target-blind. Its provenance freezes \`counterfactual_R1_target_scored=false\`, \`PT_generated_or_scored=false\`, and \`FI_generated_or_scored=false\`.
          EOF
          cat > "$DEST/TRANSPORT_PROVENANCE.txt" <<EOF
          source_workflow_run=33468199347
          source_job=99732343946
          source_scientific_head=d21ce72c756ab9ed09ee58302366b2df9ea692c2
          source_artifact_id=9785652875
          source_artifact_zip_sha256=c642519356f477441dcbb7d910988966a0c1c2b661e03be5cee078564e1426da
          raw_stage_c0_sha256=da00a66b77a90eb36a158a9942927a27743e64aba7fac69337ff3a67424d695a
          raw_stage_c0_bytes=206486933
          deterministic_gzip_sha256=946d8f8fa61d996a548a344f7e303f804283230ce8bef0d51add473d811e4ed3
          deterministic_gzip_bytes=12780097
          manifest_sha256=aba822be57bbac0c04a9fa785a0a835eafe192b406fead5cd7166051825f45ae
          transport_head=${TRANSPORT_HEAD}
          incident_first_add=${INCIDENT_FIRST_ADD}
          transport_workflow_first_add=${WORKFLOW_FIRST_ADD}
          scientific_executable_rerun=false
          target_scorer_present=false
          counterfactual_R1_target_scored=false
          EOF
          du -h "$DEST"/*

      - name: Commit exact size-safe archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/naibbe-r1-decomposition-v2/stage-c0
          git commit -m 'Issue72 V2 C0: archive exact target-blind authority with deterministic gzip'
          git push origin HEAD:issue72-r1-causal-decomposition-v2
