name: Issue72 V2 Stage C1 FI0 target-blind allocation authority

on:
  push:
    branches: [issue72-r1-causal-decomposition-v2]
    paths:
      - '.github/workflows/issue72-v2-stage-c1-fi0-allocation-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-fi0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact FI0 implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Enforce preregistration and target firewall chronology
        shell: bash
        run: |
          set -euo pipefail
          PLAN=a053efd9803b6c0f74614986289c54a8add7d904
          GENERATOR=7da0369a03da3b9c11ba935818bd2e1ef68aa3fd
          test "$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/STAGE_C1_FI_PLAN.md | tail -1)" = "$PLAN"
          test "$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/fi0_allocation_authority72_v2.py | tail -1)" = "$GENERATOR"
          git merge-base --is-ancestor "$PLAN" "$GENERATOR"
          git merge-base --is-ancestor "$GENERATOR" HEAD
          test ! -e experiments/naibbe-r1-decomposition-v2/stage-c1-fi0
          test ! -e experiments/naibbe-r1-decomposition-v2/stage-c1-fi1
          test ! -e experiments/naibbe-r1-decomposition-v2/FI_REPORT.md
          test ! -e experiments/naibbe-r1-decomposition-v2/fi1_r1_score72_v2.py
          test ! -e experiments/naibbe-r1-decomposition-v2/fi1_aggregate72_v2.py
          python -m py_compile experiments/naibbe-r1-decomposition-v2/fi0_allocation_authority72_v2.py

      - name: Checkout frozen CREMMA authority
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout pinned Naibbe authority
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: external/naibbe

      - name: Install frozen preexisting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pandas

      - name: Generate all 398 FI allocations without target access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fi0
          python experiments/naibbe-r1-decomposition-v2/fi0_allocation_authority72_v2.py \
            external/cremma external/naibbe /tmp/fi0/stage_c1_fi0_allocation_authority.json \
            > /tmp/fi0/stdout.txt
          sha256sum /tmp/fi0/stage_c1_fi0_allocation_authority.json > /tmp/fi0/stage_c1_fi0_allocation_authority.sha256

      - name: Verify complete frozen population and invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          p='/tmp/fi0/stage_c1_fi0_allocation_authority.json'
          r=json.load(open(p, encoding='utf-8'))
          assert r['schema']=='issue72-v2-stage-c1-fi0-allocation-authority-v1'
          assert r['status']=='FI_G_M_398_ALLOCATION_POPULATION_FROZEN_TARGET_BLIND'
          assert r['preregistered_plan_commit']=='a053efd9803b6c0f74614986289c54a8add7d904'
          assert r['n_perm_per_family']==199
          assert r['families']==['G','M']
          assert len(r['cases'])==398
          assert Counter(x['family'] for x in r['cases'])=={'G':199,'M':199}
          assert {(x['family'],x['index']) for x in r['cases']}=={(f,i) for f in ('G','M') for i in range(199)}
          assert r['identity']['surface_sha256']=='47d52d28d4e2ac126bb8681c881ec339cb339c9b1bb329fb48263e6c1e9758bd'
          assert r['identity']['visible_tokens']==33574
          assert r['identity']['accepted_tokens']==29759
          assert r['identity']['distinct_complete_tokens']==7146
          assert abs(r['identity']['coverage']-0.886370405671055)<1e-15
          assert r['selection_policy']=={
              'baseline_identical_surfaces_retained':True,
              'coverage_gate':False,
              'drops':0,
              'rerolls':0,
              'target_dependent_selection':False,
          }
          assert all(v is False for v in r['target_access'].values())
          assert all(x['visible_tokens']==33574 and x['accepted_tokens']==29759 for x in r['cases'])
          # FI-M must preserve the exact per-manuscript accepted counts.
          base=r['identity']['per_manuscript_accepted']
          assert all(x['per_manuscript_accepted']==base for x in r['cases'] if x['family']=='M')
          print('FI0 target-blind population verified:', Counter(x['family'] for x in r['cases']))
          print('baseline-identical:', {f:sum(x['baseline_identical_surface'] for x in r['cases'] if x['family']==f) for f in ('G','M')})
          print('changed fractions:', {f:(min(x['changed_slot_fraction'] for x in r['cases'] if x['family']==f), max(x['changed_slot_fraction'] for x in r['cases'] if x['family']==f)) for f in ('G','M')})
          PY
          cat /tmp/fi0/stage_c1_fi0_allocation_authority.sha256
          cat /tmp/fi0/stdout.txt

      - name: Permanently freeze target-blind FI0 authority in repository
        shell: bash
        run: |
          set -euo pipefail
          DEST=experiments/naibbe-r1-decomposition-v2/stage-c1-fi0
          mkdir -p "$DEST"
          cp /tmp/fi0/stage_c1_fi0_allocation_authority.json "$DEST/"
          cp /tmp/fi0/stage_c1_fi0_allocation_authority.sha256 "$DEST/"
          cp /tmp/fi0/stdout.txt "$DEST/"
          SHA=$(cut -d' ' -f1 /tmp/fi0/stage_c1_fi0_allocation_authority.sha256)
          cat > "$DEST/AUTHORITY.txt" <<EOF
          scientific_role=PRETARGET_FINAL_TOKEN_ALLOCATION_AUTHORITY
          preregistered_plan_commit=a053efd9803b6c0f74614986289c54a8add7d904
          generator_commit=7da0369a03da3b9c11ba935818bd2e1ef68aa3fd
          generation_workflow_head=${GITHUB_SHA}
          generation_workflow_run=${GITHUB_RUN_ID}
          allocation_authority_sha256=${SHA}
          cases=398
          fi_g_cases=199
          fi_m_cases=199
          target_loaded=false
          Q_computed=false
          Z_computed=false
          R1_computed=false
          rerolls=0
          drops=0
          coverage_gate=false
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m 'Issue72 V2 Stage FI0: freeze exact 398-case target-blind allocation authority'
          git push origin HEAD:issue72-r1-causal-decomposition-v2
