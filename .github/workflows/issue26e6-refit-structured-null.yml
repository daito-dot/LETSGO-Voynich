name: Issue26E6 fully-refit structured-null audit

on:
  push:
    branches: [issue26-music-e6-refit-structured-null]
    paths:
      - 'experiments/issue26-music/PLAN_E6.md'
      - 'experiments/issue26-music/phaseE6_refit_structured_null.py'
      - 'experiments/issue26-music/issue26e_core.py'
      - 'experiments/issue26-music/E3_STRUCTURED_NULLS.json'
      - 'experiments/issue26-music/E3_EXACT_PAIR_ALTERNATIVES.json'
      - '.github/workflows/issue26e6-refit-structured-null.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout E6 branch
        uses: actions/checkout@v4
        with:
          ref: issue26-music-e6-refit-structured-null
          fetch-depth: 0

      - name: Verify E6 plan predates executable
        shell: bash
        run: |
          PLAN=$(git log --format=%H -- experiments/issue26-music/PLAN_E6.md | tail -1)
          SCRIPT=$(git log --format=%H -- experiments/issue26-music/phaseE6_refit_structured_null.py | tail -1)
          echo plan_first=$PLAN script_first=$SCRIPT
          test "$PLAN" != "$SCRIPT"
          git merge-base --is-ancestor "$PLAN" "$SCRIPT"

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark
          sparse-checkout: |
            benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Acquire frozen IT2a transcription
        shell: bash
        run: |
          curl -fsSL --retry 3 https://www.voynich.nu/data/IT2a-n.txt -o IT2a-n.txt
          echo '7f27a8b0feed8f6de0a99900df6bf912dd1d295c38e5f830bac8b41c3f536fb5  IT2a-n.txt' | sha256sum -c -
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"

      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1

      - name: Run E6 first reveal
        shell: bash
        run: |
          python experiments/issue26-music/phaseE6_refit_structured_null.py \
            external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            IT2a-n.txt > issue26e6_results.json

      - name: Print audit summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open('issue26e6_results.json'))
          print('classification=', r['frozen_classification'])
          print('max_sensitivity=', r['max_sensitivity_classification'])
          for family in ['primary_min','sensitivity_max']:
              print('\n',family)
              for ds in ['ZL','IT']:
                  x=r[family][ds]
                  print(ds, 'G=',x['guidonian_mean_accuracy'],
                        'Smed=',x['structured']['mean_median'],
                        'Sq95=',x['structured']['mean_q95'],
                        'Smax=',x['structured']['mean_max'],
                        'p=',x['structured']['p_global'],
                        'S_pass=',x['structured']['pass'],
                        'X_pass=',x['exact_pair']['pass'])
                  for a in x['exact_pair']['alternatives']:
                      print(' exact',a['alternative'],'A=',a['mean_accuracy'],
                            'G-alt=',a['guidonian_minus_alternative'],
                            'foldwins=',a['guidonian_strict_fold_wins'])
          print('hashes=',r['inputs'])
          PY
          sha256sum issue26e6_results.json

      - name: Upload E6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue26e6-first-reveal-${{ github.sha }}
          path: issue26e6_results.json
          if-no-files-found: error
          retention-days: 90
