name: Archive Issue84 Phase C first reveal

on:
  push:
    branches: [research/issue84-phase-c-genre-controls]
    paths:
      - '.github/workflows/issue84-phase-c-archive.yml'

permissions:
  actions: read
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue84-phase-c-genre-controls

      - name: Download authoritative first-reveal artifact
        uses: actions/download-artifact@v4
        with:
          name: issue84-phasec-first-reveal
          path: _first_reveal_download
          github-token: ${{ github.token }}
          repository: daito-dot/LETSGO-Voynich
          run-id: 34012762571

      - name: Verify and stage exact artifact bytes
        shell: bash
        run: |
          test "$(sha256sum _first_reveal_download/phase84c_results.json | cut -d' ' -f1)" = "e5d688b15538288b435cfdf17ed582d0de13c6d6209f93e67d3096199e84e58b"
          test "$(sha256sum _first_reveal_download/phase84c_summary.json | cut -d' ' -f1)" = "d3762647c2d945c90dec4e13e5af983aa9010be5ccb634e869ab3aabcb32183a"
          mkdir -p experiments/cross-linguistic-baselines/first-reveal-c
          cp _first_reveal_download/phase84c_results.json experiments/cross-linguistic-baselines/first-reveal-c/
          cp _first_reveal_download/phase84c_summary.json experiments/cross-linguistic-baselines/first-reveal-c/
          cp _first_reveal_download/PROVENANCE.md experiments/cross-linguistic-baselines/first-reveal-c/
          cp _first_reveal_download/SHA256SUMS experiments/cross-linguistic-baselines/first-reveal-c/
          cat > experiments/cross-linguistic-baselines/first-reveal-c/ARTIFACT.md <<'EOF'
          # Authoritative GitHub Actions artifact

          - workflow run: `34012762571`
          - artifact id: `9982984175`
          - artifact name: `issue84-phasec-first-reveal`
          - artifact ZIP SHA-256: `fb6ee38114f7c016b4d621237cf4a4b1e0d0d17e4317b51c22591dcaf3cee4af`
          - result JSON SHA-256: `e5d688b15538288b435cfdf17ed582d0de13c6d6209f93e67d3096199e84e58b`
          - compact summary SHA-256: `d3762647c2d945c90dec4e13e5af983aa9010be5ccb634e869ab3aabcb32183a`
          - first-reveal scientific head: `2dbb153c492cee3f1ba0b0cc63087900d31dc4a7`

          Files here were copied byte-for-byte from the first successful authoritative Phase-C artifact. Raw downloaded historical source files are intentionally not committed.
          EOF

          # Retire source-audit / preflight write-on-push helpers after the reveal.
          rm -f .github/workflows/issue84-phase-c0-source-audit.yml
          rm -f .github/workflows/issue84-phase-c0-layout-audit.yml
          rm -f .github/workflows/issue84-phase-c-preflight.yml
          rm -f .github/workflows/issue84-phase-c-archive.yml
          rm -rf _first_reveal_download

      - name: Commit immutable first reveal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/cross-linguistic-baselines/first-reveal-c .github/workflows
          git commit -m 'Archive Issue #84 Phase C first reveal'
          git push origin HEAD:research/issue84-phase-c-genre-controls
