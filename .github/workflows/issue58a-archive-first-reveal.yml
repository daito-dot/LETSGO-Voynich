name: Archive Issue58A first reveal

on:
  push:
    branches: [issue58-occupancy-graph]
    paths:
      - '.github/workflows/issue58a-archive-first-reveal.yml'

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue58-occupancy-graph
          fetch-depth: 0

      - name: Download exact first-reveal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o issue58a-first-reveal.zip \
            "https://api.github.com/repos/daito-dot/LETSGO-Voynich/actions/artifacts/9760539131/zip"
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('issue58a-first-reveal.zip') as z:
              names=z.namelist()
              assert names == ['issue58a_results.json'], names
              z.extractall('issue58a-first-reveal')
          PY

      - name: Verify exact raw result
        shell: bash
        run: |
          set -euo pipefail
          RAW=issue58a-first-reveal/issue58a_results.json
          test "$(sha256sum "$RAW" | awk '{print $1}')" = "ae0db7dc72cb890a325ef5313a3375a43efde7c27c9bd5b3fcb0632fb808e152"
          python - <<'PY'
          import json
          p='issue58a-first-reveal/issue58a_results.json'
          r=json.load(open(p))
          assert r['classification'] == 'BROAD OCCUPANCY GRAMMAR; SLOT3xSLOT5 NOT UNIQUE'
          assert r['primary_min']['selected_edge']['pair'] == [3,5]
          assert r['primary_min']['selected_edge']['rank_by_mean_gain'] == 22
          assert len(r['primary_min']['familywise_qualifying_edges']) == 22
          PY

      - name: Create permanent deterministic archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/occupancy-graph/first-reveal
          gzip -n -9 -c issue58a-first-reveal/issue58a_results.json \
            > experiments/occupancy-graph/first-reveal/issue58a_results.json.gz
          RAW_SHA=$(sha256sum issue58a-first-reveal/issue58a_results.json | awk '{print $1}')
          GZ_SHA=$(sha256sum experiments/occupancy-graph/first-reveal/issue58a_results.json.gz | awk '{print $1}')
          cat > experiments/occupancy-graph/first-reveal/SHA256SUMS.txt <<EOF
          ${RAW_SHA}  issue58a_results.json
          ${GZ_SHA}  issue58a_results.json.gz
          EOF
          cat > experiments/occupancy-graph/first-reveal/PROVENANCE.md <<EOF
          # Issue #58A exact first-reveal archive

          This directory preserves the exact raw JSON bytes produced by the audited first reveal, compressed deterministically with \`gzip -n -9\`.

          - GitHub Actions run: \`33399104345\`
          - job: \`99510744309\`
          - PR: \`#60\`
          - audited branch head: \`d0588651870f7cb818b74e2d9402bec3c103f412\`
          - plan commit: \`84243646f5276ed1959f41f2e4c179c7357ead87\`
          - executable commit: \`37968752114524de1ac4aa0c21489d55cbaa5239\`
          - source Git blob: \`2a4533ab9bdfa85db9bad602d590978953055df1\`
          - artifact ID: \`9760539131\`
          - artifact name: \`issue58a-occupancy-graph-66674e1a69b013cb398f0d2b3a69b991100d4739\`
          - artifact ZIP digest reported by GitHub: \`sha256:4dafa489e591a92c0f94a8c9416186fe5f25512d0b1d41a99e52c203b31b8eb6\`
          - raw JSON SHA-256: \`${RAW_SHA}\`
          - archived gzip SHA-256: \`${GZ_SHA}\`

          To verify the raw result later:

          \`gzip -dc issue58a_results.json.gz | sha256sum\`

          Expected raw SHA-256: \`ae0db7dc72cb890a325ef5313a3375a43efde7c27c9bd5b3fcb0632fb808e152\`.
          EOF

      - name: Commit archive to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/occupancy-graph/first-reveal
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Archive exact Issue58A first-reveal result"
          git push origin HEAD:issue58-occupancy-graph
