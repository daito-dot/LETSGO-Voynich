name: Phase64A sync research state

on:
  push:
    branches: [phase64a-record]
    paths:
      - '.github/workflows/phase64a-sync-research-state.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recording branch
        uses: actions/checkout@v4
        with:
          ref: phase64a-record

      - name: Guarded research-state update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {n}')
              return text.replace(old,new,1)

          # STATUS
          p=Path('research/STATUS.md'); s=p.read_text()
          s=replace_once(s,
              'The Phase62/63 mechanism program now provides three qualitatively stronger layers beyond exploratory fit:\n\n1. **sealed prospective support** for the frozen A1 local-family mechanism on previously unseen recurrence-distance geometry;\n2. **target-dependence robustness** showing that this advantage survives removal of token types unique to held-out physical leaves;\n3. **independent-transcription replication** showing that the key entry/recurrence structure survives an independent v101 transcription and an independent EvaT reading, while frozen ZL-selected A1 parameters transfer to the EvaT reading without retuning.\n',
              'The Phase62–64 mechanism program now provides four qualitatively stronger layers beyond exploratory fit:\n\n1. **sealed prospective support** for the frozen A1 local-family mechanism on previously unseen recurrence-distance geometry;\n2. **target-dependence robustness** showing that this advantage survives removal of token types unique to held-out physical leaves;\n3. **independent-transcription replication** showing that the key entry/recurrence structure survives an independent v101 transcription and an independent EvaT reading, while frozen ZL-selected A1 parameters transfer to the EvaT reading without retuning;\n4. **inventory-autonomy stress testing** showing that the core H62 recurrence geometry survives a drastic synthetic-vocabulary replacement, while the strict full autonomy gate fails on canonical ZL because aggregate S3 falls below the frozen threshold.\n',
              'STATUS evidence staircase')
          s=replace_once(s,
              '- **G:** A1/A1-R1 is the **leading tested structural mechanism with prospective support, held-out-vocabulary robustness, and independent-reading transfer**. Phase63B materially reduces the objection that its strongest evidence is a ZL3b/EVA transcription artifact. A1 remains training-manuscript-dependent, historically/semantically ungrounded, non-autonomous in morphology and structurally imperfect.\n',
              '- **G:** A1 remains the **leading tested structural mechanism for the core recurrence signature**, with prospective support, held-out-vocabulary robustness and independent-reading transfer. Phase64A does **not** establish full inventory autonomy: ZL fails the frozen omnibus gate on S3 (`0.468×`). However H62 survives synthetic-vocabulary replacement almost unchanged in both ZL and IT, strongly weakening the claim that its prospective success is merely copied from the empirical token membership/edit graph. A1 remains historically/semantically ungrounded and structurally incomplete.\n',
              'STATUS G bullet')
          marker='## Current frontier — Phase64 mechanism-family fairness/autonomy gate\n'
          if marker not in s: raise SystemExit('STATUS frontier marker missing')
          phase64='''## Phase64A — empirical-inventory autonomy ablation: MIXED / STRICT GATE FAIL\n\nA1-R2/MG0 replaces the empirical outer-training token list with a synthetic vocabulary from a frozen low-order character Markov model. Order `2` was selected by training-only inner CV in all 10 outer folds. Synthetic vocabularies overlap empirical training vocabularies only about **20.2% (ZL)** / **22.7% (IT)** and held-out vocabularies about **11.7% / 13.4%**; edit1 connectivity is approximately halved.\n\n### ZL primary\n\nA1-R2 / held-out ZL ratios:\n\n- S1 **0.84668× — pass**\n- S2 **0.92025× — pass**\n- S3 **0.46772× — frozen fail**\n\nH62 remains strong: mean `D_profile` **0.76160**, mean `|ΔC_short|` **0.12030**, with **5/5 wins against both N0 and C0 on both diagnostics**. Relative to A1-R1, H62 changes negligibly.\n\n### IT independent arm\n\nRatios are **1.13567 / 0.97605 / 0.58586**, all passing. H62 mean `D_profile` **0.83163**, mean `|ΔC_short|` **0.07486**; the full frozen IT source-arm criterion passes.\n\nFrozen classification:\n\n> **INCONSISTENT / PRIMARY FAILURE — independent IT passes but canonical ZL fails the frozen inventory-autonomy gate.**\n\nAccepted interpretation:\n\n> **Full A1 inventory autonomy is not established. However, the prospective near-family recurrence geometry is highly robust to removal of the explicit empirical token inventory and exact empirical edit1 topology; the remaining canonical failure is concentrated in aggregate S3.**\n\nDo not relax the S3 threshold or add A2 machinery to repair `0.468×`. S3 is retained as a real frozen failure even though prior phases show it is a weak discriminator and aggregate scalar can hide coordinate mismatch.\n\nFirst reveal: run `33335306504`, artifact `9738893689`, ZIP SHA-256 `058852cfc8bf5d718d200f05758d21452f45715d35a2b682f7422afc6261d8fc`, raw JSON SHA-256 `43b59ad8539db4cf089e6265c38f81ec9afd2f864877b77373a12adbdccdce1b`.\n\n'''
          s=s.replace(marker,phase64+marker,1)
          start=s.index(marker); end=s.index('## Current interpretation limits',start)
          newfront='''## Current frontier — serious bounded C1 fairness challenge\n\nPhase64A sharply reduces the value of further post-result G tuning: the core H62 mechanism survives inventory replacement, while the remaining ZL failure is a weak aggregate S3 scalar that should not be repaired after reveal.\n\nThe highest-value unresolved objection is now **family-comparison unfairness**. C0 was deliberately simple. The next frontier is therefore to freeze a materially stronger but bounded **C1 meaningful-text + encoding/shorthand model** with explicit complexity cost and no Voynich-specific boundary tuning.\n\nC1 must be independently motivated, selected only inside training folds, and challenged on the same held-out exposed scorecard plus H62. It must not copy A1's previous-10 mechanism under a cipher label. A C1 pass would reopen the meaningful/cipher mechanism interpretation; a serious C1 failure would strengthen G relative to a fairer competitor, but still would not prove semantic absence.\n\nThe independently grounded content bridge remains essential before semantic promotion and is still prerequisite-limited.\n\n'''
          s=s[:start]+newfront+s[end:]
          p.write_text(s)

          # LEDGER
          p=Path('research/hypothesis-ledger.md'); s=p.read_text()
          s=replace_once(s,
              '| P64-G-AUTO | A1\'s structural advantage survives removal of the empirical training token inventory as the output vocabulary | NEXT FROZEN CHALLENGE — NOT YET TESTED | Phase63A removed held-out-only vocabulary but retained training-side empirical token inventory/morphology. Phase64A must define a lower-level frozen morphology generator without adding residual-repair mechanisms, then test exposed + H62 geometry prospectively. |',
              '| P64-A1-R2 | A1\'s structural advantage survives removal of the empirical training token inventory as the output vocabulary | **MIXED / STRICT AUTONOMY NOT SUPPORTED** | Phase64A: ZL S1/S2 pass (`0.847×/0.920×`) but S3 fails the frozen lower bound at `0.468×`; IT passes all three (`1.136×/0.976×/0.586×`). Despite synthetic vocab train overlap only ~20–23%, held-out overlap ~12–13% and roughly halved edit1 connectivity, H62 remains essentially unchanged: ZL D `0.762`, C-short error `0.120`, 5/5 wins vs N0/C0 on both; IT D `0.832`, C-short `0.0749` and full arm pass. Full autonomy is not established, but empirical inventory membership is strongly weakened as the explanation for the prospective H62 success. |',
              'ledger P64 autonomy row')
          s=replace_once(s,
              '| P64-C1 | A materially stronger but bounded meaningful-text + encoding model can rival A1 under explicit complexity cost | OPEN DESIGN CHALLENGE | C0 was intentionally weak/global/boundary-blind. A family-level G conclusion is premature until a historically/mathematically motivated C1 receives a separately frozen fair test. |',
              '| P64-C1 | A materially stronger but bounded meaningful-text + encoding model can rival A1 under explicit complexity cost | **NEXT FAIRNESS CHALLENGE — DESIGN REQUIRED** | Phase64A makes further G-side repair lower value: H62 survives inventory removal while only ZL aggregate S3 fails. C0 remains intentionally weak/global/boundary-blind, so the next high-information test is a separately frozen, independently motivated C1. |',
              'ledger C1 row')
          s=replace_once(s,
              'The tested A1 mechanism now has four increasingly independent evidence layers:',
              'The tested A1 mechanism now has five increasingly independent evidence layers:',
              'ledger evidence count')
          anchor='### Independent-transcription replication\n\n- GC2a/v101 reproduces entry specialization and positive short-range recurrence concentration in 5/5 folds without conversion to EVA.\n- IT2a/EvaT reproduces the same observational effects and supports full frozen A1-R1 transfer.\n- IT A1-R1 / IT exposed ratios are `0.737 / 1.586 / 0.647`.\n- IT H62 mean D is `0.830` versus N0 `1.477` / C0 `1.797`; mean `|ΔC_short|` is `0.0718` versus `0.622 / 1.292`.\n\n'
          if anchor not in s: raise SystemExit('ledger independent anchor missing')
          s=s.replace(anchor,anchor+'''### Inventory-autonomy stress test\n\n- A1-R2/MG0 removes the explicit empirical training-token membership list as output vocabulary.\n- ZL strict source-arm gate fails only because S3 is `0.468×`; S1/S2 pass and H62 beats N0/C0 5/5 on both diagnostics.\n- IT passes the entire frozen source-arm gate.\n- H62 is nearly unchanged from A1-R1 despite low synthetic-vocabulary overlap and roughly half the empirical edit1 connectivity.\n\n''',1)
          s=replace_once(s,
              'The next executable challenge is **G autonomy**, not A2 repair. In parallel, C1 must be designed seriously enough that later family-level claims are not based on comparing a developed G model only against deliberately weak C/N baselines.',
              'The next executable challenge is a **serious bounded C1**, not A2/S3 repair. Phase64A retains the strict ZL autonomy failure while showing that the core H62 success is not dependent on explicit empirical token membership; family-comparison unfairness is now the higher-value objection.',
              'ledger next challenge')
          p.write_text(s)

          # ROADMAP
          p=Path('ROADMAP.md'); s=p.read_text()
          s=replace_once(s,
              '| **Phase 64** | **🟡 current strategic gate** | freeze the next highest-information challenge: G autonomy vs serious bounded C1, while content remains prerequisite-limited |',
              '| **Phase 64A** | **✅ mixed / strict autonomy fail** | synthetic-vocabulary A1 preserves core H62 geometry, but canonical ZL fails frozen S3 gate at `0.468×`; IT arm passes |\n| **Phase 64B / C1** | **🟡 current fairness gate** | freeze a serious bounded meaningful-text + encoding/shorthand competitor before any family-level conclusion |',
              'roadmap current table')
          oldhead='## 🟡 Phase64 — next strategic gate\n'
          if oldhead not in s: raise SystemExit('roadmap Phase64 heading missing')
          phase64sec='''## Phase64A — empirical-inventory autonomy: COMPLETE / MIXED\n\nMG0 order 2 was selected by training-only CV in all ZL/IT folds. Synthetic vocabularies retained only ~20–23% training membership and ~12–13% held-out membership, with edit1 connectivity roughly halved.\n\nZL ratios: **0.847 / 0.920 / 0.468**. S3 alone fails the frozen `[0.5,2]` gate. ZL H62 remains `D=0.762`, `|ΔC_short|=0.120` and wins 5/5 against N0/C0 on both diagnostics.\n\nIT ratios: **1.136 / 0.976 / 0.586**, all pass. IT H62 `D=0.832`, `|ΔC_short|=0.0749`; full arm passes.\n\nFrozen classification: **INCONSISTENT / PRIMARY FAILURE**. Do not repair S3 after reveal. The important retained result is that explicit empirical inventory membership is not required for the core prospective recurrence geometry under tested MG0.\n\n'''
          s=s.replace(oldhead,phase64sec+oldhead,1)
          start=s.index(oldhead); end=s.index('## Later model-family work',start)
          newgate='''## 🟡 Phase64B — serious bounded C1 fairness gate\n\n### Question\n\n> Can a materially stronger, independently motivated meaningful-text + cipher/shorthand mechanism rival A1 on held-out entry/locality and H62 recurrence geometry without importing A1's previous-10 process or Voynich-specific boundary tuning?\n\n### Why now\n\nPhase64A makes A2 repair low-value and family fairness high-value. C0 was intentionally weak. A developed G candidate cannot support `G > C` at family level until C receives a serious, complexity-charged challenge.\n\n### Freeze requirements\n\n1. plaintext corpus/source rule fixed independently of Voynich outcomes;\n2. historically or mathematically motivated encoding/shorthand operations;\n3. no Voynich-specific paragraph/section rules unless explicitly charged;\n4. nested training-only model selection;\n5. explicit complexity/dependence ledger;\n6. same held-out S1/S2/S3 and H62 scorecard;\n7. at least one prospective discriminator frozen before C1 output is seen;\n8. no copying of A1's explicit previous-10 local-family mechanism under a cipher label.\n\nContent relation remains essential but mapping-prerequisite limited.\n\n'''
          s=s[:start]+newgate+s[end:]
          s=replace_once(s,
              '- **M6 mechanism autonomy / fair strong competitor:** 🟡 Phase64 current.\n- **M7 content relation:** ⛔ not established.\n- **M8 decipherment threshold:** ⛔ not reached.',
              '- **M6 mechanism autonomy:** ✅ Phase64A mixed — strict full autonomy not supported; core H62 survives inventory removal.\n- **M7 fair strong C competitor:** 🟡 Phase64B/C1 current.\n- **M8 content relation:** ⛔ not established.\n- **M9 decipherment threshold:** ⛔ not reached.',
              'roadmap milestones')
          start=s.index('## What to do when asked simply to "continue"')
          newtail='''## What to do when asked simply to "continue"\n\n1. finish Phase64A replay/result integration if not yet on main;\n2. freeze **Phase64B/C1** source family, operations, complexity ledger and falsification criteria before any C1 output is computed;\n3. do not repair A1-R2 S3 or add A2;\n4. give C1 materially more representational power than C0, but do not smuggle in Voynich-specific boundary/locality rules;\n5. preserve the content bridge as the later semantic gate.\n'''
          s=s[:start]+newtail
          p.write_text(s)

          # RESUME
          p=Path('RESUME.md'); s=p.read_text()
          marker='## Current frontier — Phase64\n'
          if marker not in s: raise SystemExit('RESUME frontier marker missing')
          phase64='''## Phase64A — empirical-inventory autonomy: MIXED / PRIMARY FAIL\n\nA1-R2/MG0 replaces the explicit empirical training-token inventory with order-2 character-Markov synthetic vocabularies. Training-only CV selected order 2 in all 10 folds. Synthetic vocabularies overlap training types only ~20–23% and held-out types ~12–13%; edit1 connectivity is roughly halved.\n\nZL primary ratios: **S1 0.84668 / S2 0.92025 / S3 0.46772**. S3 alone fails the frozen gate. H62 remains strong (`D=0.76160`, `|ΔC_short|=0.12030`) and beats N0/C0 5/5 on both diagnostics.\n\nIT independent ratios: **1.13567 / 0.97605 / 0.58586**, all pass. H62 `D=0.83163`, `|ΔC_short|=0.07486`; the full source-arm gate passes.\n\nFrozen overall classification:\n\n> **INCONSISTENT / PRIMARY FAILURE — independent IT passes but canonical ZL fails the frozen inventory-autonomy gate.**\n\nRetain both conclusions simultaneously: full inventory autonomy is not established, but the core prospective recurrence geometry is highly robust to removal of explicit empirical vocabulary membership/topology. Do not repair ZL S3 after seeing this result.\n\nFirst reveal: head `5e9121f7e05d8950f223298a44b816d6ee088e07`, run `33335306504`, artifact `9738893689`, raw JSON SHA-256 `43b59ad8539db4cf089e6265c38f81ec9afd2f864877b77373a12adbdccdce1b`.\n\n'''
          s=s.replace(marker,phase64+marker,1)
          start=s.index(marker); end=s.index('## Research families',start)
          newfront='''## Current frontier — Phase64B/C1\n\nWhen asked to continue:\n\n1. finish/verify Phase64A replay and merge result state to main;\n2. freeze a **serious bounded C1** before computing any C1 output;\n3. C1 must start from meaningful plaintext and independently motivated cipher/shorthand operations, with explicit complexity cost;\n4. use nested training-only selection and the same held-out S1/S2/S3 + H62 scorecard;\n5. freeze an additional prospective discriminator before reveal;\n6. do not copy A1's explicit previous-10 mechanism or add Voynich-specific boundary tuning;\n7. do not repair A1-R2 S3 in parallel.\n\nThe scientific reason for the pivot is that Phase64A leaves only a narrow ZL S3 omnibus failure while the core H62 signature survives a severe inventory/topology intervention. The larger unresolved threat to interpretation is now that C0 was an underpowered competitor.\n\n'''
          s=s[:start]+newfront+s[end:]
          s=replace_once(s,
              '- **C:** C0 limited/insufficient; serious bounded C1 still owed.\n- **G:** A1/A1-R1 currently leads tested structural mechanisms prospectively, survives held-out-vocabulary restriction and independent-transcription transfer, but remains morphology-dependent and historically/semantically ungrounded.',
              '- **C:** C0 limited/insufficient; serious bounded C1 is the current fairness frontier.\n- **G:** A1/A1-R1 currently leads the tested core recurrence mechanism prospectively. A1-R2 shows H62 survives drastic inventory replacement, but strict full autonomy fails on canonical ZL S3; G remains historically/semantically ungrounded and structurally incomplete.',
              'RESUME family bullets')
          p.write_text(s)
          PY

      - name: Commit synchronized research state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/STATUS.md research/hypothesis-ledger.md ROADMAP.md RESUME.md
          git diff --cached --check
          git commit -m "Synchronize research state after Phase 64A"
          git push origin HEAD:phase64a-record
