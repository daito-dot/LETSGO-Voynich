name: Issue72 V2 Stage C0 target-blind fixed-path support freeze

on:
  push:
    branches: [issue72-r1-causal-decomposition-v2]
    paths:
      - 'experiments/naibbe-r1-decomposition-v2/STAGE_C_FIXED_PATH_RANDOMIZATION_PLAN.md'
      - 'experiments/naibbe-r1-decomposition-v2/c0_support72_v2.py'
      - '.github/workflows/issue72-v2-stage-c0-support.yml'

permissions:
  contents: write

jobs:
  c0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact C0 branch head
        uses: actions/checkout@v4
        with:
          ref: issue72-r1-causal-decomposition-v2
          fetch-depth: 0

      - name: Verify preregistration chronology and target firewall
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 98a04953aabe9e228a17fa5808adf506a0833362 HEAD)" = "98a04953aabe9e228a17fa5808adf506a0833362"
          PLAN=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/STAGE_C_FIXED_PATH_RANDOMIZATION_PLAN.md | tail -1)
          SCRIPT=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/c0_support72_v2.py | tail -1)
          WORKFLOW=$(git log --diff-filter=A --format=%H -- .github/workflows/issue72-v2-stage-c0-support.yml | tail -1)
          test -n "$PLAN" && test -n "$SCRIPT" && test -n "$WORKFLOW"
          git merge-base --is-ancestor "$PLAN" "$SCRIPT"
          git merge-base --is-ancestor "$SCRIPT" "$WORKFLOW"
          test ! -e experiments/naibbe-r1-decomposition-v2/c1_r1_target72_v2.py
          test ! -e experiments/naibbe-r1-decomposition-v2/STAGE_C_TARGET_IMPLEMENTATION.md
          echo "PLAN_FIRST_ADD=$PLAN" >> "$GITHUB_ENV"
          echo "SCRIPT_FIRST_ADD=$SCRIPT" >> "$GITHUB_ENV"
          echo "WORKFLOW_FIRST_ADD=$WORKFLOW" >> "$GITHUB_ENV"
          echo "SCIENTIFIC_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify exact Stage B2 raw authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < experiments/naibbe-r1-decomposition-v2/archive/stage_b2_calibration.json)" -eq 157852
          echo '2da5f0a4f8191820875ed264284f2d3b651489a7e8aeed3805cc2ed4d08c5147  experiments/naibbe-r1-decomposition-v2/archive/stage_b2_calibration.json' | sha256sum -c -

      - name: Checkout frozen CREMMA authority
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout pinned Naibbe authority
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: external/naibbe

      - name: Verify external source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"
          test "$(git -C external/naibbe rev-parse HEAD)" = "f2675ec5dd275268bc64dd48ea64fc0e0e9827a2"
          test "$(git -C external/naibbe hash-object naibbe_v2.py)" = "b566ad82e4b6ff0782ecdddebf77718dac44f292"
          test "$(git -C external/naibbe hash-object references/naibbe_tables.csv)" = "5cd34fb81d80faf3b4d57dbf1719c05ffde25302"
          test "$(git -C external/naibbe hash-object decrypt_naibbe.py)" = "b56a1e6e615a7b2e31ad386efdf7e6f2ef2b9d7b"

      - name: Install frozen preexisting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pandas

      - name: Compile C0 support implementation
        run: python -m py_compile experiments/naibbe-r1-decomposition-v2/c0_support72_v2.py

      - name: Execute target-blind C0 support freeze
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/issue72-c0
          mkdir -p /tmp/issue72-c0
          python experiments/naibbe-r1-decomposition-v2/c0_support72_v2.py \
            external/cremma external/naibbe \
            experiments/naibbe-r1-decomposition-v2/archive/stage_b2_calibration.json \
            /tmp/issue72-c0 \
            > /tmp/issue72-c0/stdout.txt
          test -s /tmp/issue72-c0/stage_c0_support.json
          test -s /tmp/issue72-c0/MANIFEST.json
          test "$(find /tmp/issue72-c0 -maxdepth 1 -name 'trace_rep*_*.json.gz' | wc -l)" -eq 20

      - name: Enforce C0 invariants and scientific firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/issue72-c0/stage_c0_support.json').read_text())
          assert r['status']=='STAGE C0 FIXED-PATH RANDOMIZATION SUPPORT FROZEN'
          assert r['stage_b2_authority_sha256']=='2da5f0a4f8191820875ed264284f2d3b651489a7e8aeed3805cc2ed4d08c5147'
          assert r['population']['process_reps']==list(range(5))
          assert r['population']['axes']==['EL','ES','ET','EG']
          assert r['population']['randomizations_per_axis']==31
          assert len(r['trace_manifest'])==20
          assert all(v is False for v in r['target_access'].values())
          for row in r['trace_manifest'].values():
              assert row['instrumented_equals_historical_primary'] is True
              assert row['instrumented_equals_historical_raw'] is True
              assert row['trace_render_equals_instrumented_primary'] is True
              assert row['trace_render_equals_instrumented_raw'] is True
              assert row['historical_ambiguity_retries']==row['instrumented_ambiguity_retries']
          for axis in ['EL','ES','ET','EG']:
              assert list(r['randomizations'][axis])==[f'r{i}' for i in range(31)]
              for x in r['randomizations'][axis].values():
                  assert x['retry_history_not_rerun'] is True
                  assert x['spacing_mask_not_rerun'] is True
                  assert x['ambiguity_legality']['role']=='DIAGNOSTIC_ONLY_NOT_A_REPAIR_OR_ELIGIBILITY_GATE'
                  assert x['invariants']['unreachable_jkw_unchanged'] is True
                  assert x['common_support']['visible_positions']==r['baseline']['pooled_five_path_parser_support']['visible_tokens']
          print('C0 status:',r['status'])
          print('baseline pooled coverage:',r['baseline']['pooled_five_path_parser_support']['coverage'])
          for axis in ['EL','ES','ET','EG']:
              xs=list(r['randomizations'][axis].values())
              cov=[x['parser_support']['coverage'] for x in xs]
              com=[x['common_support']['common_support_fraction'] for x in xs]
              chg=[x['common_support']['changed_final_token_fraction'] for x in xs]
              amb=[x['ambiguity_legality']['admissible_fraction'] for x in xs]
              cells=[x['invariants']['changed_effective_cell_fraction'] for x in xs]
              print(axis,{
                  'coverage_min':min(cov),'coverage_median':sorted(cov)[15],'coverage_max':max(cov),
                  'common_min':min(com),'common_median':sorted(com)[15],'common_max':max(com),
                  'changed_token_min':min(chg),'changed_token_max':max(chg),
                  'ambiguity_min':min(amb),'ambiguity_max':max(amb),
                  'changed_cell_min':min(cells),'changed_cell_max':max(cells),
              })
          PY

      - name: Freeze exact C0 provenance and hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/issue72-c0/stage_c0_support.json /tmp/issue72-c0/MANIFEST.json /tmp/issue72-c0/trace_rep*_*.json.gz | sort > /tmp/issue72-c0/SHA256SUMS.txt
          cat > /tmp/issue72-c0/PROVENANCE.txt <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          scientific_head=${SCIENTIFIC_HEAD}
          parent_main=98a04953aabe9e228a17fa5808adf506a0833362
          stage_c_plan_first_add=${PLAN_FIRST_ADD}
          stage_c0_script_first_add=${SCRIPT_FIRST_ADD}
          stage_c0_workflow_first_add=${WORKFLOW_FIRST_ADD}
          stage_b2_raw_sha256=2da5f0a4f8191820875ed264284f2d3b651489a7e8aeed3805cc2ed4d08c5147
          counterfactual_R1_target_scored=false
          PT_generated_or_scored=false
          FI_generated_or_scored=false
          EOF
          cat /tmp/issue72-c0/SHA256SUMS.txt
          cat /tmp/issue72-c0/PROVENANCE.txt

      - name: Upload exact C0 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue72-v2-stageC0-support-${{ env.SCIENTIFIC_HEAD }}
          path: /tmp/issue72-c0
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Permanently commit exact C0 support and traces
        shell: bash
        run: |
          set -euo pipefail
          DEST=experiments/naibbe-r1-decomposition-v2/stage-c0
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp /tmp/issue72-c0/stage_c0_support.json "$DEST/"
          cp /tmp/issue72-c0/MANIFEST.json "$DEST/"
          cp /tmp/issue72-c0/trace_rep*_*.json.gz "$DEST/"
          cp /tmp/issue72-c0/SHA256SUMS.txt "$DEST/"
          cp /tmp/issue72-c0/PROVENANCE.txt "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m 'Issue72 V2 C0: freeze target-blind fixed-path support authority'
          git push origin HEAD:issue72-r1-causal-decomposition-v2
