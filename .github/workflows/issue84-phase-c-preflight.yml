name: Issue84 Phase C extraction preflight

on:
  push:
    branches: [research/issue84-phase-c-genre-controls]
    paths:
      - 'experiments/cross-linguistic-baselines/PLAN_C.md'
      - 'experiments/cross-linguistic-baselines/REPORT_C0_SOURCE_AUDIT.md'
      - 'experiments/cross-linguistic-baselines/phase84c.py'
      - '.github/workflows/issue84-phase-c-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy

      - name: Compile Phase C executable
        run: python -m py_compile experiments/cross-linguistic-baselines/phase84c.py

      - name: Run source/hash/extraction preflight only
        shell: bash
        run: |
          mkdir -p _phase84c_cache out
          python experiments/cross-linguistic-baselines/phase84c.py "$(pwd)/_phase84c_cache" --preflight | tee out/preflight.json
          grep -q '^TARGET_SCORE_CALLS=0$' out/preflight.json
          ! grep -q 'score source' out/preflight.json
          rm -rf _phase84c_cache

      - name: Freeze preflight provenance
        shell: bash
        run: |
          cat > out/PROVENANCE.md <<EOF
          # Issue #84 Phase C score-free preflight
          - workflow run: ${GITHUB_RUN_ID}
          - scientific head: ${GITHUB_SHA}
          - plan freeze: 9f9bfc5f55041d3a6845b764758b1e0d164bcedf
          - target score calls: 0
          EOF
          sha256sum out/preflight.json out/PROVENANCE.md > out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: issue84-phasec-score-free-preflight
          path: out/
          retention-days: 90
          if-no-files-found: error
