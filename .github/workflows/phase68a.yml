name: Phase 68A exact formal-residual lexical test

on:
  push:
    branches:
      - phase68-lexical-content
    paths:
      - 'experiments/phase68/**'
      - '.github/workflows/phase68a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-lexical-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy

      - name: Verify Phase61 edit1 relation is unchanged in Phase67 mask
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          def fn_src(path, name):
              tree = ast.parse(Path(path).read_text())
              src = Path(path).read_text()
              for n in tree.body:
                  if isinstance(n, ast.FunctionDef) and n.name == name:
                      return ast.get_source_segment(src, n)
              raise RuntimeError(name)
          a = fn_src('experiments/phase61/phase61c_joint_model.py', 'lev1')
          b = fn_src('experiments/phase67/run_phase67c.py', 'lev1')
          assert a == b, 'Phase67 lev1 no longer exactly matches Phase61C'
          print('historical lev1 identity: PASS')
          PY

      - name: Compile frozen executable
        run: python -m py_compile experiments/phase68/run_phase68a.py

      - name: Run frozen exact test
        run: |
          python experiments/phase68/run_phase68a.py --out experiments/phase68/RESULT_A.json
          cat experiments/phase68/RESULT_A.json

      - name: Record exact hashes
        run: |
          sha256sum \
            experiments/phase68/PLAN_A.md \
            experiments/phase68/run_phase68a.py \
            experiments/phase67/BLOCK_MANIFEST_A.json \
            experiments/phase67/TEXT_TABLE_A.json \
            experiments/phase67/IMAGE_ANNOTATION_A.json \
            experiments/phase67/ROOT_ANNOTATION_B.json \
            experiments/phase67/run_phase67c.py \
            experiments/phase61/phase61c_joint_model.py \
            experiments/phase68/RESULT_A.json \
            | tee experiments/phase68/SHA256SUMS_A.txt

      - name: Upload Phase68A result
        uses: actions/upload-artifact@v4
        with:
          name: phase68a-lexical-results
          path: |
            experiments/phase68/RESULT_A.json
            experiments/phase68/SHA256SUMS_A.txt
          if-no-files-found: error
