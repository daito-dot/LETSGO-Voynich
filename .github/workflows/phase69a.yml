name: Phase 69A long-range A1 model check

on:
  push:
    branches:
      - phase69-long-range-state-science
    paths:
      - 'experiments/phase69/**'
      - '.github/workflows/phase69a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-range-model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run frozen Phase69A test
        run: python experiments/phase69/run_phase69a.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: phase69a-result
          path: experiments/phase69/RESULT_A.json
