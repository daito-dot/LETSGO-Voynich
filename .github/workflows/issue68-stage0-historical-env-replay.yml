name: Issue68 Stage0 historical-environment replay

on:
  push:
    branches: [issue68-joint-constraint-tournament]
    paths:
      - '.github/workflows/issue68-stage0-historical-env-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout LETSGO-Voynich
        uses: actions/checkout@v4
        with:
          ref: issue68-joint-constraint-tournament

      - name: Checkout frozen CREMMA corpus exactly as Phase62
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout frozen ZL3b mirror exactly as Phase62
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"

      - name: Install numerical dependency exactly as historical workflows
        run: |
          python -m pip install --disable-pip-version-check numpy
          python - <<'PY'
          import sys, numpy
          print('python=',sys.version)
          print('numpy=',numpy.__version__)
          PY

      - name: Replay Phase62C
        shell: bash
        run: |
          set -euo pipefail
          python experiments/phase62/phase62c_c0_a1.py \
            external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            external/cremma \
            > /tmp/phase62c_replay.json
          sha256sum experiments/phase62/phase62c_c0_a1_results.json /tmp/phase62c_replay.json
          python - <<'PY'
          import json
          old=json.load(open('experiments/phase62/phase62c_c0_a1_results.json'))
          new=json.load(open('/tmp/phase62c_replay.json'))
          print('PHASE62C_SEMANTIC_EXACT=',old==new)
          if old != new:
              raise SystemExit(21)
          PY

      - name: Replay Phase62P and verify original first-reveal digest
        shell: bash
        run: |
          set -euo pipefail
          python experiments/phase62/phase62p_h62p1.py \
            external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            external/cremma \
            > /tmp/phase62p_replay.json
          echo "0e1b687ab73efbc494834f49398ed474230f47bcde4cf4dbcaa46631efd75264  /tmp/phase62p_replay.json" | sha256sum -c -
          python - <<'PY'
          import json
          old=json.load(open('experiments/phase62/phase62p_h62p1_results.json'))
          new=json.load(open('/tmp/phase62p_replay.json'))
          assert old == new
          print('PHASE62P_SEMANTIC_EXACT=True')
          PY
