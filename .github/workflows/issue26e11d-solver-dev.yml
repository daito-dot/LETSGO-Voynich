name: Issue26E11D solver development

on:
  push:
    branches: [issue26-music-e11d-solver-validation]
    paths:
      - 'experiments/issue26-music/PLAN_E11D.md'
      - 'experiments/issue26-music/phaseE11d_solver_dev.py'
      - 'experiments/issue26-music/phaseE11_leon_substitution.py'
      - '.github/workflows/issue26e11d-solver-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  solver-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout E11D branch
        uses: actions/checkout@v4
        with:
          ref: issue26-music-e11d-solver-validation
          fetch-depth: 0

      - name: Verify plan predates development executable
        shell: bash
        run: |
          PLAN=$(git log --format=%H -- experiments/issue26-music/PLAN_E11D.md | tail -1)
          SCRIPT=$(git log --format=%H -- experiments/issue26-music/phaseE11d_solver_dev.py | tail -1)
          echo plan=$PLAN script=$SCRIPT
          git merge-base --is-ancestor "$PLAN" "$SCRIPT"

      - name: Assert target data absent
        shell: bash
        run: |
          test ! -e ZL3b-STA1.txt
          test ! -d external/cipher-benchmark

      - name: Checkout frozen CREMMA only
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma
          sparse-checkout: |
            data/BIS-193
            data/CLM13027
            data/Mazarine915
            data/UBL758
          sparse-checkout-cone-mode: false

      - name: Verify Latin commit
        shell: bash
        run: test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"

      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1 numba==0.61.2

      - name: Run development control only
        shell: bash
        run: python experiments/issue26-music/phaseE11d_solver_dev.py external/cremma > issue26e11d_dev.json

      - name: Print development summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open('issue26e11d_dev.json'))
          print('development_passed=',r['development_passed'])
          print('mean_true=',r['mean_true_held_cross_entropy'])
          print('mean_recovered=',r['mean_recovered_held_cross_entropy'])
          print('mean_weighted_accuracy=',r['mean_occurrence_weighted_key_accuracy'])
          for f in r['folds']:
              print('fold',f['fold'],'start=',f['selected_start_kind'],'train=',f['training_cross_entropy'],'held=',f['recovered_held_cross_entropy'],'true=',f['true_held_cross_entropy'],'exact=',f['exact_key_accuracy'],'weighted=',f['occurrence_weighted_key_accuracy'])
          PY
          sha256sum issue26e11d_dev.json

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue26e11d-dev-${{ github.sha }}
          path: issue26e11d_dev.json
          if-no-files-found: error
          retention-days: 90
