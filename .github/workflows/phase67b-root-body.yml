name: Phase 67B root-body science

on:
  push:
    branches:
      - phase67-image-body-science
    paths:
      - 'experiments/phase67/PLAN_B.md'
      - 'experiments/phase67/ROOT_ANNOTATION_B.json'
      - 'experiments/phase67/run_phase67b.py'
      - '.github/workflows/phase67b-root-body.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy

      - name: Validate frozen inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('experiments/phase67')
          manifest = json.loads((base/'BLOCK_MANIFEST_A.json').read_text())
          text = json.loads((base/'TEXT_TABLE_A.json').read_text())
          root = json.loads((base/'ROOT_ANNOTATION_B.json').read_text())
          assert manifest['population_n'] == 14
          assert len(manifest['blocks']) == len(text['records']) == len(root['records']) == 14
          ids_m = [x['block_id'] for x in manifest['blocks']]
          assert ids_m == [x['block_id'] for x in text['records']] == [x['block_id'] for x in root['records']]
          print('Phase67B frozen input validation: PASS')
          PY

      - name: Run frozen primary n123
        run: |
          python experiments/phase67/run_phase67b.py \
            --manifest experiments/phase67/BLOCK_MANIFEST_A.json \
            --text experiments/phase67/TEXT_TABLE_A.json \
            --root experiments/phase67/ROOT_ANNOTATION_B.json \
            --out experiments/phase67/RESULT_B.json \
            --orders 1,2,3
          cat experiments/phase67/RESULT_B.json

      - name: Run frozen secondary n12
        run: |
          python experiments/phase67/run_phase67b.py \
            --manifest experiments/phase67/BLOCK_MANIFEST_A.json \
            --text experiments/phase67/TEXT_TABLE_A.json \
            --root experiments/phase67/ROOT_ANNOTATION_B.json \
            --out experiments/phase67/RESULT_B_N12.json \
            --orders 1,2
          cat experiments/phase67/RESULT_B_N12.json

      - name: Record provenance hashes
        run: |
          sha256sum \
            experiments/phase67/PLAN_B.md \
            experiments/phase67/BLOCK_MANIFEST_A.json \
            experiments/phase67/TEXT_TABLE_A.json \
            experiments/phase67/ROOT_ANNOTATION_B.json \
            experiments/phase67/run_phase67b.py \
            experiments/phase67/RESULT_B.json \
            experiments/phase67/RESULT_B_N12.json \
            | tee experiments/phase67/SHA256SUMS_B.txt

      - name: Upload Phase67B results
        uses: actions/upload-artifact@v4
        with:
          name: phase67b-root-body-results
          path: |
            experiments/phase67/RESULT_B.json
            experiments/phase67/RESULT_B_N12.json
            experiments/phase67/SHA256SUMS_B.txt
          if-no-files-found: error
