name: Archive Issue84 Phase B first reveal

on:
  push:
    branches: [research/issue84-phase-b-cipher-map]
    paths:
      - '.github/workflows/issue84-phase-b-archive.yml'

permissions:
  actions: read
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue84-phase-b-cipher-map

      - name: Download authoritative first-reveal artifact
        uses: actions/download-artifact@v4
        with:
          name: issue84-phaseb-first-reveal
          path: _first_reveal_download
          github-token: ${{ github.token }}
          repository: daito-dot/LETSGO-Voynich
          run-id: 34011823328

      - name: Verify and stage exact artifact bytes
        shell: bash
        run: |
          test "$(sha256sum _first_reveal_download/phase84b_results.json | cut -d' ' -f1)" = "de8ac6882f52000139e3989c1672b86d41946e238ad56ae8053516f754d7a431"
          test "$(sha256sum _first_reveal_download/phase84b_summary.json | cut -d' ' -f1)" = "e0b9b4d1d5e197b4fc0bd40682e758d9db2889d73764b2c4475b8a4f51a04fe4"
          mkdir -p experiments/cross-linguistic-baselines/first-reveal-b
          cp _first_reveal_download/phase84b_results.json experiments/cross-linguistic-baselines/first-reveal-b/
          cp _first_reveal_download/phase84b_summary.json experiments/cross-linguistic-baselines/first-reveal-b/
          cp _first_reveal_download/PROVENANCE.md experiments/cross-linguistic-baselines/first-reveal-b/
          cp _first_reveal_download/SHA256SUMS experiments/cross-linguistic-baselines/first-reveal-b/
          cat > experiments/cross-linguistic-baselines/first-reveal-b/ARTIFACT.md <<'EOF'
          # Authoritative GitHub Actions artifact

          - workflow run: `34011823328`
          - artifact id: `9982705587`
          - artifact name: `issue84-phaseb-first-reveal`
          - artifact ZIP SHA-256: `0264ccd299b6e95a1b9edf12c48ab8a7a026edebfa4b83834e14ce997b8e32a7`
          - result JSON SHA-256: `de8ac6882f52000139e3989c1672b86d41946e238ad56ae8053516f754d7a431`
          - compact summary SHA-256: `e0b9b4d1d5e197b4fc0bd40682e758d9db2889d73764b2c4475b8a4f51a04fe4`

          The files in this directory were copied byte-for-byte from the first successful authoritative Phase-B artifact. `phase84b_stderr.log` and `phase84b_stdout.json` remain preserved in the Actions artifact; the scientific JSON, compact summary, provenance and internal checksums are committed here.
          EOF

          # Remove temporary write/preflight automation before the scientific PR.
          rm -f .github/workflows/issue84-phase-b-prerun-fix.yml
          rm -f .github/workflows/issue84-phase-b-preflight.yml
          rm -f .github/workflows/issue84-phase-b-archive.yml
          rm -rf _first_reveal_download

      - name: Commit immutable first reveal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/cross-linguistic-baselines/first-reveal-b .github/workflows
          git commit -m 'Archive Issue #84 Phase B first reveal'
          git push origin HEAD:research/issue84-phase-b-cipher-map
