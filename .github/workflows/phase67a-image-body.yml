name: Phase 67A image-body science

on:
  push:
    branches:
      - phase67-image-body-science
    paths:
      - 'experiments/phase67/**'
      - '.github/workflows/phase67a-image-body.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy

      - name: Validate frozen inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('experiments/phase67')
          manifest = json.loads((base/'BLOCK_MANIFEST_A.json').read_text())
          text = json.loads((base/'TEXT_TABLE_A.json').read_text())
          image = json.loads((base/'IMAGE_ANNOTATION_A.json').read_text())
          assert manifest['population_n'] == 14
          assert len(manifest['blocks']) == 14
          assert len(text['records']) == 14
          assert len(image['records']) == 14
          assert [x['block_id'] for x in manifest['blocks']] == [x['block_id'] for x in text['records']] == [x['block_id'] for x in image['records']]
          print('frozen input validation: PASS')
          PY

      - name: Run frozen primary test
        run: |
          python experiments/phase67/run_phase67a.py \
            --manifest experiments/phase67/BLOCK_MANIFEST_A.json \
            --text experiments/phase67/TEXT_TABLE_A.json \
            --image experiments/phase67/IMAGE_ANNOTATION_A.json \
            --out experiments/phase67/RESULT_A.json \
            --orders 1,2,3
          cat experiments/phase67/RESULT_A.json

      - name: Run predeclared 1,2-gram sensitivity
        run: |
          python experiments/phase67/run_phase67a.py \
            --manifest experiments/phase67/BLOCK_MANIFEST_A.json \
            --text experiments/phase67/TEXT_TABLE_A.json \
            --image experiments/phase67/IMAGE_ANNOTATION_A.json \
            --out experiments/phase67/RESULT_A_SENSITIVITY_12.json \
            --orders 1,2
          cat experiments/phase67/RESULT_A_SENSITIVITY_12.json

      - name: Record provenance hashes
        run: |
          sha256sum \
            experiments/phase67/PLAN_A.md \
            experiments/phase67/BLOCK_MANIFEST_A.json \
            experiments/phase67/TEXT_TABLE_A.json \
            experiments/phase67/IMAGE_ANNOTATION_A.json \
            experiments/phase67/run_phase67a.py \
            experiments/phase67/RESULT_A.json \
            experiments/phase67/RESULT_A_SENSITIVITY_12.json \
            | tee experiments/phase67/SHA256SUMS_A.txt

      - name: Upload Phase67A result
        uses: actions/upload-artifact@v4
        with:
          name: phase67a-image-body-results
          path: |
            experiments/phase67/RESULT_A.json
            experiments/phase67/RESULT_A_SENSITIVITY_12.json
            experiments/phase67/SHA256SUMS_A.txt
          if-no-files-found: error
