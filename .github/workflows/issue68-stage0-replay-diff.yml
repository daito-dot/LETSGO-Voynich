name: Issue68 Stage0 historical replay drift diagnostic

on:
  push:
    branches: [issue68-joint-constraint-tournament]
    paths:
      - '.github/workflows/issue68-stage0-replay-diff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-replays:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue68-joint-constraint-tournament
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: _cipher_benchmark
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: _cremma
          sparse-checkout: |
            data/BIS-193
            data/CLM13027
            data/Mazarine915
            data/UBL758
          sparse-checkout-cone-mode: false

      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1

      - name: Recompute historical Phase62C and Phase62P
        shell: bash
        run: |
          set -euo pipefail
          ZL=_cipher_benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          python experiments/phase62/phase62c_c0_a1.py "$ZL" _cremma > /tmp/phase62c_replay.json
          python experiments/phase62/phase62p_h62p1.py "$ZL" _cremma > /tmp/phase62p_replay.json

      - name: Summarize semantic drift exactly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue68-replay-diff
          python - <<'PY' | tee /tmp/issue68-replay-diff/DIFF_SUMMARY.txt
          import json, math
          from collections import Counter

          def walk(a,b,path='$',num=None,other=None):
              if num is None: num=[]
              if other is None: other=[]
              if type(a) is not type(b):
                  other.append((path,'TYPE',type(a).__name__,type(b).__name__))
                  return num,other
              if isinstance(a,dict):
                  ka,kb=set(a),set(b)
                  for k in sorted(ka-kb): other.append((f'{path}.{k}','MISSING_NEW',a[k],None))
                  for k in sorted(kb-ka): other.append((f'{path}.{k}','MISSING_OLD',None,b[k]))
                  for k in sorted(ka&kb): walk(a[k],b[k],f'{path}.{k}',num,other)
              elif isinstance(a,list):
                  if len(a)!=len(b): other.append((path,'LEN',len(a),len(b)))
                  for i,(x,y) in enumerate(zip(a,b)): walk(x,y,f'{path}[{i}]',num,other)
              elif isinstance(a,bool) or a is None or isinstance(a,str):
                  if a!=b: other.append((path,'VALUE',a,b))
              elif isinstance(a,(int,float)):
                  if isinstance(a,float) and math.isnan(a) and isinstance(b,float) and math.isnan(b): return num,other
                  if a!=b:
                      af,bf=float(a),float(b)
                      absd=abs(af-bf)
                      reld=absd/max(abs(af),abs(bf),1e-15)
                      num.append((path,af,bf,absd,reld))
              else:
                  if a!=b: other.append((path,'VALUE',repr(a),repr(b)))
              return num,other

          def report(label, oldpath, newpath):
              old=json.load(open(oldpath)); new=json.load(open(newpath))
              num,other=walk(old,new)
              print(f'=== {label} ===')
              print('exact_equal=', old==new)
              print('numeric_diff_count=',len(num))
              print('nonnumeric_diff_count=',len(other))
              print('max_abs_numeric=',max((x[3] for x in num),default=0.0))
              print('max_rel_numeric=',max((x[4] for x in num),default=0.0))
              roots=Counter()
              for p,*_ in num:
                  q=p
                  q=q.replace('[0]','[*]').replace('[1]','[*]').replace('[2]','[*]').replace('[3]','[*]').replace('[4]','[*]')
                  roots[q.split('.',3)[1] if '.' in q else q]+=1
              print('numeric_top_level_counts=',dict(roots))
              print('top_numeric_diffs_by_abs:')
              for x in sorted(num,key=lambda z:z[3],reverse=True)[:30]: print(x)
              print('nonnumeric_diffs:')
              for x in other[:50]: print(x)
              print()
              return {'numeric':len(num),'other':len(other)}

          report('Phase62C','experiments/phase62/phase62c_c0_a1_results.json','/tmp/phase62c_replay.json')
          report('Phase62P','experiments/phase62/phase62p_h62p1_results.json','/tmp/phase62p_replay.json')
          PY
          cp /tmp/phase62c_replay.json /tmp/issue68-replay-diff/
          cp /tmp/phase62p_replay.json /tmp/issue68-replay-diff/
          (cd /tmp/issue68-replay-diff && sha256sum *.json > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: issue68-stage0-replay-drift-${{ github.sha }}
          path: /tmp/issue68-replay-diff
          if-no-files-found: error
          retention-days: 90
