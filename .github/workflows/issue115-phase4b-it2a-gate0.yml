name: Issue115 Phase4B IT2a boundary Gate0

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/phase4b/IT2A_GATE0_PLAN.md'
      - 'experiments/predictive-information/phase4b/phase4b_it2a_gate0.py'
      - '.github/workflows/issue115-phase4b-it2a-gate0.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
  IT2A: external/IT2a-n.txt

jobs:
  it2a-gate0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Retrieve exact IT2a authority
        shell: bash
        run: |
          mkdir -p external
          curl --fail --location --retry 3 --retry-delay 2 --output "$IT2A" https://www.voynich.nu/data/IT2a-n.txt

      - name: Verify frozen sources before audit
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(sha256sum "$ZL3B" | awk '{print $1}')" = "bf5b6d4ac1e3a51b1847a9c388318d609020441ccd56984c901c32b09beccafc"
          test "$(sha256sum "$IT2A" | awk '{print $1}')" = "7f27a8b0feed8f6de0a99900df6bf912dd1d295c38e5f830bac8b41c3f536fb5"
          test "$(git hash-object "$IT2A")" = "4d6d3f2537b1f507a257529b49c94af7d6e03446"
          test "$(wc -c < "$IT2A" | tr -d ' ')" = "342104"
          test "$(wc -l < "$IT2A" | tr -d ' ')" = "5444"
          test "$(head -1 "$IT2A")" = "#=IVTFF EvaT 2.0 M 3"

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy

      - name: Enforce score-free executable
        shell: bash
        run: |
          if grep -E 'math\.log|np\.log|log2\(|reset_bits|carry_bits|D_RESET|observed_minus_shift|bits_per_token|cross_entropy' experiments/predictive-information/phase4b/phase4b_it2a_gate0.py; then
            echo 'Predictive scoring path found in IT2a Gate0 executable' >&2
            exit 1
          fi

      - name: Compile and self-test
        shell: bash
        run: |
          python -m py_compile experiments/predictive-information/phase4b/phase4b_it2a_gate0.py
          python experiments/predictive-information/phase4b/phase4b_it2a_gate0.py --self-test

      - name: Run IT2a raw boundary support audit
        shell: bash
        run: |
          python experiments/predictive-information/phase4b/phase4b_it2a_gate0.py --audit "$IT2A" "$ZL3B" phase4b_it2a_gate0.json
          python -m json.tool phase4b_it2a_gate0.json > /dev/null
          sha256sum phase4b_it2a_gate0.json

      - name: Assert authority and Gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('phase4b_it2a_gate0.json'))
          assert x['schema'] == 'issue115-phase4b-it2a-gate0-v1'
          assert x['source_authority_exact_match'] is True
          assert x['source']['sha256'] == '7f27a8b0feed8f6de0a99900df6bf912dd1d295c38e5f830bac8b41c3f536fb5'
          assert x['source']['git_blob_sha1'] == '4d6d3f2537b1f507a257529b49c94af7d6e03446'
          assert x['fold_authority']['identity_sha256'] == 'cf2df8edcf2b25c2f6388c4a9e2c1ee58a24ae05a9cf489ff9a43d2d28f0b64b'
          assert x['representation']['connected_composites_longest_match'] == ['cfh','ckh','cph','cth','ch','sh']
          assert x['firewall'] == {
              'predictive_scores_computed': False,
              'boundary_model_fitted': False,
              'slotparser_used_for_event_eligibility': False,
              'zl3b_phase4_target_scores_read': False,
              'semantic_or_image_context_used': False,
              'latent_state_fitted': False,
          }
          assert x['gate_pass'] is True
          print(json.dumps({'gate_pass':x['gate_pass'],'population':x['population'],'by_fold':x['by_fold'],'support':x['support']},indent=2,sort_keys=True))
          PY

      - name: Upload score-free IT2a Gate authority
        uses: actions/upload-artifact@v4
        with:
          name: issue115-phase4b-it2a-gate0
          path: phase4b_it2a_gate0.json
