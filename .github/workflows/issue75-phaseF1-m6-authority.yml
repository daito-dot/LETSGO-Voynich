name: Issue75 Phase F1 target-blind M6 KRS-gated authority

on:
  push:
    branches: [issue75-minimal-occupancy-generator]
    paths: ['.github/workflows/issue75-phaseF1-m6-authority.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact F1 execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify F0 selection and Phase-F plan-before-code chronology
        shell: bash
        run: |
          set -euo pipefail
          F0=fd1446d474208b9e2f17e3fd4df5249e133c2bd3
          PLAN=eb4ee10d9874d2aace564a7f6a8464ccd4a677fc
          GEN=e8fc51c54e8617943ebd1685e950a0ba74758ed1
          FREEZE=76d5eca59b54a0eeef45b88e9c5639981d252f3f
          git merge-base --is-ancestor "$F0" "$PLAN"
          test "$(git rev-parse ${GEN}^)" = "$PLAN"
          test "$(git rev-parse ${FREEZE}^)" = "$GEN"
          git merge-base --is-ancestor "$FREEZE" HEAD
          git diff --exit-code "$PLAN" HEAD -- experiments/minimal-occupancy-generator/PLAN_F.md
          git diff --exit-code "$GEN" HEAD -- experiments/minimal-occupancy-generator/phase75f_generator_support.py
          git diff --exit-code "$FREEZE" HEAD -- experiments/minimal-occupancy-generator/IMPLEMENTATION_FREEZE_F.md
          echo '999d9990449875708019ad71aa3a1d253afad19edada88cb45eb4204349887c6  experiments/minimal-occupancy-generator/stage-f0/phase75f0_training_latent_diagnostic.json' | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open('experiments/minimal-occupancy-generator/stage-f0/phase75f0_training_latent_diagnostic.json'))
          assert r['status']=='PHASE_F0_TRAINING_ONLY_LATENT_FRONTIER_DIAGNOSTIC_COMPLETE'
          assert r['selection']['classification']=='F0_SELECT_KRS_GATED_TWO_MODE_CHAIN'
          assert r['support']['g2_over_m5']['supported'] is True
          assert all(v is False for v in r['guardrails'].values())
          PY
          test -e experiments/minimal-occupancy-generator/DECISION_F0_SELECT_KRS_GATED_TWO_MODE.md
          test ! -e experiments/minimal-occupancy-generator/stage-f1
          ! grep -Eq 'target68|load_target_references|phase75[a-e]_score|phase75f_score' experiments/minimal-occupancy-generator/phase75f_generator_support.py

      - name: Checkout frozen ZL3b source
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: _cb
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Verify source and install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _cb hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = 2a4533ab9bdfa85db9bad602d590978953055df1
          python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1
          python -m py_compile \
            experiments/minimal-occupancy-generator/phase75e_generator_support.py \
            experiments/minimal-occupancy-generator/phase75f0_training_latent_diagnostic.py \
            experiments/minimal-occupancy-generator/phase75f0_stable_runner.py \
            experiments/minimal-occupancy-generator/phase75f_generator_support.py

      - name: Generate complete 31-case M6 target-blind authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f1
          python experiments/minimal-occupancy-generator/phase75f_generator_support.py \
            _cb/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            /tmp/f1/generator_authority.json \
            > /tmp/f1/stdout.txt

      - name: Validate frozen F1 contract
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math
          r=json.load(open('/tmp/f1/generator_authority.json'))
          assert r['schema']=='issue75-phaseF-m6-krs-gated-2mix-generator-authority-v1'
          assert r['status']=='M6_KRS_GATED_TWO_LATENT_CHAIN_MODES_31_CORPORA_FROZEN_TARGET_BLIND'
          assert r['family']=='M6-KRS-GATED-2MIX-CHAIN'
          assert r['phase_f0_authority_sha256']=='999d9990449875708019ad71aa3a1d253afad19edada88cb45eb4204349887c6'
          assert r['source']['ZL3b_blob']=='2a4533ab9bdfa85db9bad602d590978953055df1'
          assert r['source']['parsed_tokens']==25071
          assert r['source']['fold_parsed_tokens']==[4430,4810,5516,5447,4868]
          m=r['model_definition']
          assert m['latent_states']==2
          assert m['free_parameters_per_component']==21
          assert m['free_gate_parameters']==4
          assert m['free_continuous_parameters']==46
          assert m['explicit_nonadjacent_parameters']==0
          assert m['generic_distance_parameters']==0
          assert m['named_distant_pair_parameters']==0
          assert m['signature_specific_parameters']==0
          assert m['phase_f_refit_performed'] is False
          assert len(r['fit'])==5
          assert [r['fit'][str(f)]['f0_selected_start_index'] for f in range(5)]==[3,6,4,7,6]
          for f in range(5):
              x=r['fit'][str(f)]
              assert x['free_continuous_parameters']==46
              assert x['phase_f_refit_performed'] is False
              assert len(x['component0_theta_free'])==21 and len(x['component1_theta_free'])==21
              assert len(x['gate_intercept_and_K_R_S_slopes'])==4
              assert len(x['descriptor_standardization']['mean_K_R_S'])==3
              assert len(x['descriptor_standardization']['population_sd_K_R_S'])==3
              assert x['normalization_audit']['max_descriptor_mass_error'] <= 2e-12
              assert abs(x['normalization_audit']['full_state_sum']-1.0) <= 1e-12
              assert 0.0 < x['minimum_descriptor_gate_probability'] < x['maximum_descriptor_gate_probability'] < 1.0
              assert math.isfinite(x['normalization_audit']['maximum_state_probability'])
          assert len(r['cases'])==31 and {x['rep'] for x in r['cases']}==set(range(31))
          assert len({x['occupancy_sha256'] for x in r['cases']})==31
          assert all(x['tokens']==25071 and x['fold_tokens']==[4430,4810,5516,5447,4868] for x in r['cases'])
          assert all(x['all_zero_count']==0 for x in r['cases'])
          assert all(x['pair_Q_computed'] is False and x['residual_Z_computed'] is False for x in r['cases'])
          assert all(x['target_topology_loaded'] is False and x['target_correlation_computed'] is False for x in r['cases'])
          assert all(v is False for v in r['target_access'].values())
          assert r['no_drops'] is True and r['no_rerolls'] is True
          print({
            'selected_starts':[r['fit'][str(f)]['f0_selected_start_index'] for f in range(5)],
            'gate_ranges':[[r['fit'][str(f)]['minimum_descriptor_gate_probability'],r['fit'][str(f)]['maximum_descriptor_gate_probability']] for f in range(5)],
            'distinct_signature_range':[min(x['distinct_signatures'] for x in r['cases']),max(x['distinct_signatures'] for x in r['cases'])],
            'rep0_sha':r['cases'][0]['occupancy_sha256'],
            'rep30_sha':r['cases'][30]['occupancy_sha256'],
            'target_access':r['target_access']})
          PY
          sha256sum /tmp/f1/generator_authority.json /tmp/f1/stdout.txt > /tmp/f1/SHA256SUMS.txt
          AUTH_SHA=$(sha256sum /tmp/f1/generator_authority.json | cut -d' ' -f1)
          echo "authority_sha=$AUTH_SHA" >> "$GITHUB_OUTPUT"
          cat > /tmp/f1/PROVENANCE.txt <<EOF
          scientific_role=PRETARGET_FROZEN_F0_PARAMETER_KRS_GATED_TWO_MODE_GENERATOR_AUTHORITY
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          generation_head=${GITHUB_SHA}
          phase_f0_authority_sha256=999d9990449875708019ad71aa3a1d253afad19edada88cb45eb4204349887c6
          phase_f_plan_commit=eb4ee10d9874d2aace564a7f6a8464ccd4a677fc
          generator_commit=e8fc51c54e8617943ebd1685e950a0ba74758ed1
          implementation_freeze_commit=76d5eca59b54a0eeef45b88e9c5639981d252f3f
          generator_authority_sha256=${AUTH_SHA}
          cases=31
          target_loaded=false
          pair_Q_computed=false
          residual_Z_computed=false
          target_correlation_computed=false
          phase_f_refit_performed=false
          drops=0
          rerolls=0
          EOF

      - name: Upload immutable target-blind F1 authority
        uses: actions/upload-artifact@v4
        with:
          name: issue75-phaseF1-M6-KRS-GATED-2MIX-CHAIN-${{ github.sha }}
          path: /tmp/f1
          if-no-files-found: error
          retention-days: 90

      - name: Commit exact F1 authority into repository
        shell: bash
        run: |
          set -euo pipefail
          DEST=experiments/minimal-occupancy-generator/stage-f1
          test ! -e "$DEST"
          mkdir -p "$DEST"
          cp /tmp/f1/generator_authority.json "$DEST/"
          cp /tmp/f1/stdout.txt "$DEST/"
          cp /tmp/f1/SHA256SUMS.txt "$DEST/"
          cp /tmp/f1/PROVENANCE.txt "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m 'Issue75 Phase F1: freeze 31-case target-blind M6 authority'
          git push origin HEAD:issue75-minimal-occupancy-generator
