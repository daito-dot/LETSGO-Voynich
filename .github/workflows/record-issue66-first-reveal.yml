name: Record Issue66 first reveal permanently

on:
  push:
    branches: [issue66-independent-transcription-residual]
    paths:
      - '.github/workflows/record-issue66-first-reveal.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue66-independent-transcription-residual
          fetch-depth: 0

      - name: Download exact first-reveal artifact and verify frozen bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue66/unpacked experiments/occupancy-graph-independent-transcription/first-reveal
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9779393199/zip > /tmp/issue66/artifact.zip
          test "$(sha256sum /tmp/issue66/artifact.zip | awk '{print $1}')" = "d78a4355510844dc1ea32fed9c581676ba0c9fd97092e34766f4a2bfbb334577"
          unzip -q /tmp/issue66/artifact.zip -d /tmp/issue66/unpacked
          RAW=/tmp/issue66/unpacked/issue66_independent_residual_results.json
          test -f "$RAW"
          test "$(sha256sum "$RAW" | awk '{print $1}')" = "f26db8123f8f2b7a4148495fdeebe81c8c042a23606eb7c22e1c0687faaf86a6"
          test "$(wc -c < "$RAW")" = "242134"
          python - <<'PY'
          import json
          p='/tmp/issue66/unpacked/issue66_independent_residual_results.json'
          r=json.load(open(p))
          assert r['github_sha'] == '37d9dd1f378a6230a11fbe7694c53eeb8b30f81f'
          assert r['overall_classification'] == 'INDEPENDENT TRANSCRIPTION REPLICATES RESIDUAL TOKEN-CONSTRUCTION CORE'
          assert r['sources']['ZL3b_first_reveal_raw_sha256'] == 'fba60daea6e30682065900a4cf15d53d2a2f536d933b588fae447fb43bb4728d'
          assert r['sources']['StageA_support_audit_raw_sha256'] == '35ea31eb5d0a1f0484623ee8a29058f1c5bc339117e378b594f26c7c23aee0dc'
          PY
          cp "$RAW" experiments/occupancy-graph-independent-transcription/first-reveal/issue66_independent_residual_results.json

      - name: Create deterministic compressed audit copy
        shell: bash
        run: |
          set -euo pipefail
          RAW=experiments/occupancy-graph-independent-transcription/first-reveal/issue66_independent_residual_results.json
          gzip -n -9 -c "$RAW" > /tmp/issue66/result.json.gz
          test "$(sha256sum /tmp/issue66/result.json.gz | awk '{print $1}')" = "70b238ba96ebee4d40b53a4a74b70f4e0d9ea934d9c98a61411eac4aa576d2df"

      - name: Write first-reveal provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > experiments/occupancy-graph-independent-transcription/first-reveal/PROVENANCE.md <<EOF
          # Issue #58D / #66 first-reveal provenance

          Status: **scientific first reveal complete and permanently archived**.

          ## Scientific authorization

          - target plan first-add: \`41f9ec579eda29d59bd753f58aa5dbfc6293f549\`
          - target executable first-add: \`9913d5f20543b4611c1e42599bdf80379b000066\`
          - exact first-reveal head: \`37d9dd1f378a6230a11fbe7694c53eeb8b30f81f\`
          - PR first-reveal event: PR #67
          - Actions run: \`33449726473\`
          - target job: \`99676742936\`
          - conclusion: \`success\`

          Pre-PR push run \`33449670929\` completed preflight successfully and explicitly skipped the target job. Therefore the PR run above is the first authorized IT2a target reveal.

          ## Exact first-reveal bytes

          - artifact ID: \`9779393199\`
          - artifact name: \`issue66-independent-residual-37d9dd1f378a6230a11fbe7694c53eeb8b30f81f\`
          - artifact ZIP SHA-256: \`d78a4355510844dc1ea32fed9c581676ba0c9fd97092e34766f4a2bfbb334577\`
          - raw JSON SHA-256: \`f26db8123f8f2b7a4148495fdeebe81c8c042a23606eb7c22e1c0687faaf86a6\`
          - raw JSON size: \`242134\` bytes
          - deterministic \`gzip -n -9\` SHA-256: \`70b238ba96ebee4d40b53a4a74b70f4e0d9ea934d9c98a61411eac4aa576d2df\`
          - archive recording workflow run: \`${GITHUB_RUN_ID}\`

          The exact raw JSON is committed directly as \`issue66_independent_residual_results.json\`. No chunked text transport is required for this first reveal.

          ## Frozen source/reference authorities

          IT2a target:

          - SHA-256: \`7f27a8b0feed8f6de0a99900df6bf912dd1d295c38e5f830bac8b41c3f536fb5\`
          - Git blob: \`4d6d3f2537b1f507a257529b49c94af7d6e03446\`

          Frozen ZL3b #58C reference raw SHA-256:

          - \`fba60daea6e30682065900a4cf15d53d2a2f536d933b588fae447fb43bb4728d\`

          Frozen Stage-A support audit raw SHA-256:

          - \`35ea31eb5d0a1f0484623ee8a29058f1c5bc339117e378b594f26c7c23aee0dc\`

          ## Frozen classification

          > **\`INDEPENDENT TRANSCRIPTION REPLICATES RESIDUAL TOKEN-CONSTRUCTION CORE\`**

          Numerical interpretation belongs in the phase report. This file controls exact first-reveal provenance.
          EOF

          cat > experiments/occupancy-graph-independent-transcription/first-reveal/SHA256SUMS.txt <<'EOF'
          f26db8123f8f2b7a4148495fdeebe81c8c042a23606eb7c22e1c0687faaf86a6  issue66_independent_residual_results.json
          d78a4355510844dc1ea32fed9c581676ba0c9fd97092e34766f4a2bfbb334577  actions-artifact-9779393199.zip
          70b238ba96ebee4d40b53a4a74b70f4e0d9ea934d9c98a61411eac4aa576d2df  deterministic-gzip-n9-of-issue66_independent_residual_results.json
          7f27a8b0feed8f6de0a99900df6bf912dd1d295c38e5f830bac8b41c3f536fb5  IT2a-n.txt
          fba60daea6e30682065900a4cf15d53d2a2f536d933b588fae447fb43bb4728d  frozen-ZL3b-Issue58C-first-reveal.json
          35ea31eb5d0a1f0484623ee8a29058f1c5bc339117e378b594f26c7c23aee0dc  Issue58D-StageA-support-audit.json
          EOF

      - name: Reverify committed raw bytes and commit archive
        shell: bash
        run: |
          set -euo pipefail
          RAW=experiments/occupancy-graph-independent-transcription/first-reveal/issue66_independent_residual_results.json
          test "$(sha256sum "$RAW" | awk '{print $1}')" = "f26db8123f8f2b7a4148495fdeebe81c8c042a23606eb7c22e1c0687faaf86a6"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/occupancy-graph-independent-transcription/first-reveal
          git commit -m "Archive exact Issue66 first reveal"
          git push origin HEAD:issue66-independent-transcription-residual
