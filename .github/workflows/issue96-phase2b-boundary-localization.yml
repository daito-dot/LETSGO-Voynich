name: Issue96 Phase2B boundary localization

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/phase2b/**'
      - '.github/workflows/issue96-phase2b-boundary-localization.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt

jobs:
  localization:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen source
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Enforce prediction-only boundary
        shell: bash
        run: |
          test -f experiments/predictive-information/phase2b/PLAN.md
          test -f experiments/predictive-information/phase2b/phase2b_boundary_localization.py
          if grep -E 'output_metrics|score_r1\(|metric_gates\(|evaluate_model\(|H62P1|target_exposed' experiments/predictive-information/phase2b/phase2b_boundary_localization.py; then
            echo 'Surface-target scorer found in Phase-2B executable' >&2
            exit 1
          fi

      - name: Compile and synthetic tests
        shell: bash
        run: |
          python -m py_compile experiments/predictive-information/phase2b/phase2b_boundary_localization.py
          python experiments/predictive-information/phase2b/phase2b_boundary_localization.py --self-test

      - name: Authoritative Phase-2B first reveal
        shell: bash
        run: |
          python experiments/predictive-information/phase2b/phase2b_boundary_localization.py --run "$ZL3B" phase2b_results.json
          python -m json.tool phase2b_results.json > /dev/null
          sha256sum phase2b_results.json

      - name: Assert regressions and firewall
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('phase2b_results.json'))
          assert all(x['regression'].values())
          assert x['firewall'] == {
              'currier_section_scribe_used': False,
              'future_test_tokens_used': False,
              'issue84_target_used': False,
              'latent_state_fitted': False,
              'semantic_or_image_context_used': False,
              'surface_target_metrics_scored': False,
              'tau_or_window_reselected': False,
          }
          print(json.dumps({
              'classification': x['classification'],
              'mean_bits_per_token': x['summary']['mean_bits_per_token'],
              'primary_contrasts': {k:x['summary']['contrasts'][k] for k in [
                  'G_line_inventory','G_within_para_inventory','G_cross_para_inventory',
                  'G_order_within_para','G_order_cross_para']},
              'decision_inputs': x['summary']['decision_inputs'],
              'selected': {str(r['fold']):r['selected'] for r in x['outer']},
          }, indent=2, sort_keys=True))
          PY

      - name: Upload authoritative result
        uses: actions/upload-artifact@v4
        with:
          name: issue96-phase2b-boundary-localization
          path: phase2b_results.json
