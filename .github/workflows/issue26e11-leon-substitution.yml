name: Issue26E11 Leon substitution probe

on:
  push:
    branches: [issue26-music-e11-leon-substitution]
    paths:
      - 'experiments/issue26-music/HISTORICAL_AUDIT_E11.md'
      - 'experiments/issue26-music/PLAN_E11.md'
      - 'experiments/issue26-music/PLAN_E11_AMENDMENT.md'
      - 'experiments/issue26-music/phaseE11_leon_substitution.py'
      - 'experiments/issue26-music/issue26e_core.py'
      - '.github/workflows/issue26e11-leon-substitution.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout E11 branch
        uses: actions/checkout@v4
        with:
          ref: issue26-music-e11-leon-substitution
          fetch-depth: 0

      - name: Verify plan and amendment predate executable
        shell: bash
        run: |
          PLAN=$(git log --format=%H -- experiments/issue26-music/PLAN_E11.md | tail -1)
          AMEND=$(git log --format=%H -- experiments/issue26-music/PLAN_E11_AMENDMENT.md | tail -1)
          SCRIPT=$(git log --format=%H -- experiments/issue26-music/phaseE11_leon_substitution.py | tail -1)
          echo plan_first=$PLAN amendment_first=$AMEND script_first=$SCRIPT
          git merge-base --is-ancestor "$PLAN" "$SCRIPT"
          git merge-base --is-ancestor "$AMEND" "$SCRIPT"
          test "$PLAN" != "$SCRIPT"
          test "$AMEND" != "$SCRIPT"

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark
          sparse-checkout: |
            benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Checkout frozen CREMMA comparator
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma
          sparse-checkout: |
            data/BIS-193
            data/CLM13027
            data/Mazarine915
            data/UBL758
          sparse-checkout-cone-mode: false

      - name: Verify exact external inputs
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"

      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1 numba==0.61.2

      - name: Run E11 substitution probe
        shell: bash
        run: |
          python experiments/issue26-music/phaseE11_leon_substitution.py \
            external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            external/cremma > issue26e11_results.json

      - name: Print E11 summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open('issue26e11_results.json'))
          print('classification=',r['classification'])
          print('representation=',r['representation'])
          print('latin_self_baseline=',r['latin_self_baseline']['mean_cross_entropy'])
          print('latin_top5=',r['latin_self_baseline']['top5_char_fraction'])
          if 'positive_control' in r:
              p=r['positive_control']
              print('positive_pass=',p['passed'])
              print('positive_true_CE=',p['mean_true_held_cross_entropy'])
              print('positive_recovered_CE=',p['mean_recovered_held_cross_entropy'])
              print('positive_weighted_key_accuracy=',p['mean_occurrence_weighted_key_accuracy'])
              print('positive_key_recurrence=',p['exact_recovered_key_recurrence'])
          if 'voynich_primary' in r:
              v=r['voynich_primary']
              print('voy_mean_CE=',v['mean_held_cross_entropy'])
              print('voy_pooled_CE=',v['pooled_held_cross_entropy'])
              print('weighted_key_stability=',v['weighted_key_stability'])
              print('exact_key_recurrence=',v['exact_full_key_recurrence'])
              print('pooled_top5=',v['pooled_top5_char_fraction'])
              print('distinct_whole_token_hits_ge6=',v['distinct_whole_token_hits_ge6_count'])
              print('folds_with_hits_ge6=',v['folds_with_hits_ge6'])
              print('gates=',r.get('classification_gates'))
              for f in v['folds']:
                  print('\nfold',f['fold'],'train=',f['training_cross_entropy'],'held=',f['held']['cross_entropy'])
                  print('mapping=',f['mapping'])
                  for s in f['held']['samples'][:5]: print(' sample',s['page'],s['text'])
                  print(' hits=',f['held']['whole_token_lexicon_hits'][:10])
          PY
          sha256sum issue26e11_results.json

      - name: Upload E11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue26e11-leon-substitution-${{ github.sha }}
          path: issue26e11_results.json
          if-no-files-found: error
          retention-days: 90
