name: Issue68 freeze tournament target plan

on:
  push:
    branches: [issue68-joint-constraint-tournament]
    paths:
      - '.github/workflows/issue68-freeze-target-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue68-joint-constraint-tournament
          fetch-depth: 0

      - name: Require completed verified Stage0
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/joint-constraint-tournament/STAGE0_REPORT.md
          test -f experiments/joint-constraint-tournament/stage0/STAGE0_REPLAY_VERIFIED.md
          python - <<'PY'
          import json
          r=json.load(open('experiments/joint-constraint-tournament/stage0/STAGE0_OUTCOME.json'))
          assert r['all_checks_pass'] is True
          assert r['new_joint_candidate_scores_computed'] is False
          PY

      - name: Freeze PLAN_A before candidate scoring code
        shell: bash
        run: |
          set -euo pipefail
          test ! -e experiments/joint-constraint-tournament/PLAN_A.md
          cat > experiments/joint-constraint-tournament/PLAN_A.md <<'EOF'
          # Issue #68 — first joint-constraint mechanism tournament plan

          Status: **PREREGISTERED — NO NEW JOINT CANDIDATE RESULT REVEALED**

          Stage-0 authority result:

          > `JOINT TOURNAMENT AUTHORITY READY`

          This plan must predate any executable that computes a new candidate R1 token-construction result or combines R1/R2/R3 into a tournament classification.

          ## 1. Scientific question

          > **Can any already-defined bounded mechanism jointly satisfy the cross-reading token-construction core, H62 recurrence geometry, and signed S1 paragraph-entry specialization under its declared information/reversibility budget?**

          This first tournament is a **baseline tournament**, not a post-hoc mechanism invention phase.

          It does not create A2 or alter Naibbe after seeing new target failures.

          ## 2. Candidate roles frozen before new joint scoring

          ### B0 — N0

          Role: `control / null`.

          - source-native medieval Latin control;
          - R2/R3 historical replay anchor;
          - not EVA/12-slot output;
          - not R1-eligible;
          - not eligible for `JOINT-CONSTRAINT COMPETITIVE`.

          ### B1 — fixed C0-4 digraph

          Role: `reversible transform control`.

          - historical selected C0 in all five Phase62 folds;
          - exact source glyph-stream recovery;
          - source token boundaries are not preserved without side information;
          - encoded atoms are not EVA/12-slot surface;
          - R2/R3 replay anchor;
          - not R1-eligible and not eligible for joint-competitive status.

          ### B2 — published Naibbe C1-E0

          Role: `reversible transform / decoder candidate`.

          Frozen external authority:

          - repo `greshko/naibbe-cipher`;
          - commit `f2675ec5dd275268bc64dd48ea64fc0e0e9827a2`;
          - exact public defaults already source-audited in Phase64B;
          - primary view retains `UNAMBIGUOUS=True`, `RANDOM=True`, `REMOVE_SPACES=True`, `REMOVE_SPACES_PERCENTAGE=3`.

          It is R1-eligible because its output is intended to be Voynich/EVA-like.

          Its R2/R3 values are historical frozen Phase64B evidence and will not be retuned.

          A source-side-only inverse/closure wrapper may be implemented **after this plan and before target reveal**. The wrapper may use only the pinned public tables/algorithm and allowed decoder metadata below; it may not inspect Voynich R1 target results.

          ### B3 — A1/A1-R1

          Role: `surface generator only`.

          - exact historical Phase62/63 architecture and per-fold frozen parameters;
          - empirical Voynich training vocabulary/edit1/entry-shape information supplied on training leaves;
          - true held-out paragraph, line and token-count layout supplied;
          - held-out token identities not supplied;
          - no decoder/reverse transform is defined.

          It is R1/R2/R3-eligible but **cannot become a decoder candidate** even if structurally joint-competitive.

          ## 3. No new candidate family in first reveal

          The first reveal is intentionally limited to B0–B3.

          A new reversible architecture is a later hypothesis generated only after the baseline failure/success pattern is frozen.

          ## 4. Responsibility R1 — cross-reading residual token construction

          New R1 target scoring is authorized only for B2 Naibbe and B3 A1.

          ### 4.1 Representation compatibility gate

          Use the unchanged 12-slot parser from the completed token-construction program.

          Primary parser policy: `min`.

          Candidate R1 population must have at least `60%` direct parser coverage of clean candidate tokens, reusing the pre-#58D source-support threshold.

          No glyph normalization or token rewrite may be chosen after R1 inspection.

          If coverage <60%, R1 is `FAIL_REPRESENTATION_COMPATIBILITY`, not rescued by a selected subset.

          ### 4.2 Complete graph only

          Retain all `66` unordered slot pairs.

          Use the same `K_other`-conditional Jeffreys-smoothed Mantel-Haenszel Yule-Q base statistic as #58C/#58D.

          No historical high edge may be selected as a candidate target.

          ### 4.3 Candidate-owned null calibration

          Each candidate primary output receives its own deterministic line-local occupancy null:

          - 1,000 reference nulls defining edge-wise empirical mid-rank normal residual Z;
          - independent 1,000 test nulls for validation.

          Preserve line × slot occupancy marginals exactly and destroy same-token cross-slot pairing, matching #58C/#58D.

          Candidate namespaces must be disjoint and include candidate/view identity.

          Frozen ZL3b/IT2a edge-wise null distributions are **not** used to normalize candidate graphs.

          ### 4.4 Candidate R1 existence gate

          Candidate residual energy:

          `E = sqrt(mean(Z_e^2))` over all 66 edges.

          R1 existence passes iff:

          - independent test-null `p_exist <= .01`;
          - reliability `W >= .50` with >=4 valid source folds.

          Reliability folds:

          - A1: the five frozen physical-leaf held-out folds; primary generated replicate = the first historical deterministic A1 seed per fold. Other historical seeds are non-promoting sensitivities.
          - Naibbe: four frozen CREMMA manuscripts as document folds; train-on-other-three vs held-manuscript residual topology. >=4 valid folds is required.

          ### 4.5 Topology against both independent Voynich readings

          Compare candidate complete-66 residual Z against both frozen pooled `ALL` references:

          - ZL3b #58C;
          - IT2a #58D.

          For each reference compute:

          - Pearson correlation;
          - sign agreement out of 66.

          For every candidate test-null graph compute the same comparisons against both real references, then use maxT over the two references separately for correlation and sign agreement.

          Candidate topology passes iff **for both ZL3b and IT2a**:

          - Pearson `R >= .70`;
          - correlation maxT `p <= .01`;
          - sign agreement `>=50/66`;
          - sign-agreement maxT `p <= .01`.

          These are the already frozen strong topology gates from #58D; they are not chosen from B2/B3 outcomes.

          ### 4.6 R1 responsibility pass

          R1 PASS iff representation compatibility, residual existence/reliability, and topology against **both** readings all pass.

          ## 5. Responsibility R2 — H62 near-family recurrence geometry

          Do not invent a new weighted H62 score.

          Use the frozen Phase62P profile definition and historical N0/fixed-C0 held-out anchors.

          For each R2-eligible candidate, compare candidate held-out D_profile and absolute C_short difference to the frozen N0 and fixed C0 values fold by fold.

          R2 PASS iff all are true:

          - candidate D_profile < N0 in at least 4/5 folds;
          - candidate D_profile < fixed C0 in at least 4/5 folds;
          - candidate |ΔC_short| < N0 in at least 4/5 folds;
          - candidate |ΔC_short| < fixed C0 in at least 4/5 folds.

          Historical candidate outputs/metrics must be replayed from frozen code/seeds; no parameter changes are allowed.

          B0/B1 remain anchors and are not themselves scored as joint candidates.

          ## 6. Responsibility R3 — signed S1 paragraph-entry specialization

          Use the exact Phase62 S1 feature, training standardization, direction and held-out projection.

          For each candidate:

          - compute held-out signed S1 on all five common leaf folds when the candidate architecture uses the Voynich leaf layout;
          - for historical external-transform candidates, use the exact frozen Phase64B fold/result mapping already used for its S1 comparison; no new source selection.

          R3 PASS iff:

          1. candidate S1 is positive in at least 4/5 frozen held-out comparisons; and
          2. `mean(candidate S1) / mean(real target S1)` lies in `[0.5, 2.0]`.

          The ratio band is reused from the earlier frozen Phase63 independent-transfer exposed scorecard. It is not chosen from this tournament's new R1 outcome.

          Wrong-sign S1 is an automatic R3 fail and cannot be compensated by R1 or R2.

          ## 7. Reversibility / decoder closure responsibility

          Applies only to a candidate labeled `reversible transform / decoder candidate`.

          ### 7.1 Exact closure

          The declared decoder must recover the normalized source plaintext exactly on source-side held-out controls, followed by exact re-encode to the same pre-respacing ciphertext representation.

          No Voynich target statistic may be used to construct or tune the decoder.

          ### 7.2 Allowed per-message decoder metadata

          Allowed message-dependent side information is limited to **O(log n) scalar metadata**, specifically:

          - finite initial state/table identifier, <=8 bits;
          - plaintext/ciphertext normalized length if required;
          - one deterministic RNG seed <=64 bits only if the published encoder genuinely requires it and the decoder uses it to reconstruct encoder choices.

          Forbidden for a primary decoder pass:

          - per-token choices;
          - per-space deletion mask;
          - positions of removed spaces/token boundaries;
          - plaintext vocabulary/list supplied with ciphertext;
          - information proportional to message length other than ciphertext itself.

          Therefore the published Naibbe 3% respacing must either be self-decoded from ciphertext under the frozen wrapper or the primary reversibility gate fails. A sensitivity retaining spaces may be reported but cannot promote primary decoder status.

          ### 7.3 Reversibility PASS

          Requires 100% exact normalized plaintext closure on the frozen source-side audit population with only allowed metadata.

          ## 8. Complexity and information-access gate

          The first tournament uses **hard access ceilings**, not a post-hoc scalar complexity weighting.

          All candidates must declare the Stage0 schema fields.

          Automatic access/complexity FAIL if any:

          - held-out target statistic used during generation/fitting;
          - held-out token identity supplied to a model that does not historically require it;
          - per-held-out-item parameter fitting/adaptation;
          - candidate-specific preprocessing selected after target reveal;
          - forbidden O(n) decoder side information used to claim reversibility.

          Historical fixed public tables and historically frozen training-side fits are allowed but must remain reported.

          A1's true held-out layout counts are allowed for this **historical surface-generator comparator** because they are part of the frozen architecture, but they are explicitly recorded as `ACCESS_HEAVY`; this does not turn A1 into a decoder.

          ## 9. Primary candidate classifications

          Apply independently to B2 and B3.

          ### `OVERFIT / EXCESS-COMPLEXITY`

          if the hard access/complexity gate fails. This classification has priority over structural fit.

          ### `JOINT-CONSTRAINT COMPETITIVE`

          iff:

          - R1 PASS;
          - R2 PASS;
          - R3 PASS;
          - hard access/complexity gate passes;
          - and, for a decoder-role candidate, reversibility PASS.

          A surface-generator-only candidate can receive this structural class while remaining explicitly **not a decoder**.

          ### `PARTIAL STRUCTURAL MODEL`

          if access is acceptable and exactly two of R1/R2/R3 pass, or if all three structural responsibilities pass but a decoder-role candidate fails/inconclusive reversibility.

          ### `NOT COMPETITIVE`

          if access is acceptable and fewer than two of R1/R2/R3 pass.

          ### `INCONCLUSIVE`

          only for an externally support-limited failure of a required metric implementation/population that is not itself a representation-compatibility failure.

          ## 10. Global tournament classification

          ### `REVERSIBLE FAMILY JOINT-CONSTRAINT COMPETITIVE`

          if any decoder-role candidate is `JOINT-CONSTRAINT COMPETITIVE`.

          ### `SURFACE GENERATOR JOINT-COMPETITIVE; INVERSE MECHANISM STILL OPEN`

          if no decoder candidate is joint-competitive but at least one surface-generator-only candidate is.

          ### `NO TESTED FAMILY JOINT-CONSTRAINT COMPETITIVE`

          if no candidate reaches the class.

          The global class does not call any outcome decipherment.

          ## 11. First-reveal population / seeds

          Reuse exact frozen sources, folds, parameters, candidate code and deterministic seed families from their historical authorities.

          Primary randomized candidate replicate is the first member of the already frozen historical deterministic seed sequence. Remaining historical reps are sensitivity only and cannot rescue a primary fail.

          If an old candidate cannot be regenerated exactly enough to identify that primary replicate, target execution must stop before new R1 scoring and record `INCONCLUSIVE` rather than invent a new seed.

          ## 12. Preflight firewall

          Before target reveal, preflight may:

          - verify Stage0 READY and plan-before-code ancestry;
          - verify external source hashes/commits;
          - reproduce historical R2/R3 candidate metrics;
          - run Naibbe source-side decoder/closure tests;
          - reproduce candidate token counts/coverage **without computing any real candidate 66-edge Q or residual graph**;
          - test R1 null machinery only on synthetic data.

          Preflight must not calculate candidate real R1 Q, residual Z, energy, topology, or tournament class.

          ## 13. First reveal

          The first authorized new joint outcome occurs only after:

          1. this plan is committed;
          2. target executable is committed later;
          3. preflight passes with target scoring skipped;
          4. an explicit auditable reveal event occurs.

          Permanently archive exact raw result, first-reveal head, run/job/artifact IDs and SHA-256 before interpretation updates.

          ## 14. Interpretation limits

          Even `REVERSIBLE FAMILY JOINT-CONSTRAINT COMPETITIVE` would mean “serious inverse candidate under the frozen responsibilities,” not decipherment.

          A later phase would still need unseen prediction, exact decode/re-encode closure on independent material, content/historical consistency and representation robustness.
          EOF

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/joint-constraint-tournament/PLAN_A.md
          git commit -m 'Issue68: preregister first joint-constraint tournament'
          git push origin HEAD:issue68-joint-constraint-tournament
