name: Issue75 Phase A0 target-blind occupancy generator authority

on:
  push:
    branches: [issue75-minimal-occupancy-generator]
    paths:
      - '.github/workflows/issue75-phaseA0-generator-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Phase A0 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify plan-before-code and repair chronology
        shell: bash
        run: |
          set -euo pipefail
          PLAN='8d984cfa61a5616bef61b45248c0a7a5d213fbf8'
          GEN_ADD='98ae874bb93dfd3616beefc45d724dd8e6398124'
          FAILED_WF='f0bba25a6fcebf660bcc0535b2113d058923127e'
          INCIDENT='295f314e2081dfba5da471f19a61d8adb44efea3'
          GEN_REPAIR='9d775a0ae33be56249e437fdca133b1403d74e51'
          WF_ADD=$(git log --diff-filter=A --format=%H -- .github/workflows/issue75-phaseA0-generator-authority.yml | tail -1)
          WF_HEAD=$(git log -1 --format=%H -- .github/workflows/issue75-phaseA0-generator-authority.yml)
          test "$(git log --diff-filter=A --format=%H -- experiments/minimal-occupancy-generator/PLAN_A.md | tail -1)" = "$PLAN"
          test "$(git log --diff-filter=A --format=%H -- experiments/minimal-occupancy-generator/phase75a_generator_support.py | tail -1)" = "$GEN_ADD"
          test "$(git log -1 --format=%H -- experiments/minimal-occupancy-generator/phase75a_generator_support.py)" = "$GEN_REPAIR"
          test "$(git log --diff-filter=A --format=%H -- experiments/minimal-occupancy-generator/STAGE_A0_IMPLEMENTATION_INCIDENT_20260901.md | tail -1)" = "$INCIDENT"
          test "$WF_ADD" = "$FAILED_WF"
          test "$WF_HEAD" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$PLAN" "$GEN_ADD"
          git merge-base --is-ancestor "$GEN_ADD" "$FAILED_WF"
          git merge-base --is-ancestor "$FAILED_WF" "$INCIDENT"
          git merge-base --is-ancestor "$INCIDENT" "$GEN_REPAIR"
          git merge-base --is-ancestor "$GEN_REPAIR" "$WF_HEAD"
          test ! -e experiments/minimal-occupancy-generator/stage-a0

      - name: Checkout frozen ZL3b source
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: _cipher_benchmark
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Verify exact source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _cipher_benchmark rev-parse HEAD)" = '315f0cad4de3d021bd4185765c037cf2a28d341c'
          test "$(git -C _cipher_benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = '2a4533ab9bdfa85db9bad602d590978953055df1'

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1

      - name: Compile target-blind generator
        run: python -m py_compile experiments/minimal-occupancy-generator/phase75a_generator_support.py

      - name: Generate and freeze all 124 corpora without target access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue75-a0
          python experiments/minimal-occupancy-generator/phase75a_generator_support.py \
            _cipher_benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            /tmp/issue75-a0/generator_authority.json \
            > /tmp/issue75-a0/stdout.txt

      - name: Enforce target firewall and complete population
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='/tmp/issue75-a0/generator_authority.json'
          r=json.load(open(p, encoding='utf-8'))
          assert r['schema']=='issue75-phaseA0-minimal-occupancy-generator-authority-v1'
          assert r['status']=='M0_M1_MPLUS_124_CORPORA_FROZEN_TARGET_BLIND'
          assert r['plan_commit']=='8d984cfa61a5616bef61b45248c0a7a5d213fbf8'
          assert r['source']['ZL3b_blob']=='2a4533ab9bdfa85db9bad602d590978953055df1'
          assert r['source']['visible_tokens']==32570
          assert r['source']['parsed_tokens']==25071
          assert r['source']['fold_parsed_tokens']==[4430,4810,5516,5447,4868]
          assert len(r['cases'])==124
          expected={(f,i) for f in ('M0','M1','MPLUS-A','MPLUS-B') for i in range(31)}
          got={(x['family'],x['rep']) for x in r['cases']}
          assert got==expected
          assert len({x['occupancy_sha256'] for x in r['cases']})==124
          assert all(x['tokens']==25071 for x in r['cases'])
          assert all(x['fold_tokens']==[4430,4810,5516,5447,4868] for x in r['cases'])
          assert all(x['all_zero_count']==0 for x in r['cases'])
          assert all(x['pair_Q_computed'] is False for x in r['cases'])
          assert all(x['residual_Z_computed'] is False for x in r['cases'])
          assert all(x['target_topology_loaded'] is False for x in r['cases'])
          assert all(x['target_correlation_computed'] is False for x in r['cases'])
          assert all(v is False for v in r['target_access'].values())
          assert r['no_drops'] is True and r['no_rerolls'] is True
          mx=max(r['fit'][fam][str(f)]['max_abs_marginal_error'] for fam in ('M0','M1') for f in range(5))
          assert mx <= 1e-10, mx
          print({'cases':124,'fit_max_error':mx,'target_access':r['target_access']})
          PY

      - name: Freeze SHA and provenance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/issue75-a0/generator_authority.json /tmp/issue75-a0/stdout.txt > /tmp/issue75-a0/SHA256SUMS.txt
          cat > /tmp/issue75-a0/PROVENANCE.txt <<EOF
          scientific_role=PRETARGET_CROSSFITTED_OCCUPANCY_GENERATION_AUTHORITY
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          generation_head=${GITHUB_SHA}
          plan_commit=8d984cfa61a5616bef61b45248c0a7a5d213fbf8
          generator_add_commit=98ae874bb93dfd3616beefc45d724dd8e6398124
          pretarget_failed_run=33500769086
          implementation_incident_commit=295f314e2081dfba5da471f19a61d8adb44efea3
          generator_numerical_repair_commit=9d775a0ae33be56249e437fdca133b1403d74e51
          source_repo=matthewdgreen/cipher_benchmark
          source_commit=315f0cad4de3d021bd4185765c037cf2a28d341c
          source_blob=2a4533ab9bdfa85db9bad602d590978953055df1
          cases=124
          target_loaded=false
          pair_Q_computed=false
          residual_Z_computed=false
          target_correlation_computed=false
          drops=0
          rerolls=0
          EOF

      - name: Upload exact target-blind authority
        uses: actions/upload-artifact@v4
        with:
          name: issue75-phaseA0-generator-authority-${{ github.sha }}
          path: /tmp/issue75-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Commit target-blind authority into repository
        shell: bash
        run: |
          set -euo pipefail
          DEST=experiments/minimal-occupancy-generator/stage-a0
          mkdir -p "$DEST"
          cp /tmp/issue75-a0/generator_authority.json "$DEST/"
          cp /tmp/issue75-a0/stdout.txt "$DEST/"
          cp /tmp/issue75-a0/SHA256SUMS.txt "$DEST/"
          cp /tmp/issue75-a0/PROVENANCE.txt "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m 'Issue75 Phase A0: freeze 124 target-blind generator corpora'
          git push origin HEAD:issue75-minimal-occupancy-generator
