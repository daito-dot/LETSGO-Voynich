name: Issue109 Phase3C pure Herbal Gate0

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/phase3c/PURE_HERBAL_GATE0_PLAN.md'
      - 'experiments/predictive-information/phase3c/pure_herbal_gate0.py'
      - '.github/workflows/issue109-phase3c-herbal-gate0.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt

jobs:
  pure-herbal-gate0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen source
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Enforce score-free pure-Herbal gate
        shell: bash
        run: |
          test -f experiments/predictive-information/phase3c/PURE_HERBAL_GATE0_PLAN.md
          test -f experiments/predictive-information/phase3c/pure_herbal_gate0.py
          if grep -E 'bits_per_token|log_likelihood|score_outer|output_metrics|score_r1\(|metric_gates\(|H62P1|target_exposed' experiments/predictive-information/phase3c/pure_herbal_gate0.py; then
            echo 'Predictive/target scorer found in Phase-3C Gate0 executable' >&2
            exit 1
          fi

      - name: Compile and self-test
        shell: bash
        run: |
          python -m py_compile experiments/predictive-information/phase3c/pure_herbal_gate0.py
          python experiments/predictive-information/phase3c/pure_herbal_gate0.py --self-test

      - name: Run pure-Herbal support audit
        shell: bash
        run: |
          python experiments/predictive-information/phase3c/pure_herbal_gate0.py --audit "$ZL3B" phase3c_pure_herbal_gate0.json
          python -m json.tool phase3c_pure_herbal_gate0.json > /dev/null
          sha256sum phase3c_pure_herbal_gate0.json

      - name: Assert firewall and print gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('phase3c_pure_herbal_gate0.json'))
          assert x['phase3b_authority_sha256'] == '8f48a62e74fa34f78691949a4b9404caaea39fd6ad8360a93600c653f7147717'
          assert x['metadata_mapping']['visible_rows'] == 32570
          assert x['metadata_mapping']['accepted_rows'] == 25071
          assert x['order_authority']['numeric_paragraph_order_valid'] is True
          assert x['order_authority']['source_document_order_valid'] is True
          assert x['firewall'] == {
              'predictive_scores_computed': False,
              'model_fitted': False,
              'surface_target_metrics_scored': False,
              'issue84_target_used': False,
              'hand_conditioning_used': False,
              'semantic_or_image_context_used': False,
              'latent_state_fitted': False,
              'within_leaf_token_filtering_used': False,
          }
          print(json.dumps({
              'gate_pass':x['gate_pass'],
              'gate_rule':x['gate_rule'],
              'population':x['population'],
              'excluded_leaf_count':len(x['excluded_leaves']),
          },indent=2,sort_keys=True))
          PY

      - name: Upload Gate 0 authority
        uses: actions/upload-artifact@v4
        with:
          name: issue109-phase3c-pure-herbal-gate0
          path: phase3c_pure_herbal_gate0.json
