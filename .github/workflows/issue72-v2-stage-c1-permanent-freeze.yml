name: Issue72 V2 Stage C1 permanent first-reveal freeze

on:
  push:
    branches: [issue72-r1-causal-decomposition-v2]
    paths:
      - '.github/workflows/issue72-v2-stage-c1-permanent-freeze.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout archive head
        uses: actions/checkout@v4
        with:
          ref: issue72-r1-causal-decomposition-v2
          fetch-depth: 0

      - name: Verify scientific first-reveal ancestry
        shell: bash
        run: |
          set -euo pipefail
          SCI=200e664eaabc9c65774b9a46417a6b004ecf8e18
          git merge-base --is-ancestor "$SCI" HEAD
          test "$(git show -s --format=%s "$SCI")" = 'Issue72 V2 C1: execute complete paired-association first reveal'

      - name: Download exact complete first-reveal artifact
        uses: actions/download-artifact@v4
        with:
          name: issue72-v2-stageC1-first-reveal-200e664eaabc9c65774b9a46417a6b004ecf8e18
          path: /tmp/c1-source
          github-token: ${{ github.token }}
          repository: daito-dot/LETSGO-Voynich
          run-id: 33469456818

      - name: Verify exact population and hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find /tmp/c1-source/individual -maxdepth 1 -name '*_r*.json' | wc -l)" -eq 124
          test "$(sha256sum /tmp/c1-source/stage_c1_aggregate.json | cut -d' ' -f1)" = 'ff46576e4f8bd015e7ad90689bb04b3984d43d3da3c98547ed09d58f58405f0c'
          sed 's#/tmp/c1-final/#/tmp/c1-source/#' /tmp/c1-source/SHA256SUMS.txt > /tmp/c1-source/SHA256SUMS_RELOCATED.txt
          sha256sum -c /tmp/c1-source/SHA256SUMS_RELOCATED.txt
          python - <<'PY'
          import json
          r=json.load(open('/tmp/c1-source/stage_c1_aggregate.json'))
          assert r['status']=='STAGE C1 COMPLETE FIXED-PATH ASSOCIATION RANDOMIZATION AGGREGATED'
          assert r['scientific_head']=='200e664eaabc9c65774b9a46417a6b004ecf8e18'
          assert r['population']['total_results']==124
          assert r['population']['complete_population'] is True
          assert r['aggregation_policy']['hard_intervention_threshold_applied'] is False
          assert r['aggregation_policy']['readings_averaged'] is False
          assert r['aggregation_policy']['coverage_gate_applied'] is False
          expected={
              'EL':(31,0,0),
              'ES':(31,0,0),
              'ET':(18,12,1),
              'EG':(31,0,0),
          }
          for a,(neg,nonneg,mixed) in expected.items():
              d=r['axes'][a]['reading_direction_agreement']
              assert (d['both_negative'],d['both_nonnegative'],d['mixed'])==(neg,nonneg,mixed)
          print('Stage C1 permanent-freeze verification passed')
          PY

      - name: Copy exact first-reveal authority into repository
        shell: bash
        run: |
          set -euo pipefail
          DEST=experiments/naibbe-r1-decomposition-v2/stage-c1
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a /tmp/c1-source/individual "$DEST/"
          cp /tmp/c1-source/stage_c1_aggregate.json "$DEST/"
          cp /tmp/c1-source/stdout.txt "$DEST/"
          cp /tmp/c1-source/SHA256SUMS.txt "$DEST/"
          cp /tmp/c1-source/PROVENANCE.txt "$DEST/"
          cat > "$DEST/ARTIFACT_AUTHORITY.txt" <<'EOF'
          source_workflow_run=33469456818
          source_workflow_conclusion=success
          source_artifact_id=9786807320
          source_artifact_name=issue72-v2-stageC1-first-reveal-200e664eaabc9c65774b9a46417a6b004ecf8e18
          source_artifact_zip_sha256=ff8afdee9f54e7557c67152f22f120d0e385d30530b2ce604618dd6fe133e8cc
          aggregate_sha256=ff46576e4f8bd015e7ad90689bb04b3984d43d3da3c98547ed09d58f58405f0c
          scientific_head=200e664eaabc9c65774b9a46417a6b004ecf8e18
          total_assignment_results=124
          permanent_freeze_is_post_reveal_transport_only=true
          EOF

      - name: Commit permanent first-reveal authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/naibbe-r1-decomposition-v2/stage-c1
          git diff --cached --quiet && exit 0
          git commit -m 'Issue72 V2 C1: freeze exact 124-assignment first-reveal authority'
          git push origin HEAD:issue72-r1-causal-decomposition-v2
