name: Issue68 Stage0 authority replay verification v3

on:
  push:
    branches: [issue68-joint-constraint-tournament]
    paths:
      - '.github/workflows/issue68-stage0-authority-audit-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue68-joint-constraint-tournament
          fetch-depth: 0

      - name: Verify Stage0 chronology
        shell: bash
        run: |
          set -euo pipefail
          PLAN=$(git log --diff-filter=A --format=%H -- experiments/joint-constraint-tournament/STAGE0_PLAN.md | tail -1)
          SCRIPT=$(git log --diff-filter=A --format=%H -- experiments/joint-constraint-tournament/authority_audit.py | tail -1)
          test -n "$PLAN" && test -n "$SCRIPT" && test "$PLAN" != "$SCRIPT"
          git merge-base --is-ancestor "$PLAN" "$SCRIPT"
          echo "STAGE0_PLAN=$PLAN" >> "$GITHUB_ENV"
          echo "STAGE0_SCRIPT=$SCRIPT" >> "$GITHUB_ENV"

      - name: Checkout frozen ZL3b source
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: _cipher_benchmark
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Checkout frozen CREMMA controls
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: _cremma
          sparse-checkout: |
            data/BIS-193
            data/CLM13027
            data/Mazarine915
            data/UBL758
          sparse-checkout-cone-mode: false

      - name: Checkout pinned Naibbe publication code
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: _naibbe
          sparse-checkout: |
            naibbe_v2.py
            sixteentables.csv
          sparse-checkout-cone-mode: false

      - name: Verify ZL3b CREMMA and Naibbe commit authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _cipher_benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C _cipher_benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(git -C _cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"
          test "$(git -C _naibbe rev-parse HEAD)" = "f2675ec5dd275268bc64dd48ea64fc0e0e9827a2"
          PYB=$(git -C _naibbe hash-object naibbe_v2.py)
          TBL=$(git -C _naibbe hash-object sixteentables.csv)
          grep -F "$PYB" experiments/phase64/C1_SOURCE_AUDIT_B.md >/dev/null
          grep -F "$TBL" experiments/phase64/C1_SOURCE_AUDIT_B.md >/dev/null
          echo "NAIBBE_PY_BLOB=$PYB" >> "$GITHUB_ENV"
          echo "NAIBBE_TABLE_BLOB=$TBL" >> "$GITHUB_ENV"

      - name: Audit pinned Naibbe public interface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('_naibbe/naibbe_v2.py').read_text(encoding='utf-8')
          for x in ['UNAMBIGUOUS = True','REMOVE_SPACES = True','REMOVE_SPACES_PERCENTAGE = 3','RANDOM = True','def encrypt(','def respace(']:
              assert x in s, x
          assert 'def decrypt(' not in s
          assert 'def decode(' not in s
          print('Naibbe pinned defaults/interface audit: PASS')
          PY

      - name: Install frozen scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1

      - name: Run Stage0 machine audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile experiments/joint-constraint-tournament/authority_audit.py
          python experiments/joint-constraint-tournament/authority_audit.py > /tmp/issue68_stage0_authority.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/issue68_stage0_authority.json'))
          assert r['new_joint_candidate_scores_computed'] is False
          assert r['authorities']['R1_token_construction']['status'] == 'REPLAYABLE_WITH_FROZEN_WRAPPER'
          assert r['authorities']['R2_H62']['status'] == 'REPLAY_READY'
          assert r['authorities']['R3_S1']['status'] == 'REPLAY_READY'
          assert r['c0_reversibility_audit']['C0-4_digraph']['glyph_stream_exact_without_side_info'] is True
          assert r['c0_reversibility_audit']['C0-4_digraph']['source_token_boundaries_exact_without_side_info'] is False
          PY

      - name: Verify common 99-leaf fold authority across R1 R2 R3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          c=json.load(open('experiments/phase62/phase62c_c0_a1_results.json'))
          p=json.load(open('experiments/phase62/phase62p_h62p1_results.json'))
          d=json.load(open('experiments/occupancy-graph-independent-transcription/first-reveal/issue66_independent_residual_results.json'))
          fc=[x['test_leaves'] for x in c['folds']]
          fp=[x['test_leaves'] for x in p['folds']]
          fd=d['population']['physical_leaf_folds']
          assert fc == fp == fd
          assert len(set(sum(fc, []))) == 99
          print('common physical-leaf fold authority: PASS')
          PY

      - name: Replay Phase62C frozen exposed scorecard
        shell: bash
        run: |
          set -euo pipefail
          ZL=_cipher_benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          python experiments/phase62/phase62c_c0_a1.py "$ZL" _cremma > /tmp/phase62c_replay.json
          python - <<'PY'
          import json
          old=json.load(open('experiments/phase62/phase62c_c0_a1_results.json'))
          new=json.load(open('/tmp/phase62c_replay.json'))
          assert new == old
          print('Phase62C exact semantic JSON replay: PASS')
          PY

      - name: Replay Phase62P frozen H62-P1 scorecard
        shell: bash
        run: |
          set -euo pipefail
          ZL=_cipher_benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          python experiments/phase62/phase62p_h62p1.py "$ZL" _cremma > /tmp/phase62p_replay.json
          python - <<'PY'
          import json
          old=json.load(open('experiments/phase62/phase62p_h62p1_results.json'))
          new=json.load(open('/tmp/phase62p_replay.json'))
          assert new == old
          print('Phase62P exact semantic JSON replay: PASS')
          PY

      - name: Record successful Stage0 authority verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/joint-constraint-tournament/stage0
          cp /tmp/issue68_stage0_authority.json experiments/joint-constraint-tournament/stage0/authority_audit.json
          AUTH_SHA=$(sha256sum /tmp/issue68_stage0_authority.json | awk '{print $1}')
          cat > experiments/joint-constraint-tournament/stage0/STAGE0_REPLAY_VERIFIED.md <<EOF
          # Issue #68 Stage 0 replay verification

          Status: **VERIFIED — no new joint candidate score computed**.

          - workflow run: \`${GITHUB_RUN_ID}\`
          - Stage0 plan first-add: \`${STAGE0_PLAN}\`
          - authority-audit executable first-add: \`${STAGE0_SCRIPT}\`
          - machine audit JSON SHA-256: \`${AUTH_SHA}\`
          - ZL3b source commit: \`315f0cad4de3d021bd4185765c037cf2a28d341c\`
          - ZL3b blob: \`2a4533ab9bdfa85db9bad602d590978953055df1\`
          - CREMMA commit: \`292525969ad98380b398e6606a9c2a36d51913ae\`
          - Naibbe commit: \`f2675ec5dd275268bc64dd48ea64fc0e0e9827a2\`
          - Naibbe script blob as checked against Phase64 source audit: \`${NAIBBE_PY_BLOB}\`
          - Naibbe table blob as checked against Phase64 source audit: \`${NAIBBE_TABLE_BLOB}\`

          Verified:

          1. Stage0 plan predates audit code.
          2. R1, R2 and R3 share the same 99 physical-leaf fold authority; responsibility-specific historical eligibility remains inside folds.
          3. Current-main Phase62C exactly replays its committed frozen semantic JSON from frozen ZL3b + CREMMA.
          4. Current-main Phase62P/H62 exactly replays its committed frozen semantic JSON from the same authorities.
          5. Pinned Naibbe commit/files match the accepted Phase64 source audit; published defaults are intact and the script exposes encryption/respace but no explicit decrypt/decode function.
          6. C0 structured reversibility boundary is explicit: glyph stream exact for all four transforms; C0-4 requires original token-boundary side information for exact structured plaintext closure.
          7. \`new_joint_candidate_scores_computed\` is \`false\`.

          This authorizes Stage0 reporting and later target planning. It does not authorize new candidate scoring until a separate tournament \`PLAN_A.md\` is frozen.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/joint-constraint-tournament/stage0
          git commit -m 'Record Issue68 Stage0 verified authorities'
          git push origin HEAD:issue68-joint-constraint-tournament
