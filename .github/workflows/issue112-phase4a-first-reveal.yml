name: Issue112 Phase4A P1-P2 first reveal

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/phase4a/FIRST_REVEAL_PLAN.md'
      - 'experiments/predictive-information/phase4a/phase4a_boundary_first_reveal.py'
      - '.github/workflows/issue112-phase4a-first-reveal.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt

jobs:
  phase4a-first-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen source and merged Gate0 contract
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(sha256sum "$ZL3B" | awk '{print $1}')" = "bf5b6d4ac1e3a51b1847a9c388318d609020441ccd56984c901c32b09beccafc"
          test -f experiments/predictive-information/phase4a/BOUNDARY_GATE0_PLAN.md
          test -f experiments/predictive-information/phase4a/GATE0_PROVENANCE.md
          test -f experiments/predictive-information/phase4a/FIRST_REVEAL_PLAN.md
          test -f experiments/predictive-information/phase4a/phase4a_boundary_gate0.py
          test -f experiments/predictive-information/phase4a/phase4a_boundary_first_reveal.py

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy

      - name: Compile and self-test before target reveal
        shell: bash
        run: |
          python -m py_compile experiments/predictive-information/phase4a/phase4a_boundary_gate0.py
          python -m py_compile experiments/predictive-information/phase4a/phase4a_boundary_first_reveal.py
          python experiments/predictive-information/phase4a/phase4a_boundary_gate0.py --self-test
          python experiments/predictive-information/phase4a/phase4a_boundary_first_reveal.py --self-test

      - name: Run frozen P1-P2 first reveal
        shell: bash
        run: |
          python experiments/predictive-information/phase4a/phase4a_boundary_first_reveal.py --run "$ZL3B" phase4a_first_reveal.json
          python -m json.tool phase4a_first_reveal.json > /dev/null
          sha256sum phase4a_first_reveal.json

      - name: Assert frozen authority and classification schema
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open('phase4a_first_reveal.json'))
          assert x['schema'] == 'issue112-phase4a-first-reveal-v1'
          assert x['target_reveal'] is True
          a=x['authority']
          assert a['status'] == 'PASS'
          assert a['source_git_blob_sha1'] == '2a4533ab9bdfa85db9bad602d590978953055df1'
          assert a['source_sha256'] == 'bf5b6d4ac1e3a51b1847a9c388318d609020441ccd56984c901c32b09beccafc'
          assert a['fold_identity_sha256'] == 'cf2df8edcf2b25c2f6388c4a9e2c1ee58a24ae05a9cf489ff9a43d2d28f0b64b'
          assert a['event_hashes'] == {
              'real_space_sha256':'45d456d106c96f3085774bfe3f2b8a4ed1c1a1bc70ae135215ea590d0039752c',
              'mid_token_sha256':'2e05e74a35d31391da976bb7a447694210a26e390397ecb738982cac4134b7af',
              'p2_real_space_sha256':'ccd7efe6ce35b74fb41e227893d2bd972c2c4db60f9ae2c3830b38da6c45209b',
          }
          assert a['counts'] == {'real_space':21363,'mid_token':21313,'p2_real_space':18696}
          assert len(x['folds']) == 5
          assert [r['fold'] for r in x['folds']] == [0,1,2,3,4]
          p1=x['primary']['P1']; p2=x['primary']['P2']
          assert p1['pooled_n_real'] == 21363
          assert p1['pooled_n_mid'] == 21313
          assert p2['pooled_n'] == 18696
          for v in [p1['pooled_mean_A_real'],p1['pooled_mean_A_mid'],p1['pooled_D_RESET'],*p1['D_RESET_by_fold'],p2['pooled_mean_observed_minus_shift_left'],p2['pooled_mean_observed_minus_shift_right'],*p2['left_by_fold'],*p2['right_by_fold']]:
              assert math.isfinite(v)
          allowed={
              'SPACE IS A REPRODUCIBLE PRODUCTION BOUNDARY',
              'SPACE MARKS A RESET BUT EXACT CUT IS WEAK',
              'SPACE POSITION IS LOCALLY PRIVILEGED WITHOUT RESET EVIDENCE',
              'VISIBLE SPACE NOT SUPPORTED AS PRODUCTION BOUNDARY',
          }
          assert x['classification'] in allowed
          expected_p1=(p1['pooled_D_RESET'] > 0 and sum(v > 0 for v in p1['D_RESET_by_fold']) >= 4)
          expected_left=(p2['pooled_mean_observed_minus_shift_left'] < 0 and sum(v < 0 for v in p2['left_by_fold']) >= 4)
          expected_right=(p2['pooled_mean_observed_minus_shift_right'] < 0 and sum(v < 0 for v in p2['right_by_fold']) >= 4)
          assert p1['pass'] is expected_p1
          assert p2['left_pass'] is expected_left
          assert p2['right_pass'] is expected_right
          assert p2['pass'] is (expected_left and expected_right)
          print(json.dumps({
              'classification':x['classification'],
              'P1':p1,
              'P2':p2,
          },indent=2,sort_keys=True))
          PY

      - name: Upload first-reveal authority
        uses: actions/upload-artifact@v4
        with:
          name: issue112-phase4a-first-reveal
          path: phase4a_first_reveal.json
