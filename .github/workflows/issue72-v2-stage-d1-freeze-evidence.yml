name: Issue72 V2 Stage D1 freeze first-reveal evidence

on:
  push:
    branches: [issue72-r1-causal-decomposition-v2]
    paths:
      - '.github/workflows/issue72-v2-stage-d1-freeze-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: issue72-v2-stage-d1-freeze-evidence
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout freeze head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify first-reveal scientific authority is immutable
        shell: bash
        run: |
          set -euo pipefail
          FIRST_REVEAL='02d757e36d85cdfc9231be0b8753904b3ceb543c'
          SCORER='127c86f253a5cc12e3802d0976c96649a2c91524'
          ADAPTER='5b5926fa1166d9361a2daf5fb80c81233f8c8f25'
          git merge-base --is-ancestor "$FIRST_REVEAL" HEAD
          test "$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/d1_pt_r1_score72_v2.py | tail -1)" = "$SCORER"
          test "$(git log -1 --format=%H "$FIRST_REVEAL" -- experiments/naibbe-r1-decomposition-v2/d1_pt_aggregate72_v2_rebind.py)" = "$ADAPTER"
          git diff --exit-code "$FIRST_REVEAL" HEAD -- \
            experiments/naibbe-r1-decomposition-v2/d1_pt_r1_score72_v2.py \
            experiments/naibbe-r1-decomposition-v2/d1_pt_aggregate72_v2_rebind.py \
            experiments/naibbe-r1-decomposition-v2/stage_b0_pt_authority.json \
            experiments/naibbe-r1-decomposition-v2/stage_b0_support.json \
            experiments/naibbe-r1-decomposition-v2/stage-d0-pt/stage_d0_pt_support_aggregate.json \
            experiments/naibbe-r1-decomposition-v2/STAGE_D0_PT_AUTHORITY_REBIND_VALIDATION.json \
            experiments/naibbe-r1-decomposition-v2/archive/stage_b2_calibration.json
          test ! -e experiments/naibbe-r1-decomposition-v2/stage-d1-pt

      - name: Download complete successful first-reveal artifact
        uses: actions/download-artifact@v4
        with:
          repository: daito-dot/LETSGO-Voynich
          run-id: 33494367825
          github-token: ${{ github.token }}
          name: issue72-v2-stageD1-PT-FIRST-REVEAL-02d757e36d85cdfc9231be0b8753904b3ceb543c
          path: /tmp/d1-first-reveal

      - name: Verify evidence before repository freeze
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/d1-first-reveal
          sha256sum -c SHA256SUMS.txt
          test "$(find individual -maxdepth 1 -type f -name 'PT_j*_rep*.json' | wc -l)" -eq 155
          python - <<'PY'
          import glob, json
          r=json.load(open('stage_d1_pt_aggregate.json', encoding='utf-8'))
          assert r['schema']=='issue72-v2-stage-d1-pt-aggregate-rebind-v1'
          assert r['status']=='STAGE_D1_COMPLETE_PT_TOTAL_EFFECT_AGGREGATED'
          assert r['scientific_head']=='02d757e36d85cdfc9231be0b8753904b3ceb543c'
          assert r['population']['total_results']==155
          assert r['population']['complete_population'] is True
          assert r['population']['no_drops'] is True
          assert r['population']['no_rerolls'] is True
          assert r['p_both']==0.625
          assert r['readings']['ZL3b']['p_nonloss']==0.625
          assert r['readings']['IT2a']['p_nonloss']==0.5625
          got=set()
          for p in glob.glob('individual/PT_j*_rep*.json'):
              x=json.load(open(p, encoding='utf-8'))
              got.add((x['assignment']['j'],x['assignment']['rep']))
          assert got=={(j,rep) for j in range(31) for rep in range(5)}
          print({'verified':True,'population':155,'p_both':r['p_both']})
          PY

      - name: Copy evidence into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/naibbe-r1-decomposition-v2/stage-d1-pt
          cp -a /tmp/d1-first-reveal/. experiments/naibbe-r1-decomposition-v2/stage-d1-pt/
          cat > experiments/naibbe-r1-decomposition-v2/stage-d1-pt/FREEZE_RECORD.txt <<EOF2
          source_workflow_run=33494367825
          source_artifact_id=9795439622
          source_artifact_zip_sha256=f06f6190f802411494bbae77611c803e363013a366196993913a91394c5d6852
          scientific_head=02d757e36d85cdfc9231be0b8753904b3ceb543c
          successful_target_blind_preflight_run=33494182268
          frozen_by_workflow_run=${GITHUB_RUN_ID}
          frozen_by_workflow_head=${GITHUB_SHA}
          population=155
          drops=0
          rerolls=0
          EOF2

      - name: Reverify repository copy
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/naibbe-r1-decomposition-v2/stage-d1-pt
          sha256sum -c SHA256SUMS.txt
          test "$(find individual -maxdepth 1 -type f -name 'PT_j*_rep*.json' | wc -l)" -eq 155

      - name: Commit immutable Stage D1 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/naibbe-r1-decomposition-v2/stage-d1-pt
          git diff --cached --quiet && { echo 'nothing to commit'; exit 0; }
          git commit -m 'Issue72 V2 Stage D1: freeze complete PT first-reveal evidence'
          git push origin HEAD:issue72-r1-causal-decomposition-v2
