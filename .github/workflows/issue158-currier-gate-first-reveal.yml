name: Issue158 Currier-gate first reveal

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/common-eva-currier/issue158_currier_gate_first_reveal.py'
      - '.github/workflows/issue158-currier-gate-first-reveal.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
  IT2A: external/IT2a-n.txt
  OUT: issue158_currier_gate_first_reveal.json
  SCORER: experiments/predictive-information/common-eva-currier/issue158_currier_gate_first_reveal.py

jobs:
  first-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head with merged Gate ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert merged Gate ancestry and frozen blobs
        shell: bash
        run: |
          git merge-base --is-ancestor ca77b7030dec12778ffdeb1d04bee0b30fb00b65 HEAD
          test "$(git hash-object "$SCORER")" = "e7a70a10dd7b663f3482993b0adfa8f804816158"
          test "$(git hash-object experiments/predictive-information/common-eva-currier/issue158_currier_gate_decomposition_gate0.py)" = "4dbc919f3e9ededa17d2e10f56de46c98456cdea"
          test "$(git hash-object experiments/predictive-information/common-eva-currier/ISSUE158_GATE0_PROVENANCE.md)" = "07595bf7314cfb71763eba1a810bfd3aaa01a239"
          test "$(git hash-object experiments/predictive-information/common-eva-currier/ISSUE158_CURRIER_GATE_DECOMPOSITION_PLAN.md)" = "9ae7d7ea54aca4deea76f482b10010114cc1dac7"
          test "$(git hash-object experiments/predictive-information/common-eva-currier/issue155_common_eva_currier_first_reveal.py)" = "0d57fdd32d298773b5ee38f97c9f104d29fa8377"

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Retrieve exact IT2a authority
        shell: bash
        run: |
          mkdir -p external
          curl --fail --location --retry 3 --retry-delay 2 --output "$IT2A" https://www.voynich.nu/data/IT2a-n.txt

      - name: Verify frozen sources
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(sha256sum "$ZL3B" | awk '{print $1}')" = "bf5b6d4ac1e3a51b1847a9c388318d609020441ccd56984c901c32b09beccafc"
          test "$(git hash-object "$IT2A")" = "4d6d3f2537b1f507a257529b49c94af7d6e03446"
          test "$(sha256sum "$IT2A" | awk '{print $1}')" = "7f27a8b0feed8f6de0a99900df6bf912dd1d295c38e5f830bac8b41c3f536fb5"

      - name: Install frozen parser runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Compile and target-free synthetic self-test
        shell: bash
        run: |
          python -m py_compile "$SCORER"
          python "$SCORER" --self-test

      - name: Run frozen Currier-gate first reveal
        id: scorer
        continue-on-error: true
        shell: bash
        run: |
          python "$SCORER" --run "$ZL3B" "$IT2A" "$OUT"
          python -m json.tool "$OUT" > /dev/null
          sha256sum "$OUT" | tee issue158_currier_gate_first_reveal.sha256

      - name: Preserve scorer output for chronology audit
        if: always()
        shell: bash
        run: |
          if test -f "$OUT"; then
            cat "$OUT"
            sha256sum "$OUT" | tee issue158_currier_gate_first_reveal.sha256
          else
            echo "scorer produced no result JSON" >&2
          fi

      - name: Assert frozen Currier-gate classification contract
        if: steps.scorer.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open('issue158_currier_gate_first_reveal.json',encoding='utf-8'))
          assert x['schema']=='issue158-currier-gate-first-reveal-v1'
          assert x['issue']==158 and x['scored'] is True
          a=x['authority']
          assert a['gate0_reproduced'] is True
          assert a['gate0_result_sha256']=='605e0a82817f394176a3e19c972ed409dfb15df60c72df22db3c0cc765e31099'
          assert a['gate0_script_blob']=='4dbc919f3e9ededa17d2e10f56de46c98456cdea'
          assert a['gate0_provenance_blob']=='07595bf7314cfb71763eba1a810bfd3aaa01a239'
          assert a['plan_blob']=='9ae7d7ea54aca4deea76f482b10010114cc1dac7'
          assert a['gate0_merge']=='ca77b7030dec12778ffdeb1d04bee0b30fb00b65'
          assert a['issue155_scorer_blob']=='0d57fdd32d298773b5ee38f97c9f104d29fa8377'
          m=x['frozen_model']
          assert m['pooled_weights']=={'A':0.5,'B':0.5}
          assert m['k']==2 and m['alpha']==0.01 and m['outcome_vocabulary_size']==32
          assert m['target_native_fallback'] is False
          assert m['rho_temperature_calibration_interpolation_mixture'] is False

          robust={}
          for regime in ('A','B'):
              per_reading=[]
              for reading in ('ZL3b','IT2a'):
                  c=x['cells'][reading][regime]
                  assert len(c['outer'])==5
                  g=[]
                  gp=[]
                  for f,row in enumerate(c['outer']):
                      assert row['fold']==f and row['reading']==reading and row['regime']==regime
                      assert row['n_scored_run_body_targets']>=300
                      assert row['matched_context_supported_body_targets']>=300
                      assert row['matched_context_coverage_fraction']>0.99
                      for key in ('bits_POS2_TARGET_REGIME','bits_EDGE_POOL','bits_EDGE_REGIME','G_pool','G_Currier','G_regime_total'):
                          assert math.isfinite(row[key])
                      assert math.isclose(row['G_pool']+row['G_Currier'],row['G_regime_total'],rel_tol=0.0,abs_tol=1e-12)
                      g.append(row['G_Currier'])
                      gp.append(row['G_pool'])
                  p=c['primary']
                  assert p['G_Currier_by_fold']==g
                  assert p['G_pool_by_fold']==gp
                  mean=sum(g)/5
                  positive=sum(v>0.0 for v in g)
                  expected_pass=(mean>0.0 and positive>=4)
                  assert math.isclose(p['mean_G_Currier'],mean,rel_tol=0.0,abs_tol=1e-15)
                  assert p['positive_G_Currier_folds']==positive
                  assert p['required_positive_folds']==4
                  assert p['pass_within_reading_regime'] is expected_pass
                  per_reading.append(expected_pass)
              robust[regime]=all(per_reading)

          if robust['A'] and robust['B']:
              expected='CURRIER GATE ADDS ROBUST EDGE INFORMATION IN BOTH A AND B'
          elif robust['A']:
              expected='CURRIER GATE ADDS ROBUST EDGE INFORMATION IN A ONLY'
          elif robust['B']:
              expected='CURRIER GATE ADDS ROBUST EDGE INFORMATION IN B ONLY'
          else:
              expected='NO ROBUST CURRIER-GATE EDGE RESIDUAL'
          assert x['classification']==expected
          assert x['primary_joint']['classification']==expected
          assert x['primary_joint']['Currier_A_robust_in_both_readings'] is robust['A']
          assert x['primary_joint']['Currier_B_robust_in_both_readings'] is robust['B']
          assert all(v is False for v in x['firewall'].values())
          print(json.dumps({
              'classification':x['classification'],
              'ZL3b_A':x['cells']['ZL3b']['A']['primary'],
              'IT2a_A':x['cells']['IT2a']['A']['primary'],
              'ZL3b_B':x['cells']['ZL3b']['B']['primary'],
              'IT2a_B':x['cells']['IT2a']['B']['primary'],
          },indent=2,sort_keys=True,ensure_ascii=False))
          PY

      - name: Upload first-reveal authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue158-currier-gate-first-reveal-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          path: |
            issue158_currier_gate_first_reveal.json
            issue158_currier_gate_first_reveal.sha256

      - name: Preserve scorer failure status
        if: steps.scorer.outcome == 'failure'
        shell: bash
        run: exit 1
