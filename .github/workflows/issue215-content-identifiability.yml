name: issue215-content-identifiability

on:
  push:
    branches:
      - issue215-content-identifiability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit pinned page metadata only
        env:
          SOURCE_COMMIT: 472ef7366606a799fc8f1044c037e06b413f6ddd
          EXPECTED_GIT_BLOB_SHA1: f4ec667cd6b0e214eb755ccdc0c48d3d1c20d384
        run: |
          set -euo pipefail
          mkdir -p issue215-audit
          python - <<'PY'
          import collections, hashlib, json, os, urllib.request

          pin = os.environ['SOURCE_COMMIT']
          expected_blob = os.environ['EXPECTED_GIT_BLOB_SHA1']
          url = f'https://raw.githubusercontent.com/noah-chelednik/voynich-data/{pin}/output/metadata/pages.jsonl'
          raw = urllib.request.urlopen(url, timeout=60).read()
          git_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          if git_blob != expected_blob:
              raise SystemExit(f'Git blob mismatch: {git_blob} != {expected_blob}')
          open('issue215-audit/pages.jsonl', 'wb').write(raw)

          rows = [json.loads(x) for x in raw.decode('utf-8').splitlines() if x.strip()]
          allowed_i = set('HABC PSTZ'.replace(' ',''))

          def section_value(r):
              s = r.get('section')
              return s.get('value') if isinstance(s, dict) else s

          text_rows = [r for r in rows if r.get('has_text') is True]
          missing = collections.Counter()
          complete = []
          unknown_illustration_values = collections.Counter()
          for r in text_rows:
              vals = {
                  'illustration_type': r.get('illustration_type'),
                  'section': section_value(r),
                  'currier_language': r.get('currier_language'),
                  'hand': r.get('hand'),
              }
              for k,v in vals.items():
                  if v in (None, '', '?'):
                      missing[k] += 1
              if vals['illustration_type'] not in (None, '', '?') and vals['illustration_type'] not in allowed_i:
                  unknown_illustration_values[str(vals['illustration_type'])] += 1
              if all(v not in (None, '', '?') for v in vals.values()):
                  rr = dict(r)
                  rr['_section'] = vals['section']
                  complete.append(rr)

          by_type = collections.Counter(r['illustration_type'] for r in complete)
          by_section = collections.defaultdict(collections.Counter)
          by_currier = collections.defaultdict(collections.Counter)
          by_hand = collections.defaultdict(collections.Counter)
          strata = collections.defaultdict(list)
          for r in complete:
              typ = r['illustration_type']
              by_section[r['_section']][typ] += 1
              by_currier[r['currier_language']][typ] += 1
              by_hand[r['hand']][typ] += 1
              key = (r['_section'], r['currier_language'], r['hand'])
              strata[key].append(r)

          mixed = {k:v for k,v in strata.items() if len({r['illustration_type'] for r in v}) >= 2}
          mixed_pages = [r for v in mixed.values() for r in v]
          mixed_by_type = collections.Counter(r['illustration_type'] for r in mixed_pages)

          majority_correct = 0
          stratum_records = []
          for k, rs in sorted(strata.items()):
              c = collections.Counter(r['illustration_type'] for r in rs)
              majority_correct += max(c.values())
              stratum_records.append({
                  'section': k[0], 'currier': k[1], 'hand': k[2],
                  'n': len(rs), 'illustration_counts': dict(sorted(c.items())),
                  'mixed': len(c) >= 2,
                  'page_ids': sorted(r['page_id'] for r in rs),
              })
          majority_accuracy = majority_correct / len(complete) if complete else None

          # Bipartite connected components over illustration types and mixed confounder strata.
          graph = collections.defaultdict(set)
          stratum_name = {}
          for idx, (k, rs) in enumerate(sorted(mixed.items())):
              sn = f's:{idx}'
              stratum_name[sn] = {'section':k[0], 'currier':k[1], 'hand':k[2]}
              for typ in sorted({r['illustration_type'] for r in rs}):
                  tn = f't:{typ}'
                  graph[sn].add(tn); graph[tn].add(sn)
          seen=set(); comps=[]
          for node in sorted(graph):
              if node in seen: continue
              stack=[node]; seen.add(node); nodes=[]
              while stack:
                  x=stack.pop(); nodes.append(x)
                  for y in graph[x]:
                      if y not in seen:
                          seen.add(y); stack.append(y)
              types=sorted(x[2:] for x in nodes if x.startswith('t:'))
              ss=[x for x in nodes if x.startswith('s:')]
              comps.append({
                  'illustration_types': types,
                  'n_types': len(types),
                  'n_strata': len(ss),
                  'strata': [stratum_name[x] for x in ss],
              })
          comps.sort(key=lambda x:(x['n_types'],x['n_strata']), reverse=True)

          n_classes_8 = sum(v >= 8 for v in by_type.values())
          n_mixed_classes_4 = sum(v >= 4 for v in mixed_by_type.values())
          full_component = any(c['n_types'] >= 3 and c['n_strata'] >= 4 for c in comps)
          partial_component = any(c['n_types'] >= 2 and c['n_strata'] >= 2 for c in comps)

          full = (
              len(complete) >= 60 and n_classes_8 >= 3 and len(mixed) >= 4 and
              len(mixed_pages) >= 20 and n_mixed_classes_4 >= 3 and full_component
          )
          partial = (
              len(mixed) >= 2 and len(mixed_pages) >= 12 and
              n_mixed_classes_4 >= 2 and partial_component
          )
          classification = 'IDENTIFIABLE_FOR_HELDOUT_TEST' if full else (
              'PARTIALLY_IDENTIFIABLE_RESTRICTED_DESIGN' if partial else 'NOT_IDENTIFIABLE'
          )

          result = {
              'issue': 215,
              'stage': 'METADATA_ONLY_IDENTIFIABILITY_GATE',
              'text_or_vocabulary_features_accessed': False,
              'classification': classification,
              'source': {
                  'repository': 'noah-chelednik/voynich-data',
                  'commit': pin,
                  'path': 'output/metadata/pages.jsonl',
                  'bytes': len(raw),
                  'git_blob_sha1': git_blob,
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'url': url,
              },
              'counts': {
                  'all_page_records': len(rows),
                  'text_bearing_records': len(text_rows),
                  'complete_text_bearing_records': len(complete),
                  'missing_on_text_bearing': dict(sorted(missing.items())),
                  'unknown_illustration_values': dict(sorted(unknown_illustration_values.items())),
                  'complete_by_illustration_type': dict(sorted(by_type.items())),
                  'classes_with_at_least_8_pages': n_classes_8,
                  'confounder_strata': len(strata),
                  'mixed_strata': len(mixed),
                  'mixed_stratum_pages': len(mixed_pages),
                  'mixed_pages_by_illustration_type': dict(sorted(mixed_by_type.items())),
                  'mixed_classes_with_at_least_4_pages': n_mixed_classes_4,
              },
              'confounder_only_exact_tuple_majority_accuracy': majority_accuracy,
              'crosstabs': {
                  'section_by_illustration': {k:dict(sorted(v.items())) for k,v in sorted(by_section.items())},
                  'currier_by_illustration': {k:dict(sorted(v.items())) for k,v in sorted(by_currier.items())},
                  'hand_by_illustration': {k:dict(sorted(v.items())) for k,v in sorted(by_hand.items())},
              },
              'strata': stratum_records,
              'mixed_components': comps,
              'eligible_mixed_page_ids': sorted(r['page_id'] for r in mixed_pages),
              'gate_checks': {
                  'n_complete_ge_60': len(complete) >= 60,
                  'three_types_ge_8': n_classes_8 >= 3,
                  'four_mixed_strata': len(mixed) >= 4,
                  'twenty_mixed_pages': len(mixed_pages) >= 20,
                  'three_mixed_types_ge_4': n_mixed_classes_4 >= 3,
                  'full_connected_component': full_component,
                  'partial_two_mixed_strata': len(mixed) >= 2,
                  'partial_twelve_mixed_pages': len(mixed_pages) >= 12,
                  'partial_two_mixed_types_ge_4': n_mixed_classes_4 >= 2,
                  'partial_connected_component': partial_component,
              },
          }
          out = json.dumps(result, ensure_ascii=False, indent=2)
          open('issue215-audit/issue215_identifiability_result.json','w',encoding='utf-8').write(out+'\n')
          canon = json.dumps(result, ensure_ascii=False, sort_keys=True, separators=(',',':')).encode()
          open('issue215-audit/manifest_sha256.txt','w').write(hashlib.sha256(canon).hexdigest()+'  issue215_identifiability_result.canonical-json\n')
          print(out)
          PY
          sha256sum issue215-audit/pages.jsonl issue215-audit/issue215_identifiability_result.json

      - name: Upload metadata-only audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: issue215-content-identifiability
          path: issue215-audit/
          if-no-files-found: error
