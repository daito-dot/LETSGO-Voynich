name: Issue72 V2 Stage C1 target-blind preflight recovery

on:
  push:
    branches: [issue72-r1-causal-decomposition-v2]
    paths:
      - '.github/workflows/issue72-v2-stage-c1-preflight-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1-preflight-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v4
        with:
          ref: issue72-r1-causal-decomposition-v2
          fetch-depth: 0

      - name: Verify frozen chronology and target firewall
        shell: bash
        run: |
          set -euo pipefail
          PLAN=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/STAGE_C_FIXED_PATH_RANDOMIZATION_PLAN.md | tail -1)
          AMEND=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/STAGE_C_SCORING_AMENDMENT_C1.md | tail -1)
          CONTRACT=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/STAGE_C_TARGET_IMPLEMENTATION.md | tail -1)
          CODE=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/c1_r1_target72_v2.py | tail -1)
          FIRST_PREFLIGHT=$(git log --diff-filter=A --format=%H -- .github/workflows/issue72-v2-stage-c1-preflight.yml | tail -1)
          INCIDENT=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/STAGE_C1_PREFLIGHT_IMPLEMENTATION_INCIDENT_20260901.md | tail -1)
          WRAPPER=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/c1_r1_target72_v2_recovery.py | tail -1)
          THIS=$(git log --diff-filter=A --format=%H -- .github/workflows/issue72-v2-stage-c1-preflight-recovery.yml | tail -1)
          test "$PLAN" = '79b498ef359b4cd69c3b8917e62eb11adbfb29d2'
          test "$AMEND" = '35df496d9194138ec1fdf44a4d78613811c93bce'
          test "$CONTRACT" = '963b8d279f7e6c616aed52aa4f4e2d4b83fe642a'
          test "$CODE" = '1854db3dc0a3f55ac3974e7d35d18ebcd33e1bcd'
          test "$FIRST_PREFLIGHT" = 'd29c8a697e4ad70d0c905cc1fbc6a84366a4cd27'
          git merge-base --is-ancestor "$FIRST_PREFLIGHT" "$INCIDENT"
          git merge-base --is-ancestor "$INCIDENT" "$WRAPPER"
          git merge-base --is-ancestor "$WRAPPER" "$THIS"
          test ! -e .github/workflows/issue72-v2-stage-c1-first-reveal.yml
          test ! -e experiments/naibbe-r1-decomposition-v2/STAGE_C1_REPORT.md
          echo "PREFLIGHT_RECOVERY_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "INCIDENT_FIRST_ADD=$INCIDENT" >> "$GITHUB_ENV"
          echo "WRAPPER_FIRST_ADD=$WRAPPER" >> "$GITHUB_ENV"
          echo "RECOVERY_WORKFLOW_FIRST_ADD=$THIS" >> "$GITHUB_ENV"

      - name: Verify permanent C0 authority
        shell: bash
        run: |
          set -euo pipefail
          C0=experiments/naibbe-r1-decomposition-v2/stage-c0
          test "$(wc -c < "$C0/stage_c0_support.json.gz")" -eq 12780097
          echo '946d8f8fa61d996a548a344f7e303f804283230ce8bef0d51add473d811e4ed3  experiments/naibbe-r1-decomposition-v2/stage-c0/stage_c0_support.json.gz' | sha256sum -c -
          gzip -dc "$C0/stage_c0_support.json.gz" | sha256sum | grep '^da00a66b77a90eb36a158a9942927a27743e64aba7fac69337ff3a67424d695a  -$'
          echo 'aba822be57bbac0c04a9fa785a0a835eafe192b406fead5cd7166051825f45ae  experiments/naibbe-r1-decomposition-v2/stage-c0/MANIFEST.json' | sha256sum -c -
          test "$(find "$C0" -maxdepth 1 -name 'trace_rep*_*.json.gz' | wc -l)" -eq 20

      - name: Checkout pinned Naibbe authority
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: external/naibbe

      - name: Verify exact Naibbe authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/naibbe rev-parse HEAD)" = 'f2675ec5dd275268bc64dd48ea64fc0e0e9827a2'
          test "$(git -C external/naibbe hash-object naibbe_v2.py)" = 'b566ad82e4b6ff0782ecdddebf77718dac44f292'
          test "$(git -C external/naibbe hash-object references/naibbe_tables.csv)" = '5cd34fb81d80faf3b4d57dbf1719c05ffde25302'

      - name: Install frozen preexisting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pandas

      - name: Compile frozen scorer and recovery wrapper
        run: |
          python -m py_compile experiments/naibbe-r1-decomposition-v2/c1_r1_target72_v2.py
          python -m py_compile experiments/naibbe-r1-decomposition-v2/c1_r1_target72_v2_recovery.py
          python experiments/naibbe-r1-decomposition-v2/c1_r1_target72_v2_recovery.py --self-test

      - name: Verify-only reconstruction across all four axes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/c1-preflight-recovery
          mkdir -p /tmp/c1-preflight-recovery
          for SPEC in 'EL 0' 'EL 30' 'ES 0' 'ES 30' 'ET 0' 'ET 30' 'EG 0' 'EG 30'; do
            set -- $SPEC
            axis=$1
            j=$2
            out=/tmp/c1-preflight-recovery/${axis}_r${j}.json
            python experiments/naibbe-r1-decomposition-v2/c1_r1_target72_v2_recovery.py \
              external/naibbe experiments/naibbe-r1-decomposition-v2/stage-c0 \
              "$axis" "$j" "$out" --verify-only
            python - "$out" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['status']=='C1 SUPPORT RECONSTRUCTION VERIFIED TARGET BLIND'
          assert all(v is False for v in r['target_access'].values())
          assert r['paired_geometry']['same_line_mask'] is True
          assert r['paired_geometry']['same_fold_identity'] is True
          assert len(r['support']['four_manuscript_fold_counts'])==4
          assert sum(r['support']['four_manuscript_fold_counts'])==r['support']['common_support_count']
          PY
          done

      - name: Freeze exact target-blind recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/c1-preflight-recovery/*.json | sort > /tmp/c1-preflight-recovery/SHA256SUMS.txt
          cat > /tmp/c1-preflight-recovery/PROVENANCE.txt <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          preflight_recovery_head=${PREFLIGHT_RECOVERY_HEAD}
          failed_preflight_run=33469065031
          failed_preflight_job=99734901522
          incident_first_add=${INCIDENT_FIRST_ADD}
          recovery_wrapper_first_add=${WRAPPER_FIRST_ADD}
          recovery_workflow_first_add=${RECOVERY_WORKFLOW_FIRST_ADD}
          recovery_scope=OMIT_EMPTY_RECONSTRUCTED_LINES_TO_MATCH_FROZEN_C0_TOKEN_BEARING_MASK_DOMAIN
          c1_target_loaded=false
          c1_Q_computed=false
          c1_residual_Z_computed=false
          c1_target_correlation_computed=false
          EOF

      - name: Upload target-blind recovery preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue72-v2-stageC1-preflight-recovery-${{ env.PREFLIGHT_RECOVERY_HEAD }}
          path: /tmp/c1-preflight-recovery
          if-no-files-found: error
          retention-days: 90
