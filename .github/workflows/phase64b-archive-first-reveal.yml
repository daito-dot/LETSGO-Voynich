name: Phase64B archive exact first reveal

on:
  push:
    branches: [phase64b-naibbe-science]
    paths:
      - '.github/workflows/phase64b-archive-first-reveal.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout result branch
        uses: actions/checkout@v4
        with:
          ref: phase64b-naibbe-science
          fetch-depth: 0

      - name: Download and verify exact first-reveal artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase64b-first-reveal
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9739776686/zip" \
            -o /tmp/phase64b-first-reveal.zip
          echo "f8534605b0c6b2396341d47d54b7d4280632ba14eb30ae7f34b8208921dab378  /tmp/phase64b-first-reveal.zip" | sha256sum -c -
          unzip -q /tmp/phase64b-first-reveal.zip -d /tmp/phase64b-first-reveal
          test -f /tmp/phase64b-first-reveal/phase64b_science_results.json
          echo "f88954c2efa2ec69e4bee0cd6fb1c70b49f08b1f44206c7f70bd540ad538d35d  /tmp/phase64b-first-reveal/phase64b_science_results.json" | sha256sum -c -
          cp /tmp/phase64b-first-reveal/phase64b_science_results.json experiments/phase64/phase64b_science_results.json

      - name: Commit exact raw result to branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum experiments/phase64/phase64b_science_results.json | awk '{print $1}')" = "f88954c2efa2ec69e4bee0cd6fb1c70b49f08b1f44206c7f70bd540ad538d35d"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/phase64/phase64b_science_results.json
          if git diff --cached --quiet; then
            echo "Exact result already archived."
            exit 0
          fi
          git commit -m "Archive exact Phase 64B first-reveal result"
          git push origin HEAD:phase64b-naibbe-science
