name: Issue84 Phase C genre-control first reveal

on:
  push:
    branches: [research/issue84-phase-c-genre-controls]
    paths:
      - '.github/workflows/issue84-phase-c-first-reveal.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

concurrency:
  group: issue84-phase-c-first-reveal
  cancel-in-progress: false

jobs:
  first-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout frozen scientific head
        uses: actions/checkout@v4

      - name: Install frozen runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.5.2

      - name: Compile frozen executable
        run: python -m py_compile experiments/cross-linguistic-baselines/phase84c.py

      - name: Execute authoritative first reveal
        shell: bash
        run: |
          mkdir -p _phase84c_cache out
          python experiments/cross-linguistic-baselines/phase84c.py \
            "$(pwd)/_phase84c_cache" \
            "$(pwd)/out/phase84c_results.json" \
            > >(tee out/phase84c_stdout.json) \
            2> >(tee out/phase84c_stderr.log >&2)
          rm -rf _phase84c_cache

      - name: Write compact frozen summary and provenance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('out/phase84c_results.json').read_text())
          compact={
              'schema':x['schema'],
              'target_intervals':x['phaseA_authority']['target_intervals'],
              'preflight':x['preflight'],
              'sources':{
                  k:{
                      'source_tokens_before_cap':v['source_tokens_before_cap'],
                      'tokens_scored':v['tokens_scored'],
                      'primary':v['classification']['primary'],
                      'responsibilities':v['classification']['responsibilities'],
                      'classification':v['classification']['classification'],
                      'signed_distance':v['classification']['signed_distance_to_target_interval'],
                  }
                  for k,v in x['sources'].items()
              },
              'genre_aggregates':{
                  k:{
                      'documents':v['documents'],
                      'descriptive_only':v['descriptive_only'],
                      'primary':v['classification_against_same_interval_descriptive']['primary'],
                      'responsibilities':v['classification_against_same_interval_descriptive']['responsibilities'],
                      'classification':v['classification_against_same_interval_descriptive']['classification'],
                  }
                  for k,v in x['genre_aggregates'].items()
              },
              'panel':x['panel'],
              'claim_limit':x['claim_limit'],
          }
          Path('out/phase84c_summary.json').write_text(json.dumps(compact,ensure_ascii=False,indent=1)+'\n')
          PY
          cat > out/PROVENANCE.md <<EOF
          # Issue #84 Phase C first-reveal provenance

          - workflow run: ${GITHUB_RUN_ID}
          - scientific head: ${GITHUB_SHA}
          - branch: ${GITHUB_REF_NAME}
          - plan: experiments/cross-linguistic-baselines/PLAN_C.md
          - plan freeze commit: 9f9bfc5f55041d3a6845b764758b1e0d164bcedf
          - C0 source plan commit: ab2ec40ab77c614871c56adf57a81392e618364c
          - C0 final report commit: 0efae2f963fb49183668634498c86da0e81c2fef
          - score-free extraction preflight run: 34012721055
          - score-free preflight head: 97b2c98a9039c2467a722ee6ba802ec3b8044999
          - score-free preflight artifact: 9982965549
          - PYTHONHASHSEED: 0
          - numpy: 2.5.2
          EOF
          sha256sum \
            out/phase84c_results.json \
            out/phase84c_summary.json \
            out/phase84c_stdout.json \
            out/phase84c_stderr.log \
            out/PROVENANCE.md \
            > out/SHA256SUMS

      - name: Upload immutable first-reveal bundle
        uses: actions/upload-artifact@v4
        with:
          name: issue84-phasec-first-reveal
          path: out/
          retention-days: 90
          if-no-files-found: error
