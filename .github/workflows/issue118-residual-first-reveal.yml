name: Issue118 flexible sequence residual first reveal

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/residual-gate/RESIDUAL_FIRST_REVEAL_PLAN.md'
      - 'experiments/predictive-information/residual-gate/residual_first_reveal.py'
      - '.github/workflows/issue118-residual-first-reveal.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt

jobs:
  residual-first-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen source and merged Gate
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(sha256sum "$ZL3B" | awk '{print $1}')" = "bf5b6d4ac1e3a51b1847a9c388318d609020441ccd56984c901c32b09beccafc"
          test -f experiments/predictive-information/residual-gate/CORE_GATE0_PLAN.md
          test -f experiments/predictive-information/residual-gate/CORE_GATE0_AMENDMENT_A.md
          test -f experiments/predictive-information/residual-gate/RESIDUAL_FIRST_REVEAL_PLAN.md

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Enforce prediction-only residual boundary
        shell: bash
        run: |
          if grep -E 'output_metrics|score_r1\(|metric_gates\(|H62P1|target_exposed' experiments/predictive-information/residual-gate/residual_first_reveal.py; then
            echo 'Forbidden surface-target scorer reference found in residual executable' >&2
            exit 1
          fi

      - name: Compile and self-test before target reveal
        shell: bash
        run: |
          python -m py_compile experiments/predictive-information/residual-gate/residual_first_reveal.py
          python experiments/predictive-information/residual-gate/residual_first_reveal.py --self-test

      - name: Run frozen residual first reveal
        shell: bash
        run: |
          python experiments/predictive-information/residual-gate/residual_first_reveal.py --run "$ZL3B" issue118_residual_first_reveal.json
          python -m json.tool issue118_residual_first_reveal.json > /dev/null
          sha256sum issue118_residual_first_reveal.json | tee issue118_residual_first_reveal.sha256

      - name: Assert authority and frozen classification logic
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open('issue118_residual_first_reveal.json'))
          assert x['residual_scored'] is True, x
          assert x['core_authority']['valid'] is True
          assert x['core_authority']['normalized_sha256']=='0d7f311dac17f5736f8191b8ea38cf5f2eac9b7391150a986204772da181ae27'
          assert len(x['outer'])==5
          exp_n=[4430,4810,5516,5447,4868]
          g=[]
          for f,r in enumerate(x['outer']):
              assert r['fold']==f and r['n_scored']==exp_n[f]
              assert math.isfinite(r['bits_B3']) and math.isfinite(r['G_any']) and math.isfinite(r['G_context'])
              g.append(r['G_context'])
              for fam in ('RESET','CONTINUOUS'):
                  q=r[fam]
                  assert q['n_accepted']==r['n_scored'] and q['n_visible']==r['n_visible']
                  assert q['selected']['k'] in range(7)
                  assert q['selected']['alpha'] in (0.01,0.10,1.0)
                  assert 0.0 <= q['selected']['w'] <= 1.0
                  assert q['selected']['matches_phase1_byte_selection'] is True
                  assert math.isfinite(q['byte_bits_per_token']) and math.isfinite(q['mix_bits_per_token'])
          mean=sum(g)/5
          pos=sum(v>0 for v in g)
          passed=(mean>0 and pos>=4)
          expected=('ROBUST FLEXIBLE SEQUENCE RESIDUAL EXISTS — LOCALIZATION REQUIRED' if passed else 'NO ROBUST FLEXIBLE SEQUENCE RESIDUAL BEYOND CORRECTED CORE')
          assert x['classification']==expected,(x['classification'],expected,g)
          assert abs(x['summaries']['G_context']['mean']-mean)<1e-12
          assert x['summaries']['G_context']['positive_folds']==pos
          assert x['summaries']['G_context']['pass'] is passed
          assert all(v is False for v in x['firewall'].values())
          print(json.dumps({'classification':x['classification'],'G_context':x['summaries']['G_context'],'G_any':x['summaries']['G_any'],'mean_bits':x['summaries']['mean_bits_per_token'],'selected':{str(r['fold']):{'RESET':r['RESET']['selected'],'CONTINUOUS':r['CONTINUOUS']['selected']} for r in x['outer']}},indent=2,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload first-reveal authority
        uses: actions/upload-artifact@v4
        with:
          name: issue118-residual-first-reveal
          path: |
            issue118_residual_first_reveal.json
            issue118_residual_first_reveal.sha256
