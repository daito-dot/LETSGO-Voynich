name: Phase62 control recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/phase62/phase62a_recover_controls.py'
      - '.github/workflows/phase62-control-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LETSGO-Voynich
        uses: actions/checkout@v4

      - name: Checkout frozen CREMMA control corpus
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Verify external commit
        shell: bash
        run: |
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"

      - name: Recover historical and objective control candidates
        run: |
          python experiments/phase62/phase62a_recover_controls.py external/cremma > phase62a_control_recovery.json
          python - <<'PY'
          import json
          x=json.load(open('phase62a_control_recovery.json'))
          print('PHASE52_PANEL_SUMMARY')
          for k,v in x['phase52_panel'].items():
              print(f"{k}\tfiles={v['scanned_file_count']}\tpilcrows={v['pilcrow_markers']}\teligible={v['eligible_entries']}")
          print(f"TOTAL\tmanuscripts={x['phase52_panel_totals']['manuscripts']}\teligible={x['phase52_panel_totals']['eligible_entries']}")
          print('CORPUS_WIDE_STRUCTURED_CANDIDATES')
          cw=x['corpus_wide_structured_candidates']
          for k in cw['selected_names']:
              v=cw['selected_manuscripts'][k]
              print(f"{k}\tfiles={v['scanned_file_count']}\tpilcrows={v['pilcrow_markers']}\teligible={v['eligible_entries']}")
          print(f"CORPUS_TOTAL\tselected_manuscripts={cw['n_selected']}\teligible={cw['selected_total_eligible_entries']}")
          print('HISTORICAL_RECOVERY_SUMMARY')
          for k,v in x['historical_phase59_recovery'].items():
              print(f"{k}\texpected={v['expected_phase59_n']}\teligible_scanned={v['eligible_total_across_scanned_files']}")
          PY

      - name: Upload recovery audit
        uses: actions/upload-artifact@v4
        with:
          name: phase62-control-recovery
          path: phase62a_control_recovery.json
