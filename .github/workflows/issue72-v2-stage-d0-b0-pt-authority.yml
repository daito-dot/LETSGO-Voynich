name: Issue72 V2 Stage D0 freeze PT baseline authority

on:
  push:
    branches: [issue72-r1-causal-decomposition-v2]
    paths:
      - '.github/workflows/issue72-v2-stage-d0-b0-pt-authority.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  derive-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact target-blind authority head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Stage D chronology and target-blind derivation ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c45c67a665a7e4ad24c1d2706f83c65931d950a9 HEAD
          git merge-base --is-ancestor e6ccd4eb728e85d9e48548e2431abf0ebce1d87a HEAD
          DERIVE=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/derive_b0_pt_authority72_v2.py | tail -1)
          test "$DERIVE" = '12773e08fa6855f5f2a51a6b8b7cb5699a2063cc'
          test "$(git hash-object experiments/naibbe-r1-decomposition-v2/b0_support72_v2.py)" = 'ef3144591839395c18e1bdf308311bf99562bf9a'
          test ! -e experiments/naibbe-r1-decomposition-v2/STAGE_D1_PT_REPORT.md
          test ! -e experiments/naibbe-r1-decomposition-v2/stage-d1-pt

      - name: Download exact original B0 artifact
        uses: actions/download-artifact@v4
        with:
          name: issue72-v2-stageB0-support-135e8ac956541e2c2259431efee0fdb064b9c03e
          path: /tmp/b0-source
          github-token: ${{ github.token }}
          repository: daito-dot/LETSGO-Voynich
          run-id: 33462658689

      - name: Verify original B0 artifact authority and derive PT authority
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/b0-source/stage_b0_support.json
          test "$(sha256sum /tmp/b0-source/stage_b0_support.json | cut -d' ' -f1)" = '96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58'
          python -m json.tool /tmp/b0-source/stage_b0_support.json >/dev/null
          python experiments/naibbe-r1-decomposition-v2/derive_b0_pt_authority72_v2.py \
            /tmp/b0-source/stage_b0_support.json \
            /tmp/stage_b0_pt_authority.from_artifact.json \
            > /tmp/derive_artifact_stdout.txt

      - name: Checkout frozen CREMMA authority
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout pinned Naibbe authority
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: external/naibbe

      - name: Install frozen preexisting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pandas

      - name: Regenerate complete B0 from frozen generator
        shell: bash
        run: |
          set -euo pipefail
          python experiments/naibbe-r1-decomposition-v2/b0_support72_v2.py \
            external/cremma external/naibbe /tmp/stage_b0_support.regenerated.json \
            > /tmp/b0_regenerated_stdout.txt
          python -m json.tool /tmp/stage_b0_support.regenerated.json >/dev/null
          test "$(sha256sum /tmp/stage_b0_support.regenerated.json | cut -d' ' -f1)" = '96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58'
          cmp -s /tmp/b0-source/stage_b0_support.json /tmp/stage_b0_support.regenerated.json

      - name: Independently derive PT authority from regenerated B0
        shell: bash
        run: |
          set -euo pipefail
          python experiments/naibbe-r1-decomposition-v2/derive_b0_pt_authority72_v2.py \
            /tmp/stage_b0_support.regenerated.json \
            /tmp/stage_b0_pt_authority.from_regeneration.json \
            > /tmp/derive_regenerated_stdout.txt
          cmp -s /tmp/stage_b0_pt_authority.from_artifact.json /tmp/stage_b0_pt_authority.from_regeneration.json
          python -m json.tool /tmp/stage_b0_pt_authority.from_artifact.json >/dev/null
          python - <<'PY'
          import json
          r=json.load(open('/tmp/stage_b0_pt_authority.from_artifact.json',encoding='utf-8'))
          assert r['schema']=='issue72-v2-stage-d0-pt-baseline-authority-v1'
          assert r['scientific_role']=='TARGET_BLIND_BASELINE_REPLAY_AUTHORITY_FOR_STAGE_D_PT'
          assert r['source_artifact']['workflow_run']==33462658689
          assert r['source_artifact']['artifact_id']==9783720673
          assert r['source_artifact']['full_stage_b0_json_sha256']=='96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58'
          assert all(v is False for v in r['target_access'].values())
          assert set(r['reps'])=={f'rep{i}' for i in range(5)}
          for rep in range(5):
              row=r['reps'][f'rep{rep}']
              for mi,ms in enumerate(['BIS193','CLM13027','Mazarine915','UBL758']):
                  assert row['per_manuscript'][ms]['seed']==6480000+100*mi+rep
          print('PT_BASELINE_AUTHORITY_VALID')
          PY

      - name: Freeze exact PT baseline authority and provenance
        shell: bash
        run: |
          set -euo pipefail
          DEST=experiments/naibbe-r1-decomposition-v2
          cp /tmp/stage_b0_pt_authority.from_artifact.json "$DEST/stage_b0_pt_authority.json"
          AUTH_SHA=$(sha256sum "$DEST/stage_b0_pt_authority.json" | cut -d' ' -f1)
          cat > "$DEST/STAGE_B0_PT_AUTHORITY_PROVENANCE_20260901.txt" <<EOF
          authority_workflow_run=${GITHUB_RUN_ID}
          authority_workflow_attempt=${GITHUB_RUN_ATTEMPT}
          authority_head=${GITHUB_SHA}
          stage_d_plan_commit=c45c67a665a7e4ad24c1d2706f83c65931d950a9
          derivation_script_commit=12773e08fa6855f5f2a51a6b8b7cb5699a2063cc
          source_b0_workflow_run=33462658689
          source_b0_job=99715920669
          source_b0_artifact_id=9783720673
          source_b0_artifact_zip_sha256=0bdb5022c5c348b0898a8de253c2b644576c2654c19710059edabc79bb3b03b5
          source_full_b0_sha256=96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58
          derived_pt_authority_sha256=${AUTH_SHA}
          frozen_generator_blob=ef3144591839395c18e1bdf308311bf99562bf9a
          full_regeneration_byte_identical_to_source_artifact=true
          derived_authority_byte_identical_from_source_and_regeneration=true
          target_loaded=false
          R1_computed=false
          PT_surface_generated=false
          EOF
          sha256sum "$DEST/stage_b0_pt_authority.json" > "$DEST/STAGE_B0_PT_AUTHORITY_SHA256.txt"
          cat "$DEST/STAGE_B0_PT_AUTHORITY_PROVENANCE_20260901.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST/stage_b0_pt_authority.json" "$DEST/STAGE_B0_PT_AUTHORITY_PROVENANCE_20260901.txt" "$DEST/STAGE_B0_PT_AUTHORITY_SHA256.txt"
          git diff --cached --quiet && exit 1
          git commit -m 'Issue72 V2 Stage D0: freeze exact PT baseline authority'
          git push origin HEAD:issue72-r1-causal-decomposition-v2
