name: audit-phase61c-eta2

on:
  push:
    branches:
      - audit/phase61c-eta2-decomposition-20260830
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Run eta2 decomposition
        run: python audits/phase61c_eta2_decomposition.py
      - name: Summary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('phase61c_eta2_decomposition_results.json'))
          print('GROUPS')
          for k,v in d['group_summary'].items(): print(k,v)
          print('\nFEATURES')
          for k,v in d['feature_summary'].items(): print(k,v)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase61c-eta2-decomposition
          path: phase61c_eta2_decomposition_results.json
