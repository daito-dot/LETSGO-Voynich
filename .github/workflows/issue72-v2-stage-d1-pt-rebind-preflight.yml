name: Issue72 V2 Stage D1 PT rebind target-blind preflight

on:
  push:
    branches: [issue72-r1-causal-decomposition-v2]
    paths:
      - '.github/workflows/issue72-v2-stage-d1-pt-rebind-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - j: 0
            rep: 0
          - j: 30
            rep: 4
    steps:
      - name: Checkout exact preflight head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify pretarget chronology and authority-rebind path
        shell: bash
        run: |
          set -euo pipefail
          SCORER=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/d1_pt_r1_score72_v2.py | tail -1)
          ADAPTER_DOC=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/STAGE_D1_AUTHORITY_REBIND_ADAPTER_20260901.md | tail -1)
          ADAPTER_CODE=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/d1_pt_aggregate72_v2_rebind.py | tail -1)
          PREFLIGHT=$(git log --diff-filter=A --format=%H -- .github/workflows/issue72-v2-stage-d1-pt-rebind-preflight.yml | tail -1)
          test "$SCORER" = '127c86f253a5cc12e3802d0976c96649a2c91524'
          test "$ADAPTER_DOC" = '6b26c9cd4c14340f718005695221f199743e70d7'
          test "$ADAPTER_CODE" = '7dba278b3408cfdd175739c168b712e31ee7c310'
          test "$PREFLIGHT" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SCORER" "$ADAPTER_DOC"
          git merge-base --is-ancestor "$ADAPTER_DOC" "$ADAPTER_CODE"
          git merge-base --is-ancestor "$ADAPTER_CODE" "$PREFLIGHT"
          test ! -e experiments/naibbe-r1-decomposition-v2/stage-d1-pt
          test ! -e experiments/naibbe-r1-decomposition-v2/STAGE_D1_PT_REPORT.md

      - name: Verify frozen repository authorities
        shell: bash
        run: |
          set -euo pipefail
          echo 'e3039ed40f72e44cc4964efab50d70bc1b113859c77e23ccc97934bb29edb9b8  experiments/naibbe-r1-decomposition-v2/stage-d0-pt/stage_d0_pt_support_aggregate.json' | sha256sum -c -
          echo 'cb80833b426d6d9b4d1f307961d862fe02140fcf8f593f870fb3080a39bfc2a0  experiments/naibbe-r1-decomposition-v2/STAGE_D0_PT_AUTHORITY_REBIND_VALIDATION.json' | sha256sum -c -
          echo '703991a4b176e78ea18c30210ec730187b446c0c8b14052fc2d25e4a8d8f86e4  experiments/naibbe-r1-decomposition-v2/stage_b0_pt_authority.json' | sha256sum -c -
          echo '96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58  experiments/naibbe-r1-decomposition-v2/stage_b0_support.json' | sha256sum -c -
          echo '2da5f0a4f8191820875ed264284f2d3b651489a7e8aeed3805cc2ed4d08c5147  experiments/naibbe-r1-decomposition-v2/archive/stage_b2_calibration.json' | sha256sum -c -

      - name: Checkout frozen CREMMA authority
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout pinned Naibbe authority
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: external/naibbe

      - name: Install frozen preexisting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pandas

      - name: Compile rebind-aware scorer and aggregation adapter
        run: |
          python -m py_compile experiments/naibbe-r1-decomposition-v2/d1_pt_r1_score72_v2.py
          python -m py_compile experiments/naibbe-r1-decomposition-v2/d1_pt_aggregate72_v2_rebind.py

      - name: Verify exact PT replay without target access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d1-preflight
          python experiments/naibbe-r1-decomposition-v2/d1_pt_r1_score72_v2.py \
            external/cremma external/naibbe '${{ matrix.j }}' '${{ matrix.rep }}' \
            '/tmp/d1-preflight/PT_j${{ matrix.j }}_rep${{ matrix.rep }}.json' --verify-only \
            > '/tmp/d1-preflight/PT_j${{ matrix.j }}_rep${{ matrix.rep }}.stdout.txt'

      - name: Enforce target firewall and exact rebind authorities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='/tmp/d1-preflight/PT_j${{ matrix.j }}_rep${{ matrix.rep }}.json'
          r=json.load(open(p, encoding='utf-8'))
          assert r['schema']=='issue72-v2-stage-d1-pt-surface-preflight-v1'
          assert r['status']=='STAGE_D1_PT_SURFACE_REPLAY_VERIFIED_TARGET_BLIND'
          assert r['assignment']=={'j':${{ matrix.j }},'rep':${{ matrix.rep }}}
          assert all(v is False for v in r['target_access'].values())
          a=r['surface_audit']
          assert a['d0_aggregate_sha256']=='e3039ed40f72e44cc4964efab50d70bc1b113859c77e23ccc97934bb29edb9b8'
          assert a['d0_authority_rebind_validation_sha256']=='cb80833b426d6d9b4d1f307961d862fe02140fcf8f593f870fb3080a39bfc2a0'
          assert a['compact_pt_authority_sha256']=='703991a4b176e78ea18c30210ec730187b446c0c8b14052fc2d25e4a8d8f86e4'
          assert a['source_full_b0_sha256']=='96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58'
          assert a['paired_baseline_exact_replay'] is True
          assert a['pt_primary_exact_d0_replay'] is True
          assert a['pt_raw_exact_d0_replay'] is True
          assert a['pt_support_exact_d0_replay'] is True
          assert a['pt_line_invariant_digests_exact_d0_replay'] is True
          assert 0 < a['coverage'] <= 1
          print({'assignment':r['assignment'],'coverage':a['coverage'],'surface':a['primary_pooled_surface_sha256'],'target_access':r['target_access']})
          PY

      - name: Verify frozen B2 baseline adapter without scoring target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('experiments/naibbe-r1-decomposition-v2/d1_pt_aggregate72_v2_rebind.py')
          spec=importlib.util.spec_from_file_location('d1agg', p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          b=m.load_b2_baselines(Path('experiments/naibbe-r1-decomposition-v2/archive/stage_b2_calibration.json'))
          assert set(b)==set(range(5))
          assert b[0]['R_ZL3b']==0.8830282501011794
          assert b[0]['R_IT2a']==0.9000974100381157
          print({'rep0':b[0], 'baseline_rescored':False})
          PY

      - name: Freeze target-blind preflight provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > '/tmp/d1-preflight/PROVENANCE_j${{ matrix.j }}_rep${{ matrix.rep }}.txt' <<EOF2
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          preflight_head=${GITHUB_SHA}
          scorer_freeze_commit=127c86f253a5cc12e3802d0976c96649a2c91524
          compact_pt_authority_sha256=703991a4b176e78ea18c30210ec730187b446c0c8b14052fc2d25e4a8d8f86e4
          source_full_b0_sha256=96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58
          target_loaded=false
          slot_pair_Q_computed=false
          residual_Z_computed=false
          target_topology_computed=false
          R1_target_rank_or_pvalue_computed=false
          baseline_rescored=false
          EOF2
          sha256sum /tmp/d1-preflight/* | sort > /tmp/d1-preflight/SHA256SUMS.txt

      - name: Upload target-blind preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue72-v2-stageD1-rebind-preflight-j${{ matrix.j }}-rep${{ matrix.rep }}-${{ github.sha }}
          path: /tmp/d1-preflight
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
