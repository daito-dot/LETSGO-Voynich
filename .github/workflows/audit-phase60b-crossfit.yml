name: audit-phase60b-crossfit

on:
  push:
    branches:
      - audit/phase60b-crossfit-20260830
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Run read-only audit
        run: python audits/phase60b_crossfit_audit.py --out phase60b_crossfit_audit_results.json
      - name: Show compact summary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('phase60b_crossfit_audit_results.json'))
          print('eligible paragraphs:',d['n_eligible_paragraphs'])
          for mode,r in d['results'].items():
              print('\n',mode)
              print('accepted',r['accepted_reference']['crossfit_mean'])
              print('legacy_public',r['legacy_public_reimplementation']['mean_projection'])
              print('corrected_global',r['corrected_crossfit_global_scaling']['mean_projection'])
              print('corrected_train_only',r['corrected_crossfit_train_only_scaling']['mean_projection'])
              print('stable_train_only',r['corrected_crossfit_train_only_scaling']['stable_coordinate_effects'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase60b-crossfit-audit
          path: phase60b_crossfit_audit_results.json
