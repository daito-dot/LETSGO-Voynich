name: Issue134 augmented observable core Gate0

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/residual-gate/ISSUE134_AUGMENTED_CORE_PLAN.md'
      - 'experiments/predictive-information/residual-gate/issue134_augmented_core_gate0.py'
      - '.github/workflows/issue134-augmented-core-gate0.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt

jobs:
  augmented-core-gate0:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen source and preregistration
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(sha256sum "$ZL3B" | awk '{print $1}')" = "bf5b6d4ac1e3a51b1847a9c388318d609020441ccd56984c901c32b09beccafc"
          test -f experiments/predictive-information/residual-gate/ISSUE134_AUGMENTED_CORE_PLAN.md
          test -f experiments/predictive-information/residual-gate/issue134_augmented_core_gate0.py

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Enforce score-free Issue134 boundary
        shell: bash
        run: |
          TARGET=experiments/predictive-information/residual-gate/issue134_augmented_core_gate0.py
          if grep -E 'mixed_logps\(|bits_from_logs\(|select_weight\(|token_logp\(|G_residual[[:space:]]*=' "$TARGET"; then
            echo 'Predictive scoring code found in score-free Issue134 Gate0' >&2
            exit 1
          fi

      - name: Compile and self-test
        shell: bash
        run: |
          python -m py_compile experiments/predictive-information/residual-gate/issue134_augmented_core_gate0.py
          python experiments/predictive-information/residual-gate/issue134_augmented_core_gate0.py --self-test

      - name: Run score-free augmented-core Gate0
        shell: bash
        run: |
          python experiments/predictive-information/residual-gate/issue134_augmented_core_gate0.py --audit "$ZL3B" issue134_augmented_core_gate0.json
          python -m json.tool issue134_augmented_core_gate0.json > /dev/null
          sha256sum issue134_augmented_core_gate0.json | tee issue134_augmented_core_gate0.sha256

      - name: Assert frozen authority, support and firewall
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('issue134_augmented_core_gate0.json'))
          assert x['gate_pass'] is True, x
          assert x['gate_rule']=='PROCEED_TO_COMMITTED_PREDICTIVE_SCORER'
          assert x['core_authority']['valid'] is True
          assert x['core_authority']['normalized_sha256']=='0d7f311dac17f5736f8191b8ea38cf5f2eac9b7391150a986204772da181ae27'
          assert x['currier_authority']['issue127_gate0_json_sha256']=='31c96135ec8e265781fe295888e52d896d47122bfa9d2bbf6f7e36c001827bdb'
          assert x['source']['git_blob_sha1']=='2a4533ab9bdfa85db9bad602d590978953055df1'
          assert x['split_counts']=={'outer':5,'inner':20}
          assert x['outer_expected_target_counts']==[4430,4810,5516,5447,4868]
          assert [r['eval_parser_accepted_targets'] for r in x['outer_splits']]==[4430,4810,5516,5447,4868]
          assert all(r['gate_pass'] for r in x['outer_splits'])
          assert all(r['gate_pass'] for r in x['inner_splits'])
          for r in x['outer_splits']+x['inner_splits']:
              c=r['support']['previous_terminal_context_counts']
              assert c['A']>=2 and c['B']>=2 and c['POOLED']>=2
              e=r['support']['line_body_edge_events_by_currier']
              assert e['A']>0 and e['B']>0
              assert r['leaf_overlap_count']==0
          assert all(v is False for v in x['firewall'].values())
          print(json.dumps({
              'gate_pass':x['gate_pass'],
              'split_counts':x['split_counts'],
              'outer_target_counts':[r['eval_parser_accepted_targets'] for r in x['outer_splits']],
              'outer_support':[{
                  'name':r['name'],
                  'contexts':r['support']['previous_terminal_context_counts'],
                  'events':r['support']['line_body_edge_events_by_currier']
              } for r in x['outer_splits']],
              'core_sha':x['core_authority']['normalized_sha256'],
              'currier_gate_sha':x['currier_authority']['issue127_gate0_json_sha256'],
              'firewall':x['firewall'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload Gate0 authority
        uses: actions/upload-artifact@v4
        with:
          name: issue134-augmented-core-gate0
          path: |
            issue134_augmented_core_gate0.json
            issue134_augmented_core_gate0.sha256
