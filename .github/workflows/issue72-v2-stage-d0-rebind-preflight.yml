name: Issue72 V2 Stage D0 rebind recovered B0 and preflight PT

on:
  push:
    branches: [issue72-r1-causal-decomposition-v2]
    paths:
      - '.github/workflows/issue72-v2-stage-d0-rebind-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebind-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify recovered Stage B0 authority and frozen PT design
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5fe90e4639dc4d69f414b0ab800f886b9a7f1573 HEAD
          git merge-base --is-ancestor c45c67a665a7e4ad24c1d2706f83c65931d950a9 HEAD
          test "$(sha256sum experiments/naibbe-r1-decomposition-v2/stage_b0_support.json | cut -d' ' -f1)" = '96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58'
          python -m json.tool experiments/naibbe-r1-decomposition-v2/stage_b0_support.json >/dev/null
          grep -q 'EXPECTED_B0_RAW_SHA256 = "99dbf2143b2ad276e054b794980014d89ec79c83041d61d011319b1e87f0225d"' experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py
          test "$(git hash-object experiments/naibbe-r1-decomposition-v2/b0_support72_v2.py)" = 'ef3144591839395c18e1bdf308311bf99562bf9a'

      - name: Rebind PT implementation to recovered original B0 SHA in working tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py')
          s=p.read_text()
          old='EXPECTED_B0_RAW_SHA256 = "99dbf2143b2ad276e054b794980014d89ec79c83041d61d011319b1e87f0225d"'
          new='EXPECTED_B0_RAW_SHA256 = "96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58"'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py

      - name: Checkout frozen CREMMA authority
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout pinned Naibbe authority
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: external/naibbe

      - name: Install frozen preexisting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pandas

      - name: Compile rebound target-blind PT support implementation
        run: python -m py_compile experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py

      - name: Execute both prospective edge preflight cases target blind
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d0-preflight
          python experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py external/cremma external/naibbe 0 0 /tmp/d0-preflight/PT_j0_rep0.json > /tmp/d0-preflight/j0r0.stdout.txt
          python experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py external/cremma external/naibbe 30 4 /tmp/d0-preflight/PT_j30_rep4.json > /tmp/d0-preflight/j30r4.stdout.txt

      - name: Enforce baseline replay, PT invariants, real intervention, and target firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          expected={(0,0),(30,4)}
          seen=set()
          for p in ['/tmp/d0-preflight/PT_j0_rep0.json','/tmp/d0-preflight/PT_j30_rep4.json']:
              r=json.load(open(p))
              key=(r['assignment']['j'],r['assignment']['rep'])
              seen.add(key)
              assert r['status']=='STAGE_D0_PT_ASSIGNMENT_SUPPORT_FROZEN_TARGET_BLIND'
              assert r['paired_baseline']['exact_stage_b0_replay'] is True
              assert r['pt_surface']['line_invariants_all_true'] is True
              assert r['pt_surface']['changed_from_paired_baseline_primary'] is True
              assert r['pt_surface']['changed_nonempty_lines'] > 0
              assert r['pt_surface']['changed_nonempty_line_fraction'] > 0
              assert all(v is False for v in r['target_access'].values())
              assert r['intervention_generation']['PT_surface_generated'] is True
              assert r['intervention_generation']['full_published_pipeline_rerun'] is True
              assert r['intervention_generation']['published_codebook_unchanged'] is True
              assert r['intervention_generation']['downstream_path_allowed_to_diverge'] is True
              print(key,{
                  'coverage':r['pt_surface']['support']['coverage'],
                  'changed_line_fraction':r['pt_surface']['changed_nonempty_line_fraction'],
                  'surface_sha':r['pt_surface']['primary_pooled_surface_sha256'],
              })
          assert seen==expected
          PY

      - name: Freeze target-blind preflight evidence and commit rebind only after success
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/naibbe-r1-decomposition-v2/stage-d0-pt-preflight
          cp /tmp/d0-preflight/PT_j0_rep0.json experiments/naibbe-r1-decomposition-v2/stage-d0-pt-preflight/
          cp /tmp/d0-preflight/PT_j30_rep4.json experiments/naibbe-r1-decomposition-v2/stage-d0-pt-preflight/
          (cd experiments/naibbe-r1-decomposition-v2/stage-d0-pt-preflight && sha256sum PT_*.json | sort > SHA256SUMS.txt)
          cat > experiments/naibbe-r1-decomposition-v2/stage-d0-pt-preflight/PROVENANCE.txt <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          recovery_head=${GITHUB_SHA}
          recovered_b0_sha256=96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58
          original_b0_run=33462658689
          original_b0_artifact_id=9783720673
          cases=j0_rep0,j30_rep4
          baseline_exact_replay=true
          line_inventory_invariants=true
          target_loaded=false
          R1_computed=false
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py experiments/naibbe-r1-decomposition-v2/stage-d0-pt-preflight
          git commit -m 'Issue72 V2 Stage D0: bind recovered B0 and freeze successful PT preflight'
          git push origin HEAD:issue72-r1-causal-decomposition-v2
