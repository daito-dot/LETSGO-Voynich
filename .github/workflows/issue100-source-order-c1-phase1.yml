name: Issue100 source-order C1 Phase1 rerun

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/source_order_authority.py'
      - 'experiments/predictive-information/order-correction/**'
      - '.github/workflows/issue100-source-order-c1-phase1.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt

jobs:
  c1-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen source
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Enforce prediction-only correction boundary
        shell: bash
        run: |
          test -f experiments/predictive-information/order-correction/CORRECTION_PLAN.md
          test -f experiments/predictive-information/source_order_authority.py
          test -f experiments/predictive-information/order-correction/rerun_phase1_source_order.py
          if grep -E 'output_metrics|score_r1\(|metric_gates\(|H62P1|target_exposed' experiments/predictive-information/order-correction/rerun_phase1_source_order.py; then
            echo 'Surface-target scorer found in corrected Phase-1 executable' >&2
            exit 1
          fi

      - name: Compile and self-test
        shell: bash
        run: |
          python -m py_compile experiments/predictive-information/source_order_authority.py
          python -m py_compile experiments/predictive-information/order-correction/rerun_phase1_source_order.py
          python experiments/predictive-information/order-correction/rerun_phase1_source_order.py --self-test

      - name: Authoritative corrected Phase-1 rerun
        shell: bash
        run: |
          python experiments/predictive-information/order-correction/rerun_phase1_source_order.py --run "$ZL3B" issue100_c1_phase1.json
          python -m json.tool issue100_c1_phase1.json > /dev/null
          sha256sum issue100_c1_phase1.json

      - name: Assert source-order authority and firewall
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('issue100_c1_phase1.json'))
          assert x['order_authority']['numeric_paragraph_order_valid'] is True
          assert x['order_authority']['source_document_order_valid'] is True
          assert x['regression']['B0_order_invariant_all_folds'] is True
          assert x['regression']['old_B1_forced'] is False
          assert x['regression']['fold_membership_changed'] is False
          assert x['firewall'] == {
              'H62_scored': False,
              'R1_scored': False,
              'S1_scored': False,
              'S2_scored': False,
              'candidate_grid_extended': False,
              'future_test_tokens_used': False,
              'issue84_target_used': False,
              'semantic_or_image_context_used': False,
          }
          print(json.dumps({
              'classification': x['classification'],
              'mean_bits_per_token': x['summaries']['mean_bits_per_token'],
              'G_local': x['summaries']['G_local'],
              'Delta_long': x['summaries']['Delta_long'],
              'Delta_state': x['summaries']['Delta_state'],
              'Delta_flex_over_local': x['summaries']['Delta_flex_over_local'],
              'B1_selected': {str(r['fold']):r['B1']['selected'] for r in x['outer']},
              'B2_selected': {str(r['fold']):r['B2']['selected'] for r in x['outer']},
              'B3_selected': {str(r['fold']):r['B3']['selected'] for r in x['outer']},
              'legacy_comparison': x['legacy_comparison'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload corrected Phase-1 authority
        uses: actions/upload-artifact@v4
        with:
          name: issue100-c1-phase1-source-order
          path: issue100_c1_phase1.json
