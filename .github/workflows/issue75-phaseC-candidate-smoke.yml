name: Issue75 Phase C target-blind M3 candidate-null smoke

on:
  push:
    branches: [issue75-minimal-occupancy-generator]
    paths:
      - '.github/workflows/issue75-phaseC-candidate-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact smoke head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require successful target-blind boundary preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PREFLIGHT_HEAD=$(git log --diff-filter=A --format=%H -- .github/workflows/issue75-phaseC-preflight.yml | tail -1)
          test -n "$PREFLIGHT_HEAD"
          OK=$(gh api --method GET "repos/daito-dot/LETSGO-Voynich/actions/runs?head_sha=${PREFLIGHT_HEAD}&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.path==".github/workflows/issue75-phaseC-preflight.yml" and .conclusion=="success")] | length')
          test "$OK" -ge 1
          echo "successful target-blind preflight exists at ${PREFLIGHT_HEAD}"

      - name: Verify frozen C0 authority and no prior Phase-C reveal
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/minimal-occupancy-generator/DECISION_B_M3_LICENSED.md
          test -f experiments/minimal-occupancy-generator/PLAN_C.md
          test -f experiments/minimal-occupancy-generator/C0_FREEZE_C.md
          test ! -e experiments/minimal-occupancy-generator/stage-c-first-reveal
          test ! -e experiments/minimal-occupancy-generator/REPORT_C.md
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          t=Path('experiments/minimal-occupancy-generator/C0_FREEZE_C.md').read_text(encoding='utf-8')
          m=re.search(r'C0 authority SHA-256: `([0-9a-f]{64})`',t)
          assert m
          p=Path('experiments/minimal-occupancy-generator/stage-c0/generator_authority.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m.group(1)
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['status']=='M3_KRS_CHAIN_31_CORPORA_FROZEN_TARGET_BLIND'
          assert all(v is False for v in r['target_access'].values())
          print({'c0_sha':m.group(1),'target_blind':True})
          PY

      - name: Checkout frozen ZL3b source
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: _cipher_benchmark
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Verify exact source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _cipher_benchmark rev-parse HEAD)" = '315f0cad4de3d021bd4185765c037cf2a28d341c'
          test "$(git -C _cipher_benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = '2a4533ab9bdfa85db9bad602d590978953055df1'

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1

      - name: Compile frozen M3 scorer and smoke wrapper
        run: |
          python -m py_compile experiments/minimal-occupancy-generator/phase75c_score.py
          python -m py_compile experiments/minimal-occupancy-generator/phase75c_candidate_smoke.py

      - name: Execute full candidate-owned null machinery without target access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke
          python experiments/minimal-occupancy-generator/phase75c_candidate_smoke.py \
            _cipher_benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            0 /tmp/smoke/M3-KRS-CHAIN_0.json \
            > /tmp/smoke/M3-KRS-CHAIN_0.stdout.txt

      - name: Enforce candidate-null result and target firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math
          r=json.load(open('/tmp/smoke/M3-KRS-CHAIN_0.json', encoding='utf-8'))
          assert r['schema']=='issue75-phaseC-m3-candidate-null-smoke-v1'
          assert r['status']=='M3_CANDIDATE_OWNED_NULL_EXECUTION_VERIFIED_TARGET_BLIND'
          assert r['family']=='M3-KRS-CHAIN' and r['rep']==0
          a=r['candidate_audit']
          assert a['exact_phase_c0_replay'] is True
          assert a['training_unary_moments_exact_c0'] is True
          assert a['training_adjacent_moments_exact_c0'] is True
          assert a['descriptor_distribution_exact_c0'] is True
          assert a['fit_tolerance_revalidated'] is True
          assert a['regenerated_fit_max_abs_reported_moment_error'] <= 1e-10
          m=r['measurement']
          assert m['reference_namespace']=='issue75:phaseC:M3-KRS-CHAIN:rep0:reference'
          assert m['test_namespace']=='issue75:phaseC:M3-KRS-CHAIN:rep0:test'
          assert m['n_reference']==1000 and m['n_test']==1000 and len(m['z_full'])==66
          assert math.isfinite(float(m['residual_energy'])) and 0 < float(m['p_exist']) <= 1
          t=r['target_access']
          assert t['pair_Q_computed'] is True and t['residual_Z_computed'] is True
          assert t['candidate_reference_null_computed'] is True and t['candidate_test_null_computed'] is True
          assert t['Issue58C_target_vector_loaded'] is False and t['Issue58D_target_vector_loaded'] is False
          assert t['target_correlation_computed'] is False and t['target_sign_agreement_computed'] is False and t['T_computed'] is False
          print({'E':m['residual_energy'],'p_exist':m['p_exist'],'W':m['reliability']['median'],'target_loaded':False})
          PY

      - name: Freeze smoke provenance
        shell: bash
        run: |
          set -euo pipefail
          C0SHA=$(python - <<'PY'
          import re
          t=open('experiments/minimal-occupancy-generator/C0_FREEZE_C.md',encoding='utf-8').read()
          print(re.search(r'C0 authority SHA-256: `([0-9a-f]{64})`',t).group(1))
          PY
          )
          cat > /tmp/smoke/PROVENANCE.txt <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          smoke_head=${GITHUB_SHA}
          phase_c0_sha256=${C0SHA}
          target_loaded=false
          pair_Q_computed=true
          residual_Z_computed=true
          target_correlation_computed=false
          EOF

      - name: Upload target-blind M3 candidate-null smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue75-phaseC-candidate-smoke-${{ github.sha }}
          path: /tmp/smoke
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
