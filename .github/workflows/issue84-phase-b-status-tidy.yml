name: Tidy research status after Issue84 Phase B

on:
  push:
    branches: [research/issue84-phase-b-cipher-map]
    paths:
      - '.github/workflows/issue84-phase-b-status-tidy.yml'

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/issue84-phase-b-cipher-map
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/STATUS.md')
          s=p.read_text()
          s=s.replace('Last consolidated: 2026-09-02', 'Last consolidated: 2026-09-06', 1)
          s=s.replace('- Issue #75 Phases A–F0 (branch `issue75-minimal-occupancy-generator`, not yet on `main`):', '- Issue #75 Phases A–F0 (merged to `main`):', 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/issue84-phase-b-status-tidy.yml
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/STATUS.md .github/workflows
          git commit -m 'Tidy current research status metadata'
          git push origin HEAD:research/issue84-phase-b-cipher-map
