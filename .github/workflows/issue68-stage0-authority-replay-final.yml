name: Issue68 Stage0 final authority replay

on:
  push:
    branches: [issue68-joint-constraint-tournament]
    paths:
      - '.github/workflows/issue68-stage0-authority-replay-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Issue68 design branch
        uses: actions/checkout@v4
        with:
          ref: issue68-joint-constraint-tournament
          fetch-depth: 0

      - name: Verify pre-target chronology and firewall
        shell: bash
        run: |
          set -euo pipefail
          PLAN=$(git log --diff-filter=A --format=%H -- experiments/joint-constraint-tournament/STAGE0_PLAN.md | tail -1)
          AUDIT=$(git log --diff-filter=A --format=%H -- experiments/joint-constraint-tournament/authority_audit.py | tail -1)
          CORR=$(git log --diff-filter=A --format=%H -- experiments/joint-constraint-tournament/STAGE0_PRETARGET_CORRECTIONS.md | tail -1)
          test -n "$PLAN" && test -n "$AUDIT" && test -n "$CORR"
          test "$PLAN" != "$AUDIT"
          git merge-base --is-ancestor "$PLAN" "$AUDIT"
          test ! -e experiments/joint-constraint-tournament/PLAN_A.md
          test ! -e experiments/joint-constraint-tournament/target.py
          echo "STAGE0_PLAN_FIRST_ADD=$PLAN" >> "$GITHUB_ENV"
          echo "STAGE0_AUDIT_FIRST_ADD=$AUDIT" >> "$GITHUB_ENV"
          echo "STAGE0_CORRECTION_FIRST_ADD=$CORR" >> "$GITHUB_ENV"

      - name: Checkout frozen ZL3b source
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: _cipher_benchmark
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Checkout frozen CREMMA controls
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: _cremma
          sparse-checkout: |
            data/BIS-193
            data/CLM13027
            data/Mazarine915
            data/UBL758
          sparse-checkout-cone-mode: false

      - name: Checkout pinned Naibbe authority
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: _naibbe
          sparse-checkout: |
            naibbe_v2.py
            decrypt_naibbe.py
            references/naibbe_tables.csv
          sparse-checkout-cone-mode: false

      - name: Verify exact external authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _cipher_benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C _cipher_benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(git -C _cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"
          test "$(git -C _naibbe rev-parse HEAD)" = "f2675ec5dd275268bc64dd48ea64fc0e0e9827a2"
          test "$(git -C _naibbe hash-object naibbe_v2.py)" = "b566ad82e4b6ff0782ecdddebf77718dac44f292"
          test "$(git -C _naibbe hash-object references/naibbe_tables.csv)" = "5cd34fb81d80faf3b4d57dbf1719c05ffde25302"
          test "$(git -C _naibbe hash-object decrypt_naibbe.py)" = "b56a1e6e615a7b2e31ad386efdf7e6f2ef2b9d7b"

      - name: Install frozen scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1

      - name: Run corrected Stage0 authority audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile experiments/joint-constraint-tournament/authority_audit.py
          python experiments/joint-constraint-tournament/authority_audit.py > /tmp/stage0_authority_audit.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/stage0_authority_audit.json'))
          assert r['stage0_classification'] == 'JOINT TOURNAMENT AUTHORITY READY'
          assert r['new_joint_candidate_scores_computed'] is False
          assert r['common_fold_authority']['n_unique_physical_leaves'] == 99
          assert r['candidate_roles']['C0']['structured_roundtrip_exact'] is True
          assert r['candidate_roles']['C0']['boundary_side_information_required'] is False
          assert r['candidate_roles']['Naibbe_C1_E0']['published_decoder_exists'] is True
          assert r['candidate_roles']['Naibbe_C1_E0']['exact_original_text_roundtrip'] is False
          assert not any(r['target_firewall'].values())
          print('Corrected Stage0 authority audit: PASS')
          PY

      - name: Replay Phase62C frozen semantic result
        shell: bash
        run: |
          set -euo pipefail
          ZL=_cipher_benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          python experiments/phase62/phase62c_c0_a1.py "$ZL" _cremma > /tmp/phase62c_replay.json
          python - <<'PY'
          import json
          old=json.load(open('experiments/phase62/phase62c_c0_a1_results.json'))
          new=json.load(open('/tmp/phase62c_replay.json'))
          assert new == old
          print('Phase62C full semantic JSON replay: PASS')
          PY

      - name: Replay Phase62P frozen H62-P1 semantic result
        shell: bash
        run: |
          set -euo pipefail
          ZL=_cipher_benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          python experiments/phase62/phase62p_h62p1.py "$ZL" _cremma > /tmp/phase62p_replay.json
          python - <<'PY'
          import json
          old=json.load(open('experiments/phase62/phase62p_h62p1_results.json'))
          new=json.load(open('/tmp/phase62p_replay.json'))
          assert new == old
          print('Phase62P full semantic JSON replay: PASS')
          PY

      - name: Build replay provenance bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue68-stage0
          cp /tmp/stage0_authority_audit.json /tmp/issue68-stage0/authority_audit.json
          cp /tmp/phase62c_replay.json /tmp/issue68-stage0/phase62c_replay.json
          cp /tmp/phase62p_replay.json /tmp/issue68-stage0/phase62p_replay.json
          (cd /tmp/issue68-stage0 && sha256sum *.json | sort > SHA256SUMS.txt)
          cat > /tmp/issue68-stage0/RUN_PROVENANCE.txt <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          branch_head=${GITHUB_SHA}
          stage0_plan_first_add=${STAGE0_PLAN_FIRST_ADD}
          stage0_audit_first_add=${STAGE0_AUDIT_FIRST_ADD}
          stage0_correction_first_add=${STAGE0_CORRECTION_FIRST_ADD}
          target_scores_computed=false
          EOF
          cat /tmp/issue68-stage0/SHA256SUMS.txt
          cat /tmp/issue68-stage0/RUN_PROVENANCE.txt

      - name: Upload Stage0 replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue68-stage0-authority-replay-${{ github.sha }}
          path: /tmp/issue68-stage0
          if-no-files-found: error
          retention-days: 90
