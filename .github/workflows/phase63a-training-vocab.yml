name: Phase63A training-only vocabulary robustness

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/phase63/PLAN_A.md'
      - 'experiments/phase63/phase63a_training_vocab.py'
      - '.github/workflows/phase63a-training-vocab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LETSGO-Voynich head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Verify prior prospective authority exists
        shell: bash
        run: |
          test -f experiments/phase62/phase62p_h62p1_results.json
          test -f experiments/phase62/REPORT_P.md
          echo "0e1b687ab73efbc494834f49398ed474230f47bcde4cf4dbcaa46631efd75264  experiments/phase62/phase62p_h62p1_results.json" | sha256sum -c -

      - name: Checkout frozen CREMMA corpus
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen external inputs
        shell: bash
        run: |
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run unchanged frozen Phase63A scientific executable
        run: |
          python experiments/phase63/phase63a_training_vocab.py \
            external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            external/cremma \
            > phase63a_training_vocab_results.json

      - name: Print raw replay digest and compact verdict
        run: |
          sha256sum phase63a_training_vocab_results.json
          python - <<'PY'
          import json
          x=json.load(open('phase63a_training_vocab_results.json'))
          a=x['across_fold']
          print('PHASE63A_REPLAY_AUDIT')
          print('ratios=', a['A1_R1_ratio_of_means_to_voynich'])
          print('H62P1=', a['A1_R1_H62P1_summary'])
          print('components=', a['frozen_survival_components'])
          print('robust=', a['robust_to_heldout_vocabulary_removal'])
          PY

      - name: Upload replay for structural diff
        uses: actions/upload-artifact@v4
        with:
          name: phase63a-determinism-replay
          path: phase63a_training_vocab_results.json
