この二つは現在、同じ機構候補 A1 でかなり一貫して説明できている。

A1は「意味のない文字列を作る装置」と同義ではない。意味のある元情報の上に形式層が載る場合も理論上はあり得る。現時点で支持されているのは、**強い形式生成層が存在する**という構造・機構レベルの主張までである。

## 証拠がどこまで積み上がったか

