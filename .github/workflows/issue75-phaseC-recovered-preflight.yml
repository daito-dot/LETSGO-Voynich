name: Issue75 Phase C recovered target-blind replay preflight

on:
  push:
    branches: [issue75-minimal-occupancy-generator]
    paths:
      - '.github/workflows/issue75-phaseC-recovered-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rep: [0, 30]
    steps:
      - name: Checkout exact preflight head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify recovered preregistration and C0 authority
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/minimal-occupancy-generator/PLAN_C.md
          test -f experiments/minimal-occupancy-generator/C0_FREEZE_C.md
          test ! -e experiments/minimal-occupancy-generator/stage-c-first-reveal
          test ! -e experiments/minimal-occupancy-generator/REPORT_C.md
          git merge-base --is-ancestor 837d9b904a6fa75e5e50554477a3277c527c4a94 32d2f8c99a9c9cf608af8b393f597412556c6f5d
          git diff --exit-code 32d2f8c99a9c9cf608af8b393f597412556c6f5d HEAD -- experiments/minimal-occupancy-generator/phase75c_generator_support.py
          git diff --exit-code 77bcf3b8c4a56ac55eba8bffa775998f39a412d8 HEAD -- experiments/minimal-occupancy-generator/phase75c_score.py
          echo '1ff4469f57a84093b8c5d6463bb276a8de6fc108eed666bf63c9c7dacbf622a6  experiments/minimal-occupancy-generator/stage-c0/generator_authority.json' | sha256sum -c -
          python - <<'PY'
          import json
          p='experiments/minimal-occupancy-generator/stage-c0/generator_authority.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['status']=='M3_KRS_CHAIN_31_CORPORA_FROZEN_TARGET_BLIND'
          assert len(r['cases'])==31
          assert all(v is False for v in r['target_access'].values())
          assert r['no_drops'] is True and r['no_rerolls'] is True
          PY

      - name: Checkout frozen ZL3b source
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: _cipher_benchmark
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Verify exact source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _cipher_benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = '2a4533ab9bdfa85db9bad602d590978953055df1'

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1

      - name: Regenerate exact frozen case with target firewall
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/preflight
          python experiments/minimal-occupancy-generator/phase75c_score.py \
            _cipher_benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            '${{ matrix.rep }}' \
            '/tmp/preflight/M3-KRS-CHAIN_${{ matrix.rep }}.json' \
            --verify-only \
            > '/tmp/preflight/M3-KRS-CHAIN_${{ matrix.rep }}.stdout.txt'

      - name: Enforce exact replay and no target access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          rep=${{ matrix.rep }}
          p=f'/tmp/preflight/M3-KRS-CHAIN_{rep}.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['schema']=='issue75-phaseC-m3-r1-preflight-v1'
          assert r['status']=='EXACT_C0_M3_CORPUS_REGENERATED_TARGET_BLIND'
          assert r['rep']==rep and r['family']=='M3-KRS-CHAIN'
          a=r['candidate_audit']
          assert a['exact_phase_c0_replay'] is True
          assert a['fit_tolerance_revalidated'] is True
          assert a['regenerated_fit_max_abs_reported_moment_error'] <= 1e-10
          c0=json.load(open('experiments/minimal-occupancy-generator/stage-c0/generator_authority.json',encoding='utf-8'))
          frozen=next(x for x in c0['cases'] if x['rep']==rep)
          assert a['occupancy_sha256']==frozen['occupancy_sha256']
          assert all(v is False for v in r['target_access'].values())
          assert r['no_case_selection'] is True and r['no_reroll'] is True
          print({'rep':rep,'occupancy_sha256':a['occupancy_sha256'],'target_blind':True})
          PY
          sha256sum /tmp/preflight/* > /tmp/preflight/SHA256SUMS.txt
          cat > '/tmp/preflight/PROVENANCE_${{ matrix.rep }}.txt' <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          preflight_head=${GITHUB_SHA}
          rep=${{ matrix.rep }}
          phase_c0_sha256=1ff4469f57a84093b8c5d6463bb276a8de6fc108eed666bf63c9c7dacbf622a6
          target_loaded=false
          target_correlation_computed=false
          EOF

      - name: Upload target-blind preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue75-phaseC-recovered-preflight-rep${{ matrix.rep }}-${{ github.sha }}
          path: /tmp/preflight
          if-no-files-found: error
          retention-days: 90
