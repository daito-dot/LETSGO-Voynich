name: Issue26E11 Oettingen dyad probe

on:
  push:
    branches: [issue26-music-e11-oettingen-dyad-probe]
    paths:
      - 'experiments/issue26-music/PLAN_E11.md'
      - 'experiments/issue26-music/phaseE11_oettingen_dyad_probe.py'
      - 'experiments/issue26-music/issue26e_core.py'
      - '.github/workflows/issue26e11-oettingen-dyad-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout E11 branch
        uses: actions/checkout@v4
        with:
          ref: issue26-music-e11-oettingen-dyad-probe
          fetch-depth: 0

      - name: Verify plan predates executable
        shell: bash
        run: |
          PLAN=$(git log --format=%H -- experiments/issue26-music/PLAN_E11.md | tail -1)
          SCRIPT=$(git log --format=%H -- experiments/issue26-music/phaseE11_oettingen_dyad_probe.py | tail -1)
          echo plan_first=$PLAN script_first=$SCRIPT
          test "$PLAN" != "$SCRIPT"
          git merge-base --is-ancestor "$PLAN" "$SCRIPT"

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark
          sparse-checkout: |
            benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Checkout frozen CREMMA comparator
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma
          sparse-checkout: |
            data/BIS-193
            data/CLM13027
            data/Mazarine915
            data/UBL758
          sparse-checkout-cone-mode: false

      - name: Verify exact external inputs
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"

      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1

      - name: Run E11 dyadic probe
        shell: bash
        run: |
          python experiments/issue26-music/phaseE11_oettingen_dyad_probe.py \
            external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            external/cremma > issue26e11_probe.json

      - name: Print E11 summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open('issue26e11_probe.json'))
          print('classification=',r['classification'])
          print('gates=',r['lead_gates'])
          print('latin_self=',r['latin_self_baseline']['mean_cross_entropy'])
          for name in ['primary_min_phase0','max_phase0_sensitivity','min_phase1_sensitivity','max_phase1_sensitivity']:
              x=r[name]; p=x['pooled']; s=x['sequence_order_control']
              print('\n'+name)
              print(' CE=',p['cross_entropy'],'shuffle_p=',s['lower_tail_p'],'illegal=',p['illegal_rate'],'top5=',p['top5_char_fraction'])
              print(' recurrence=',x['exact_key_recurrence'],'key=',x['most_recurrent_key'])
              print(' hits6=',p['distinct_lexicon_hits_ge6'],'longest=',p['longest_lexicon_hit'])
              for f in x['folds']:
                  print(' fold',f['fold'],'key=',f['selected_key']['slot'],f['selected_key']['perm'],'train_illegal=',f['selected_key']['illegal_rate'],'train_ce=',f['selected_key']['cross_entropy'],'held_ce=',f['held']['cross_entropy'],'held_illegal=',f['held']['illegal_rate'])
              print(' samples:')
              for z in p['samples'][:15]: print(' ',z['page'],z['text'])
              print(' long hits:')
              for z in p['lexicon_hits'][:20]: print(' ',z)
          PY
          sha256sum issue26e11_probe.json

      - name: Upload E11 artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue26e11-oettingen-dyad-${{ github.sha }}
          path: issue26e11_probe.json
          if-no-files-found: error
          retention-days: 90
