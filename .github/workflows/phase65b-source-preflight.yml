name: Phase65B source-only preflight

on:
  push:
    branches: [phase65b-image-label-science]
    paths:
      - 'experiments/phase65/phase65b_source_preflight.py'
      - '.github/workflows/phase65b-source-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: phase65b-image-label-science

      - name: Install source-preflight dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compile source-only preflight
        run: python -m py_compile experiments/phase65/phase65b_source_preflight.py

      - name: Run source-only freeze
        run: |
          python experiments/phase65/phase65b_source_preflight.py \
            --out-dir phase65b-preflight-artifact \
            | tee phase65b-preflight.log

      - name: Assert anti-leak manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('phase65b-preflight-artifact/SOURCE_MANIFEST_B.generated.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          assert m['mode'] == 'SOURCE_ONLY_PREFLIGHT'
          assert m['p25_locus_freeze']['selected_count'] == 25
          assert all(v is False for v in m['anti_leak'].values())
          print('anti_leak=', m['anti_leak'])
          print('confidence_excluded_before_science=', m['p25_locus_freeze']['confidence_excluded_before_science'])
          print('confidence_eligible_count_by_page=', m['p25_locus_freeze']['confidence_eligible_count_by_page'])
          print('SOURCE PREFLIGHT PASS: no P25 visual-text association, DINO embedding, text distance, correlation or permutation statistic was computed.')
          PY

      - name: Archive source-only preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase65b-source-preflight-${{ github.sha }}
          path: |
            phase65b-preflight-artifact/SOURCE_MANIFEST_B.generated.json
            phase65b-preflight-artifact/IT2a-n.source.txt
            phase65b-preflight-artifact/yale_f100v_1006249.jpg
            phase65b-preflight-artifact/yale_f102v2_1006252.jpg
            phase65b-preflight.log
          if-no-files-found: error
          retention-days: 90
