name: Issue75 Phase C target-blind M3 replay preflight

on:
  push:
    branches: [issue75-minimal-occupancy-generator]
    paths:
      - '.github/workflows/issue75-phaseC-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rep: [0, 30]
    steps:
      - name: Checkout exact preflight head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Phase C license and plan-before-code chronology
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/minimal-occupancy-generator/DECISION_B_M3_LICENSED.md
          test ! -f experiments/minimal-occupancy-generator/DECISION_B_M2_SUFFICIENT_STOP.md
          test -f experiments/minimal-occupancy-generator/PLAN_C.md
          test -f experiments/minimal-occupancy-generator/C0_FREEZE_C.md
          PLAN=$(git log --diff-filter=A --format=%H -- experiments/minimal-occupancy-generator/PLAN_C.md | tail -1)
          GEN=$(git log --diff-filter=A --format=%H -- experiments/minimal-occupancy-generator/phase75c_generator_support.py | tail -1)
          C0=$(git log --diff-filter=A --format=%H -- experiments/minimal-occupancy-generator/stage-c0/generator_authority.json | tail -1)
          C0META=$(git log --diff-filter=A --format=%H -- experiments/minimal-occupancy-generator/C0_FREEZE_C.md | tail -1)
          SCORE=$(git log --diff-filter=A --format=%H -- experiments/minimal-occupancy-generator/phase75c_score.py | tail -1)
          AGG=$(git log --diff-filter=A --format=%H -- experiments/minimal-occupancy-generator/phase75c_aggregate.py | tail -1)
          FREEZE=$(git log --diff-filter=A --format=%H -- experiments/minimal-occupancy-generator/IMPLEMENTATION_FREEZE_C.md | tail -1)
          WF=$(git log --diff-filter=A --format=%H -- .github/workflows/issue75-phaseC-preflight.yml | tail -1)
          for x in "$PLAN" "$GEN" "$C0" "$C0META" "$SCORE" "$AGG" "$FREEZE" "$WF"; do test -n "$x"; done
          test "$WF" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$PLAN" "$GEN"
          git merge-base --is-ancestor "$GEN" "$C0"
          git merge-base --is-ancestor "$C0" "$C0META"
          git merge-base --is-ancestor "$C0META" "$SCORE"
          git merge-base --is-ancestor "$SCORE" "$AGG"
          git merge-base --is-ancestor "$AGG" "$FREEZE"
          git merge-base --is-ancestor "$FREEZE" "$WF"
          PLAN_BLOB=$(git rev-parse "$PLAN:experiments/minimal-occupancy-generator/PLAN_C.md")
          test "$(git rev-parse HEAD:experiments/minimal-occupancy-generator/PLAN_C.md)" = "$PLAN_BLOB"
          test ! -e experiments/minimal-occupancy-generator/stage-c-first-reveal
          test ! -e experiments/minimal-occupancy-generator/REPORT_C.md
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          freeze=Path('experiments/minimal-occupancy-generator/C0_FREEZE_C.md').read_text(encoding='utf-8')
          m=re.search(r'C0 authority SHA-256: `([0-9a-f]{64})`',freeze)
          assert m
          p=Path('experiments/minimal-occupancy-generator/stage-c0/generator_authority.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m.group(1)
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['status']=='M3_KRS_CHAIN_31_CORPORA_FROZEN_TARGET_BLIND'
          assert all(v is False for v in r['target_access'].values())
          assert r['no_drops'] is True and r['no_rerolls'] is True
          print({'c0_sha':m.group(1),'cases':len(r['cases']),'target_blind':True})
          PY

      - name: Checkout frozen ZL3b source
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: _cipher_benchmark
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Verify exact source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _cipher_benchmark rev-parse HEAD)" = '315f0cad4de3d021bd4185765c037cf2a28d341c'
          test "$(git -C _cipher_benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = '2a4533ab9bdfa85db9bad602d590978953055df1'

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1

      - name: Compile frozen M3 code
        run: |
          python -m py_compile experiments/minimal-occupancy-generator/phase75c_generator_support.py
          python -m py_compile experiments/minimal-occupancy-generator/phase75c_score.py
          python -m py_compile experiments/minimal-occupancy-generator/phase75c_aggregate.py

      - name: Regenerate exact C0 case without target access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/preflight
          python experiments/minimal-occupancy-generator/phase75c_score.py \
            _cipher_benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            '${{ matrix.rep }}' \
            '/tmp/preflight/M3-KRS-CHAIN_${{ matrix.rep }}.json' \
            --verify-only \
            > '/tmp/preflight/M3-KRS-CHAIN_${{ matrix.rep }}.stdout.txt'

      - name: Enforce exact replay and target firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          rep=${{ matrix.rep }}
          r=json.load(open(f'/tmp/preflight/M3-KRS-CHAIN_{rep}.json', encoding='utf-8'))
          assert r['schema']=='issue75-phaseC-m3-r1-preflight-v1'
          assert r['status']=='EXACT_C0_M3_CORPUS_REGENERATED_TARGET_BLIND'
          assert r['family']=='M3-KRS-CHAIN' and r['rep']==rep
          a=r['candidate_audit']
          assert a['exact_phase_c0_replay'] is True
          assert a['training_unary_moments_exact_c0'] is True
          assert a['training_adjacent_moments_exact_c0'] is True
          assert a['descriptor_distribution_exact_c0'] is True
          assert a['fit_tolerance_revalidated'] is True
          assert a['regenerated_fit_max_abs_reported_moment_error'] <= 1e-10
          assert a['tokens']==25071 and a['fold_tokens']==[4430,4810,5516,5447,4868]
          assert a['all_zero_count']==0
          c0=json.load(open('experiments/minimal-occupancy-generator/stage-c0/generator_authority.json', encoding='utf-8'))
          frozen=next(x for x in c0['cases'] if x['rep']==rep)
          assert a['occupancy_sha256']==frozen['occupancy_sha256']
          assert all(v is False for v in r['target_access'].values())
          assert r['no_case_selection'] is True and r['no_reroll'] is True
          print({'rep':rep,'sha':a['occupancy_sha256'],'fit_max_error':a['regenerated_fit_max_abs_reported_moment_error'],'target_blind':True})
          PY

      - name: Freeze preflight provenance
        shell: bash
        run: |
          set -euo pipefail
          C0SHA=$(python - <<'PY'
          import re
          t=open('experiments/minimal-occupancy-generator/C0_FREEZE_C.md',encoding='utf-8').read()
          print(re.search(r'C0 authority SHA-256: `([0-9a-f]{64})`',t).group(1))
          PY
          )
          cat > '/tmp/preflight/PROVENANCE_${{ matrix.rep }}.txt' <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          preflight_head=${GITHUB_SHA}
          rep=${{ matrix.rep }}
          phase_c0_sha256=${C0SHA}
          target_loaded=false
          pair_Q_computed=false
          residual_Z_computed=false
          target_correlation_computed=false
          EOF

      - name: Upload target-blind M3 preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue75-phaseC-preflight-rep${{ matrix.rep }}-${{ github.sha }}
          path: /tmp/preflight
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
