name: Issue68 target-free candidate preflight

on:
  push:
    branches: [issue68-joint-constraint-target]
    paths:
      - 'experiments/joint-constraint-tournament/IMPLEMENTATION_PREFLIGHT.md'
      - 'experiments/joint-constraint-tournament/preflight68.py'
      - '.github/workflows/issue68-target-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: issue68-joint-constraint-target
          fetch-depth: 0

      - name: Verify plan-before-code chronology and target firewall
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base b2298d7fe251070dacd21852ae3b5a1dac95fe65 HEAD)" = "b2298d7fe251070dacd21852ae3b5a1dac95fe65"
          PLAN=$(git log --diff-filter=A --format=%H -- experiments/joint-constraint-tournament/PLAN_A.md | tail -1)
          NOTE=$(git log --diff-filter=A --format=%H -- experiments/joint-constraint-tournament/IMPLEMENTATION_PREFLIGHT.md | tail -1)
          SCRIPT=$(git log --diff-filter=A --format=%H -- experiments/joint-constraint-tournament/preflight68.py | tail -1)
          test -n "$PLAN" && test -n "$NOTE" && test -n "$SCRIPT"
          git merge-base --is-ancestor "$PLAN" "$NOTE"
          git merge-base --is-ancestor "$NOTE" "$SCRIPT"
          test ! -e experiments/joint-constraint-tournament/target68.py
          test ! -e experiments/joint-constraint-tournament/tournament68.py
          echo "PLAN_FIRST_ADD=$PLAN" >> "$GITHUB_ENV"
          echo "NOTE_FIRST_ADD=$NOTE" >> "$GITHUB_ENV"
          echo "PREFLIGHT_FIRST_ADD=$SCRIPT" >> "$GITHUB_ENV"

      - name: Checkout frozen ZL3b authority
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Checkout frozen CREMMA authority
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout pinned Naibbe authority
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: external/naibbe

      - name: Verify exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"
          test "$(git -C external/naibbe rev-parse HEAD)" = "f2675ec5dd275268bc64dd48ea64fc0e0e9827a2"
          test "$(git -C external/naibbe hash-object naibbe_v2.py)" = "b566ad82e4b6ff0782ecdddebf77718dac44f292"
          test "$(git -C external/naibbe hash-object references/naibbe_tables.csv)" = "5cd34fb81d80faf3b4d57dbf1719c05ffde25302"
          test "$(git -C external/naibbe hash-object decrypt_naibbe.py)" = "b56a1e6e615a7b2e31ad386efdf7e6f2ef2b9d7b"

      - name: Install preexisting scientific/runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pandas

      - name: Compile preflight
        run: python -m py_compile experiments/joint-constraint-tournament/preflight68.py

      - name: Run target-free preflight
        shell: bash
        run: |
          set -euo pipefail
          python experiments/joint-constraint-tournament/preflight68.py \
            external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            external/cremma \
            external/naibbe \
            > /tmp/issue68_preflight.json

      - name: Enforce forbidden-target firewall and summarize allowed outcomes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('/tmp/issue68_preflight.json'))
          assert r['target_reveal'] is False
          assert r['real_candidate_pair_or_residual_metrics_computed'] is False
          assert not any(r['forbidden_R1_quantities'].values())
          print('A1 coverage:', r['A1_primary']['pooled_coverage'])
          print('Naibbe coverage:', r['Naibbe_primary']['pooled_coverage'])
          print('Naibbe R4:', r['Naibbe_primary']['R4_primary_rep0_aggregate'])
          print('Historical A1 R2/R3:', r['historical_frozen_responsibilities']['A1'])
          print('Historical Naibbe R2/R3:', r['historical_frozen_responsibilities']['Naibbe_C1_E0'])
          print('Preflight dispositions:', r['preflight_dispositions'])
          PY

      - name: Package preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue68-preflight
          cp /tmp/issue68_preflight.json /tmp/issue68-preflight/preflight.json
          sha256sum /tmp/issue68-preflight/preflight.json > /tmp/issue68-preflight/SHA256SUMS.txt
          cat > /tmp/issue68-preflight/PROVENANCE.txt <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          branch_head=${GITHUB_SHA}
          design_main=b2298d7fe251070dacd21852ae3b5a1dac95fe65
          plan_first_add=${PLAN_FIRST_ADD}
          implementation_note_first_add=${NOTE_FIRST_ADD}
          preflight_first_add=${PREFLIGHT_FIRST_ADD}
          target_reveal=false
          real_candidate_R1_pair_or_residual_metrics=false
          EOF
          cat /tmp/issue68-preflight/SHA256SUMS.txt

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue68-target-free-preflight-${{ github.sha }}
          path: /tmp/issue68-preflight
          if-no-files-found: error
          retention-days: 90
