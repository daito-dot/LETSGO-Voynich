name: issue209-tp1518-admission-a

on:
  push:
    branches:
      - issue209-tp1518-admission-a
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned external table data and audit without repair
        env:
          SOURCE_COMMIT: 0e38a37671a5e3b5decd11c19fe82de79883cae7
        run: |
          set -euo pipefail
          mkdir -p issue209-audit
          python - <<'PY'
          import collections
          import hashlib
          import json
          import os
          import urllib.request

          pin = os.environ['SOURCE_COMMIT']
          url = f'https://raw.githubusercontent.com/Trithemius-Corpus/Trithemius-Corpus/{pin}/site/static/cipher-data.json'
          raw = urllib.request.urlopen(url, timeout=60).read()
          open('issue209-audit/cipher-data.json', 'wb').write(raw)
          data = json.loads(raw.decode('utf-8'))
          cols = data['ave_maria']['columns']

          hist = collections.Counter(len(c.get('words', {})) for c in cols)
          full = []
          partial = []
          exact_dup = []
          folded_dup = []
          chunk_order = collections.OrderedDict()

          for idx, c in enumerate(cols):
              words = c.get('words', {})
              name = c.get('name', '')
              chunk = c.get('chunk', '')
              label = name.split(' · ', 1)[1] if ' · ' in name else name
              chunk_order.setdefault(chunk, []).append(label)
              rec = {'index': idx, 'name': name, 'chunk': chunk, 'cells': len(words)}
              if len(words) == 24:
                  full.append(rec)
              else:
                  partial.append(rec)
              vals = list(words.values())
              counts = collections.Counter(vals)
              dups = sorted(k for k,v in counts.items() if v > 1)
              if dups:
                  exact_dup.append({'index': idx, 'name': name, 'duplicates': dups})
              folded = collections.defaultdict(list)
              for letter, word in words.items():
                  folded[word.casefold()].append((letter, word))
              fdups = [items for items in folded.values() if len(items) > 1]
              if fdups:
                  folded_dup.append({'index': idx, 'name': name, 'duplicates': fdups})

          result = {
              'issue': 209,
              'stage': 'PRIORITY5_ADMISSION_STAGE_A_EXTERNAL_TABLE_AUDIT',
              'target_accessed': False,
              'source_repository': 'Trithemius-Corpus/Trithemius-Corpus',
              'source_commit': pin,
              'source_path': 'site/static/cipher-data.json',
              'source_url': url,
              'source_bytes': len(raw),
              'source_sha256': hashlib.sha256(raw).hexdigest(),
              'alphabet_24': data.get('alphabet_24'),
              'parser_reported_chunk_count': data['ave_maria'].get('chunk_count'),
              'emitted_column_count': len(cols),
              'populated_cell_histogram': {str(k): hist[k] for k in sorted(hist)},
              'full_24_cell_columns': len(full),
              'partial_columns': len(partial),
              'exact_duplicate_columns': len(exact_dup),
              'casefold_duplicate_columns': len(folded_dup),
              'partial_column_records': partial,
              'exact_duplicate_records': exact_dup,
              'casefold_duplicate_records': folded_dup,
              'chunk_column_order': chunk_order,
              'gate_note': 'No cells are repaired or inferred. Final Stage-A class additionally requires checking whether emitted order is the complete historical Book-I restart cycle; this audit does not infer missing source sequence from Latin content.'
          }
          out = json.dumps(result, ensure_ascii=False, indent=2)
          open('issue209-audit/issue209_stage_a_audit.json', 'w', encoding='utf-8').write(out + '\n')
          manifest_raw = json.dumps(result, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          open('issue209-audit/manifest_sha256.txt', 'w').write(hashlib.sha256(manifest_raw).hexdigest() + '  issue209_stage_a_audit.canonical-json\n')
          print(out)
          PY
          sha256sum issue209-audit/cipher-data.json issue209-audit/issue209_stage_a_audit.json

      - name: Upload exact audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: issue209-tp1518-admission-a
          path: issue209-audit/
          if-no-files-found: error
