name: Issue68 cleanup temporary design workflows

on:
  push:
    branches: [issue68-joint-constraint-tournament]
    paths:
      - '.github/workflows/issue68-cleanup-design-workflows.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue68-joint-constraint-tournament
          fetch-depth: 0
      - name: Remove every temporary Issue68 workflow
        shell: bash
        run: |
          set -euo pipefail
          files=$(find .github/workflows -maxdepth 1 -type f -name 'issue68-*' -print | sort)
          test -n "$files"
          printf '%s\n' "$files"
          while IFS= read -r f; do git rm "$f"; done <<< "$files"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Remove temporary Issue68 design workflows'
          git push origin HEAD:issue68-joint-constraint-tournament
