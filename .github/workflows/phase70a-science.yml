name: Phase 70A semantic A1 compatibility science

on:
  push:
    branches: [phase70-semantic-a1-compat]
    paths:
      - 'experiments/phase70/PLAN_A.md'
      - 'experiments/phase70/DECISION_A_BLIND.md'
      - 'experiments/phase70/phase70a_semantic_a1.py'
      - '.github/workflows/phase70a-science.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen scientific head
        uses: actions/checkout@v4

      - name: Checkout frozen ZL3b authority
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Checkout frozen CREMMA plaintext panel
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout exact published Naibbe source
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: external/naibbe

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy pandas

      - name: Verify frozen authorities and implementation
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"
          test "$(git -C external/naibbe rev-parse HEAD)" = "f2675ec5dd275268bc64dd48ea64fc0e0e9827a2"
          grep -q 'FROZEN BEFORE FIRST PHASE70 SCIENTIFIC SCORE' experiments/phase70/PLAN_A.md
          grep -q 'FROZEN BEFORE FIRST PHASE70 STRUCTURAL SCORE' experiments/phase70/DECISION_A_BLIND.md
          python -m py_compile experiments/phase70/phase70a_semantic_a1.py

      - name: First authorized Phase70 structural reveal
        run: |
          python experiments/phase70/phase70a_semantic_a1.py \
            external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            external/cremma \
            external/naibbe \
            > phase70a_results.json
          python -m json.tool phase70a_results.json > /dev/null
          sha256sum phase70a_results.json

      - name: Print frozen verdict summary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('phase70a_results.json'))
          out={
            'classification':x['classification'],
            'reversibility':{
              'SC0':x['reversibility_and_utilization']['SC0_decode_accuracy'],
              'SC1':x['reversibility_and_utilization']['SC1_decode_accuracy'],
              'local_opportunity_fraction_body':x['reversibility_and_utilization']['local_opportunity_fraction_body'],
              'local_activation_fraction_body':x['reversibility_and_utilization']['local_activation_fraction_body'],
              'selected_local_hit_fraction_body':x['reversibility_and_utilization']['selected_local_hit_fraction_body'],
            },
            'SC0':x['evaluations']['SC0']['primary'],
            'SC1':x['evaluations']['SC1']['primary'],
            'paired_causal':x['paired_A1_surface_causal_check'],
          }
          # Keep console compact while retaining raw result in the artifact.
          for arm in ('SC0','SC1'):
              y=out[arm]
              out[arm]={
                'ratios':y['ratio_of_means_to_voynich'],
                'H62':y['H62P1_summary'],
                'broad_regime_pass':y['broad_regime_pass'],
                'A1_reference':y['A1_R1_reference_only'],
              }
          print(json.dumps(out, indent=2))
          PY

      - name: Record provenance hashes
        run: |
          sha256sum \
            experiments/phase70/PLAN_A.md \
            experiments/phase70/DECISION_A_BLIND.md \
            experiments/phase70/phase70a_semantic_a1.py \
            experiments/phase61/phase61c_joint_model.py \
            experiments/phase61/phase61c_results.json \
            experiments/phase69/phase69a_adaptive_naibbe.py \
            phase70a_results.json \
            | tee phase70a_sha256s.txt

      - name: Upload first-reveal artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase70a-first-reveal
          path: |
            phase70a_results.json
            phase70a_sha256s.txt
          if-no-files-found: error
