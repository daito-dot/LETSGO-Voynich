name: Issue72 V2 Stage D0 bind PT baseline authority and preflight

on:
  push:
    branches: [issue72-r1-causal-decomposition-v2]
    paths:
      - '.github/workflows/issue72-v2-stage-d0-bind-pt-authority-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bind-and-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact binding head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify frozen PT authority and chronology
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c45c67a665a7e4ad24c1d2706f83c65931d950a9 HEAD
          git merge-base --is-ancestor 30ef44607d6c04b55f760582152b2da8d389136c HEAD
          test "$(sha256sum experiments/naibbe-r1-decomposition-v2/stage_b0_pt_authority.json | cut -d' ' -f1)" = '703991a4b176e78ea18c30210ec730187b446c0c8b14052fc2d25e4a8d8f86e4'
          python -m json.tool experiments/naibbe-r1-decomposition-v2/stage_b0_pt_authority.json >/dev/null
          python - <<'PY'
          import json
          r=json.load(open('experiments/naibbe-r1-decomposition-v2/stage_b0_pt_authority.json',encoding='utf-8'))
          assert r['scientific_role']=='TARGET_BLIND_BASELINE_REPLAY_AUTHORITY_FOR_STAGE_D_PT'
          assert r['source_artifact']['artifact_id']==9783720673
          assert r['source_artifact']['full_stage_b0_json_sha256']=='96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58'
          assert all(v is False for v in r['target_access'].values())
          PY
          test ! -e experiments/naibbe-r1-decomposition-v2/STAGE_D1_PT_REPORT.md
          test ! -e experiments/naibbe-r1-decomposition-v2/stage-d1-pt

      - name: Rebind D0 implementation to PT baseline authority in working tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py')
          s=p.read_text(encoding='utf-8')
          replacements={
            'EXPECTED_B0_RAW_SHA256 = "96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58"':
            'EXPECTED_B0_PT_AUTHORITY_SHA256 = "703991a4b176e78ea18c30210ec730187b446c0c8b14052fc2d25e4a8d8f86e4"',
            'path = HERE.parent / "stage_b0_support.json"':
            'path = HERE.parent / "stage_b0_pt_authority.json"',
            'if got != EXPECTED_B0_RAW_SHA256:\n        raise RuntimeError(f"Stage B0 authority SHA changed: {got} != {EXPECTED_B0_RAW_SHA256}")':
            'if got != EXPECTED_B0_PT_AUTHORITY_SHA256:\n        raise RuntimeError(f"Stage B0 PT authority SHA changed: {got} != {EXPECTED_B0_PT_AUTHORITY_SHA256}")',
            'if obj["status"] != "UNCHANGED_NAIBBE_REP0_REP4_SURFACES_FROZEN":\n        raise RuntimeError("Stage B0 authority status changed")':
            'if obj["schema"] != "issue72-v2-stage-d0-pt-baseline-authority-v1":\n        raise RuntimeError("Stage B0 PT authority schema changed")\n    if obj["scientific_role"] != "TARGET_BLIND_BASELINE_REPLAY_AUTHORITY_FOR_STAGE_D_PT":\n        raise RuntimeError("Stage B0 PT authority role changed")\n    if obj["status"] != "UNCHANGED_NAIBBE_REP0_REP4_SURFACES_FROZEN":\n        raise RuntimeError("Stage B0 PT authority status changed")\n    if obj["source_artifact"]["full_stage_b0_json_sha256"] != "96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58":\n        raise RuntimeError("Stage B0 source artifact identity changed")',
            'if int(diag["ambiguity_retries"]) != int(frozen["generation_diagnostics"]["ambiguity_retries"]):':
            'if int(diag["ambiguity_retries"]) != int(frozen["ambiguity_retries"]):',
            '"stage_b0_support_json_sha256": EXPECTED_B0_RAW_SHA256,':
            '"stage_b0_pt_authority_json_sha256": EXPECTED_B0_PT_AUTHORITY_SHA256,\n            "source_full_stage_b0_json_sha256": "96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58",\n            "source_stage_b0_artifact_id": 9783720673,',
          }
          for old,new in replacements.items():
              if s.count(old)!=1:
                  raise SystemExit(f'expected exactly one match for: {old[:90]!r}; got {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py
          git diff --check
          git diff -- experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py

      - name: Checkout frozen CREMMA authority
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout pinned Naibbe authority
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: external/naibbe

      - name: Install frozen preexisting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pandas

      - name: Execute prospective edge cases target blind
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d0-preflight-v2
          python experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py \
            external/cremma external/naibbe 0 0 /tmp/d0-preflight-v2/PT_j0_rep0.json \
            > /tmp/d0-preflight-v2/j0r0.stdout.txt
          python experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py \
            external/cremma external/naibbe 30 4 /tmp/d0-preflight-v2/PT_j30_rep4.json \
            > /tmp/d0-preflight-v2/j30r4.stdout.txt

      - name: Enforce exact baseline replay, intervention invariants, and target firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          expected={(0,0),(30,4)}
          seen=set()
          for p in ['/tmp/d0-preflight-v2/PT_j0_rep0.json','/tmp/d0-preflight-v2/PT_j30_rep4.json']:
              r=json.load(open(p,encoding='utf-8'))
              key=(r['assignment']['j'],r['assignment']['rep'])
              seen.add(key)
              assert r['status']=='STAGE_D0_PT_ASSIGNMENT_SUPPORT_FROZEN_TARGET_BLIND'
              assert r['implementation_authority']['stage_b0_pt_authority_json_sha256']=='703991a4b176e78ea18c30210ec730187b446c0c8b14052fc2d25e4a8d8f86e4'
              assert r['implementation_authority']['source_full_stage_b0_json_sha256']=='96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58'
              assert r['implementation_authority']['source_stage_b0_artifact_id']==9783720673
              assert r['paired_baseline']['exact_stage_b0_replay'] is True
              assert r['pt_surface']['line_invariants_all_true'] is True
              assert r['pt_surface']['changed_from_paired_baseline_primary'] is True
              assert r['pt_surface']['changed_nonempty_lines'] > 0
              assert all(v is False for v in r['target_access'].values())
              assert r['intervention_generation']['PT_surface_generated'] is True
              assert r['intervention_generation']['full_published_pipeline_rerun'] is True
              assert r['intervention_generation']['published_codebook_unchanged'] is True
              assert r['intervention_generation']['downstream_path_allowed_to_diverge'] is True
              print('PREFLIGHT_V2_OK',key,r['pt_surface']['support']['coverage'])
          assert seen==expected
          PY

      - name: Commit authority-bound D0 implementation and fresh preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          DEST=experiments/naibbe-r1-decomposition-v2/stage-d0-pt-preflight-authority-v2
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp /tmp/d0-preflight-v2/PT_j0_rep0.json "$DEST/"
          cp /tmp/d0-preflight-v2/PT_j30_rep4.json "$DEST/"
          (cd "$DEST" && sha256sum PT_*.json | sort > SHA256SUMS.txt)
          cat > "$DEST/PROVENANCE.txt" <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          binding_head=${GITHUB_SHA}
          stage_d_plan_commit=c45c67a665a7e4ad24c1d2706f83c65931d950a9
          pt_baseline_authority_commit=30ef44607d6c04b55f760582152b2da8d389136c
          pt_baseline_authority_sha256=703991a4b176e78ea18c30210ec730187b446c0c8b14052fc2d25e4a8d8f86e4
          source_full_b0_sha256=96b2865496306b48a4d843b590da32b06684520e4db6a21dd0ed0b859ca27d58
          source_b0_artifact_id=9783720673
          cases=j0_rep0,j30_rep4
          exact_baseline_replay=true
          line_inventory_invariants=true
          target_loaded=false
          R1_computed=false
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/naibbe-r1-decomposition-v2/d0_pt_support72_v2.py "$DEST"
          git diff --cached --quiet && exit 1
          git commit -m 'Issue72 V2 Stage D0: bind PT authority and freeze clean preflight'
          git push origin HEAD:issue72-r1-causal-decomposition-v2
