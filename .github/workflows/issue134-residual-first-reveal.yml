name: Issue134 augmented-core residual first reveal

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/residual-gate/issue134_residual_first_reveal.py'
      - '.github/workflows/issue134-residual-first-reveal.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt

jobs:
  residual-first-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen source, Gate and preregistration
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(sha256sum "$ZL3B" | awk '{print $1}')" = "bf5b6d4ac1e3a51b1847a9c388318d609020441ccd56984c901c32b09beccafc"
          test -f experiments/predictive-information/residual-gate/ISSUE134_AUGMENTED_CORE_PLAN.md
          test -f experiments/predictive-information/residual-gate/ISSUE134_GATE0_PROVENANCE.md
          test -f experiments/predictive-information/residual-gate/issue134_augmented_core_gate0.py
          test -f experiments/predictive-information/residual-gate/issue134_residual_first_reveal.py
          grep -F '3e11615c731654854b6ad982007d5f340b47d3a0c088cd09ab2af08080489db1' experiments/predictive-information/residual-gate/ISSUE134_GATE0_PROVENANCE.md

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Enforce residual-closure firewall
        shell: bash
        run: |
          TARGET=experiments/predictive-information/residual-gate/issue134_residual_first_reveal.py
          if grep -E 'output_metrics|score_r1\(|metric_gates\(|H62P1|target_exposed|writing_hand[[:space:]]*=' "$TARGET"; then
            echo 'Forbidden downstream/surface/hand target reference found in Issue134 scorer' >&2
            exit 1
          fi

      - name: Compile and self-test before first reveal
        shell: bash
        run: |
          python -m py_compile experiments/predictive-information/residual-gate/issue134_residual_first_reveal.py
          python experiments/predictive-information/residual-gate/issue134_residual_first_reveal.py --self-test

      - name: Run frozen residual first reveal
        shell: bash
        run: |
          python experiments/predictive-information/residual-gate/issue134_residual_first_reveal.py --run "$ZL3B" issue134_residual_first_reveal.json
          python -m json.tool issue134_residual_first_reveal.json > /dev/null
          sha256sum issue134_residual_first_reveal.json | tee issue134_residual_first_reveal.sha256

      - name: Assert frozen classification and support
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open('issue134_residual_first_reveal.json'))
          assert x['residual_scored'] is True, x
          assert x['gate_authority']['valid'] is True
          assert x['gate_authority']['json_sha256']=='3e11615c731654854b6ad982007d5f340b47d3a0c088cd09ab2af08080489db1'
          assert x['core_authority']['valid'] is True
          assert x['core_authority']['normalized_sha256']=='0d7f311dac17f5736f8191b8ea38cf5f2eac9b7391150a986204772da181ae27'
          assert x['source']['git_blob_sha1']=='2a4533ab9bdfa85db9bad602d590978953055df1'
          assert len(x['outer'])==5
          expected_n=[4430,4810,5516,5447,4868]
          g=[]
          for f,r in enumerate(x['outer']):
              assert r['fold']==f and r['n_scored']==expected_n[f]
              assert math.isfinite(r['bits_B3'])
              assert math.isfinite(r['observable_edge']['raw_bits_per_token'])
              assert math.isfinite(r['observable_edge']['augmented_core_bits_per_token'])
              assert r['observable_edge']['fixed_k']==2
              assert abs(r['observable_edge']['fixed_alpha']-.01)<1e-15
              assert 0.0 <= r['observable_edge']['selected_rho'] <= 1.0
              for fam in ('RESET','LINE'):
                  q=r[fam]
                  assert q['selected']['k'] in range(7)
                  assert q['selected']['alpha'] in (0.01,0.10,1.0)
                  assert 0.0 <= q['selected']['w'] <= 1.0
                  assert q['n_accepted']==r['n_scored'] and q['n_visible']==r['n_visible']
                  assert math.isfinite(q['raw_bits_per_token']) and math.isfinite(q['mix_bits_per_token'])
              assert math.isfinite(r['G_residual'])
              g.append(r['G_residual'])
          mean=sum(g)/5
          pos=sum(v>0 for v in g)
          passed=(mean>0 and pos>=4)
          expected=('ROBUST RESIDUAL REMAINS BEYOND AUGMENTED OBSERVABLE CORE' if passed else 'NO ROBUST RESIDUAL BEYOND AUGMENTED OBSERVABLE CORE')
          assert x['classification']==expected,(x['classification'],expected,g)
          s=x['summaries']['G_residual']
          assert abs(s['mean']-mean)<1e-12
          assert s['positive_folds']==pos and s['pass'] is passed
          assert all(v is False for v in x['firewall'].values())
          assert all(v is False for v in x['interpretation_boundary'].values())
          print(json.dumps({
              'classification':x['classification'],
              'G_residual':s,
              'mean_bits':x['summaries']['mean_bits_per_token'],
              'G_aug_vs_B3_mean':x['summaries']['G_aug_vs_B3_mean'],
              'G_reset_beyond_aug_mean':x['summaries']['G_reset_beyond_aug_mean'],
              'G_line_beyond_aug_mean':x['summaries']['G_line_beyond_aug_mean'],
              'selected':{
                  str(r['fold']):{
                      'rho':r['observable_edge']['selected_rho'],
                      'RESET':r['RESET']['selected'],
                      'LINE':r['LINE']['selected'],
                      'G_residual':r['G_residual'],
                      'edge_fallback':r['observable_edge']['fallback'],
                  } for r in x['outer']
              },
          },indent=2,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload first-reveal authority
        uses: actions/upload-artifact@v4
        with:
          name: issue134-residual-first-reveal
          path: |
            issue134_residual_first_reveal.json
            issue134_residual_first_reveal.sha256
