name: Issue98 Phase2C order authority audit

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/phase2c/**'
      - '.github/workflows/issue98-phase2c-order-audit.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt

jobs:
  order-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen source
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Compile and self-test
        shell: bash
        run: |
          python -m py_compile experiments/predictive-information/phase2c/order_authority_audit.py
          python experiments/predictive-information/phase2c/order_authority_audit.py --self-test

      - name: Run score-free Gate 0 audit
        shell: bash
        run: |
          python experiments/predictive-information/phase2c/order_authority_audit.py --audit "$ZL3B" phase2c_order_audit.json
          python -m json.tool phase2c_order_audit.json > /dev/null
          sha256sum phase2c_order_audit.json

      - name: Assert score-free firewall and print gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('phase2c_order_audit.json'))
          assert x['firewall'] == {
              'predictive_scores_computed': False,
              'semantic_or_image_context_used': False,
              'surface_target_metrics_scored': False,
          }
          assert x['fold_membership']['all_items_in_exactly_one_leaf_fold'] is True
          print(json.dumps({
              'gate_pass': x['gate_pass'],
              'gate_rule': x['gate_rule'],
              'population': x['population'],
              'paragraph_order': {
                  k:v for k,v in x['paragraph_order'].items() if k != 'mismatched_documents'
              },
              'mismatched_documents': [
                  {'document':d['document'],'paragraph_count':d['paragraph_count']}
                  for d in x['paragraph_order']['mismatched_documents']
              ],
              'page_side_order': x['page_side_order'],
              'fold_membership': x['fold_membership'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload Gate 0 audit
        uses: actions/upload-artifact@v4
        with:
          name: issue98-phase2c-order-audit
          path: phase2c_order_audit.json
