name: Issue75 Phase F0 exact sharded fallback

on:
  push:
    branches: [issue75-minimal-occupancy-generator]
    paths: ['.github/workflows/issue75-phaseF0-sharded-fallback.yml']

permissions:
  actions: read
  contents: write

jobs:
  shard:
    name: fold-${{ matrix.fold }}-${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fold: [0, 1, 2, 3, 4]
        family: [G2, G3]
    steps:
      - name: Checkout exact sharded execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify execution-only sharding freeze and absence of prior F0 authority
        shell: bash
        run: |
          set -euo pipefail
          SERIAL_HEAD=9a9a66d85e74d02e804e435c9a15a007a7047aa2
          SHARD_PLAN=f9a452f8f865a12dfa6c1a946677d35a955b5f33
          SHARD_RUNNER=a96ca018fccac26298d6cc02a98032637a476036
          SHARD_AGG=e540cca7e698cb16d6fdc18b82912af6ab50e4e9
          SHARD_FREEZE=033e528adf26f3ad68dd570193edd67d7f62e0e0
          for C in "$SERIAL_HEAD" "$SHARD_PLAN" "$SHARD_RUNNER" "$SHARD_AGG" "$SHARD_FREEZE"; do git merge-base --is-ancestor "$C" HEAD; done
          test "$(git rev-parse ${SHARD_RUNNER}^)" = "$SHARD_PLAN"
          test "$(git rev-parse ${SHARD_AGG}^)" = "$SHARD_RUNNER"
          test "$(git rev-parse ${SHARD_FREEZE}^)" = "$SHARD_AGG"
          git diff --exit-code 201a4d3a1ff4ef374f1ab3b0c2f8adf7f886e394 HEAD -- experiments/minimal-occupancy-generator/phase75f0_training_latent_diagnostic.py
          git diff --exit-code 2874f57a201fd36f8289e5375551a240ef5f02d4 HEAD -- experiments/minimal-occupancy-generator/phase75f0_stable_runner.py
          git diff --exit-code "$SHARD_PLAN" HEAD -- experiments/minimal-occupancy-generator/F0_EXECUTION_SHARDING_PLAN.md
          git diff --exit-code "$SHARD_RUNNER" HEAD -- experiments/minimal-occupancy-generator/phase75f0_shard_runner.py
          git diff --exit-code "$SHARD_AGG" HEAD -- experiments/minimal-occupancy-generator/phase75f0_shard_aggregate.py
          git diff --exit-code "$SHARD_FREEZE" HEAD -- experiments/minimal-occupancy-generator/IMPLEMENTATION_FREEZE_F0_SHARDING.md
          test ! -e experiments/minimal-occupancy-generator/stage-f0
          ! grep -Eq 'target68|load_target_references|phase75[a-e]_score' \
            experiments/minimal-occupancy-generator/phase75f0_training_latent_diagnostic.py \
            experiments/minimal-occupancy-generator/phase75f0_stable_runner.py \
            experiments/minimal-occupancy-generator/phase75f0_shard_runner.py \
            experiments/minimal-occupancy-generator/phase75f0_shard_aggregate.py

      - name: Checkout frozen ZL3b source
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: _cb
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Verify source and install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _cb hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = 2a4533ab9bdfa85db9bad602d590978953055df1
          python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1
          python -m py_compile \
            experiments/minimal-occupancy-generator/phase75e_generator_support.py \
            experiments/minimal-occupancy-generator/phase75f0_training_latent_diagnostic.py \
            experiments/minimal-occupancy-generator/phase75f0_stable_runner.py \
            experiments/minimal-occupancy-generator/phase75f0_shard_runner.py

      - name: Run exact fold-family shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shard
          python experiments/minimal-occupancy-generator/phase75f0_shard_runner.py \
            _cb/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            '${{ matrix.fold }}' '${{ matrix.family }}' \
            '/tmp/shard/phase75f0_shard_fold${{ matrix.fold }}_${{ matrix.family }}.json' \
            > '/tmp/shard/stdout_fold${{ matrix.fold }}_${{ matrix.family }}.txt'

      - name: Validate shard without model-selection promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math
          fold=int('${{ matrix.fold }}'); fam='${{ matrix.family }}'
          p=f'/tmp/shard/phase75f0_shard_fold{fold}_{fam}.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['schema']=='issue75-phaseF0-fold-family-shard-v1'
          assert r['status']=='PHASE_F0_FOLD_FAMILY_SHARD_COMPLETE_TARGET_BLIND'
          assert r['fold']==fold and r['candidate_key']==fam
          assert r['source']['ZL3b_blob']=='2a4533ab9bdfa85db9bad602d590978953055df1'
          assert r['source']['parsed_tokens']==25071
          expected=[4430,4810,5516,5447,4868]
          assert r['heldout_tokens']==expected[fold] and r['training_tokens']==25071-expected[fold]
          assert 0 <= r['m5']['selected_start_index'] <= 8
          c=r['candidate']
          assert len(c['all_starts'])==9 and {s['start_index'] for s in c['all_starts']}==set(range(9))
          assert 0 <= c['selected_start_index'] <= 8
          assert math.isfinite(c['heldout_nats_per_token'])
          assert c['training_conditional_log_likelihood'] >= r['m5']['training_conditional_log_likelihood']-1e-7
          assert c['gradient_audit']['passed'] is True
          if fam=='G2':
              assert c['family']=='M6-KRS-GATED-2MIX-CHAIN'
              assert c['free_continuous_parameters']==46
              assert c['minimum_descriptor_gate_probability'] > 1e-8
              assert c['maximum_descriptor_gate_probability'] < 1-1e-8
          else:
              assert c['family']=='M6-GLOBAL-3MIX-CHAIN'
              assert c['free_continuous_parameters']==65
              assert min(c['global_weights']) > 1e-8
          assert all(v is False for v in r['guardrails'].values())
          print({'fold':fold,'family':fam,'gain':c['heldout_gain_over_m5_nats_per_token'],'selected_start':c['selected_start_index']})
          PY

      - name: Upload non-promoting shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue75-phaseF0-shard-${{ github.sha }}-${{ matrix.fold }}-${{ matrix.family }}
          path: /tmp/shard
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: aggregate-all-ten-shards
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact sharded execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download every shard from this run
        uses: actions/download-artifact@v4
        with:
          pattern: issue75-phaseF0-shard-${{ github.sha }}-*
          path: /tmp/shards
          merge-multiple: true

      - name: Install frozen aggregation dependency and verify lattice
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1
          test "$(find /tmp/shards -maxdepth 1 -name 'phase75f0_shard_fold*_G*.json' | wc -l)" -eq 10
          python -m py_compile experiments/minimal-occupancy-generator/phase75f0_shard_aggregate.py

      - name: Aggregate all ten shards under frozen F0 law
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f0
          python experiments/minimal-occupancy-generator/phase75f0_shard_aggregate.py \
            /tmp/shards /tmp/f0/phase75f0_training_latent_diagnostic.json \
            > /tmp/f0/stdout.txt
          mkdir -p /tmp/f0/shards
          cp /tmp/shards/phase75f0_shard_fold*_G*.json /tmp/f0/shards/
          cp /tmp/shards/stdout_fold*_G*.txt /tmp/f0/shards/
          (cd /tmp/f0 && find shards -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/f0/SHARD_SHA256SUMS.txt

      - name: Validate complete authority and frozen selection law
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,math,numpy as np
          r=json.load(open('/tmp/f0/phase75f0_training_latent_diagnostic.json',encoding='utf-8'))
          assert r['schema']=='issue75-phaseF0-training-latent-diagnostic-v1'
          assert r['status']=='PHASE_F0_TRAINING_ONLY_LATENT_FRONTIER_DIAGNOSTIC_COMPLETE'
          assert r['execution_mode']=='EXACT_TEN_SHARD_EXECUTION_ONLY_FALLBACK'
          assert r['source']['ZL3b_blob']=='2a4533ab9bdfa85db9bad602d590978953055df1'
          assert r['source']['parsed_tokens']==25071
          assert r['source']['fold_parsed_tokens']==[4430,4810,5516,5447,4868]
          assert r['families']['baseline']['free_continuous_parameters']==43
          assert r['families']['g2']['free_continuous_parameters']==46
          assert r['families']['g3']['free_continuous_parameters']==65
          folds=r['outer_folds']; assert len(folds)==5 and [x['fold'] for x in folds]==list(range(5))
          d2=np.array([x['g2']['heldout_gain_over_m5_nats_per_token'] for x in folds],float)
          d3=np.array([x['g3']['heldout_gain_over_m5_nats_per_token'] for x in folds],float)
          d32=np.array([x['direct_g3_minus_g2_nats_per_token'] for x in folds],float)
          s2=bool(np.all(d2>0) and np.median(d2)>=0.01)
          s3=bool(np.all(d3>0) and np.median(d3)>=0.01)
          n32=int(np.sum(d32>0)); m32=float(np.median(d32))
          assert r['support']['g2_over_m5']['supported'] is s2
          assert r['support']['g3_over_m5']['supported'] is s3
          if s2 and not s3: cls='F0_SELECT_KRS_GATED_TWO_MODE_CHAIN'
          elif s3 and not s2: cls='F0_SELECT_GLOBAL_THREE_MODE_CHAIN'
          elif s2 and s3: cls='F0_SELECT_GLOBAL_THREE_MODE_CHAIN' if (n32>=4 and m32>=0.01) else 'F0_SELECT_KRS_GATED_TWO_MODE_CHAIN'
          else: cls='F0_GLOBAL_MIXTURE_EXTENSIONS_NOT_PREDICTIVELY_SUPPORTED_WITHIN_TOKEN_STATE_FRONTIER_REQUIRED'
          assert r['selection']['classification']==cls
          assert all(v is False for v in r['guardrails'].values())
          print({'classification':cls,'g2_gains':d2.tolist(),'g2_median':float(np.median(d2)),'g2_supported':s2,'g3_gains':d3.tolist(),'g3_median':float(np.median(d3)),'g3_supported':s3,'g3_minus_g2':d32.tolist(),'g3_minus_g2_median':m32})
          PY
          AUTH_SHA=$(sha256sum /tmp/f0/phase75f0_training_latent_diagnostic.json | cut -d' ' -f1)
          echo "authority_sha=$AUTH_SHA" >> "$GITHUB_OUTPUT"
          sha256sum /tmp/f0/phase75f0_training_latent_diagnostic.json /tmp/f0/stdout.txt /tmp/f0/SHARD_SHA256SUMS.txt > /tmp/f0/SHA256SUMS.txt
          cat > /tmp/f0/PROVENANCE.txt <<EOF
          scientific_role=PRETARGET_TRAINING_ONLY_LATENT_FRONTIER_DIAGNOSTIC_AUTHORITY
          execution_mode=EXACT_TEN_SHARD_EXECUTION_ONLY_FALLBACK
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          execution_head=${GITHUB_SHA}
          serial_repair1_run_precedence=33545246568
          sharding_plan_commit=f9a452f8f865a12dfa6c1a946677d35a955b5f33
          shard_runner_commit=a96ca018fccac26298d6cc02a98032637a476036
          shard_aggregator_commit=e540cca7e698cb16d6fdc18b82912af6ab50e4e9
          sharding_freeze_commit=033e528adf26f3ad68dd570193edd67d7f62e0e0
          authority_sha256=${AUTH_SHA}
          source_blob=2a4533ab9bdfa85db9bad602d590978953055df1
          physical_folds=5
          complete_shards=10
          external_reference_measurements_accessed=false
          random_restarts=false
          rerolls=false
          EOF

      - name: Upload complete sharded F0 authority
        uses: actions/upload-artifact@v4
        with:
          name: issue75-phaseF0-sharded-authority-${{ github.sha }}
          path: /tmp/f0
          if-no-files-found: error
          retention-days: 90

      - name: Commit exact sharded F0 authority into repository
        shell: bash
        run: |
          set -euo pipefail
          DEST=experiments/minimal-occupancy-generator/stage-f0
          test ! -e "$DEST"
          mkdir -p "$DEST"
          cp -a /tmp/f0/. "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m 'Issue75 Phase F0: freeze sharded training-only latent diagnostic authority'
          git push origin HEAD:issue75-minimal-occupancy-generator
