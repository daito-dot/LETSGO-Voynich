name: Issue72 V2 Stage B0 unchanged-Naibbe support freeze

on:
  push:
    branches: [issue72-r1-causal-decomposition-v2]
    paths:
      - 'experiments/naibbe-r1-decomposition-v2/STAGE_B_POSITIVE_CONTROL_PLAN.md'
      - 'experiments/naibbe-r1-decomposition-v2/b0_support72_v2.py'
      - '.github/workflows/issue72-v2-stage-b0-support.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b0-support:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact V2 branch
        uses: actions/checkout@v4
        with:
          ref: issue72-r1-causal-decomposition-v2
          fetch-depth: 0

      - name: Verify Stage B plan-before-code-before-workflow chronology
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 98a04953aabe9e228a17fa5808adf506a0833362 HEAD)" = "98a04953aabe9e228a17fa5808adf506a0833362"
          PLAN=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/STAGE_B_POSITIVE_CONTROL_PLAN.md | tail -1)
          SCRIPT=$(git log --diff-filter=A --format=%H -- experiments/naibbe-r1-decomposition-v2/b0_support72_v2.py | tail -1)
          WORKFLOW=$(git log --diff-filter=A --format=%H -- .github/workflows/issue72-v2-stage-b0-support.yml | tail -1)
          test -n "$PLAN" && test -n "$SCRIPT" && test -n "$WORKFLOW"
          git merge-base --is-ancestor "$PLAN" "$SCRIPT"
          git merge-base --is-ancestor "$SCRIPT" "$WORKFLOW"
          test ! -e experiments/naibbe-r1-decomposition-v2/b1_r1_calibration72_v2.py
          test ! -e experiments/naibbe-r1-decomposition-v2/STAGE_B1_REPORT.md
          echo "B_PLAN_FIRST_ADD=$PLAN" >> "$GITHUB_ENV"
          echo "B0_SCRIPT_FIRST_ADD=$SCRIPT" >> "$GITHUB_ENV"
          echo "B0_WORKFLOW_FIRST_ADD=$WORKFLOW" >> "$GITHUB_ENV"

      - name: Checkout frozen CREMMA authority
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout pinned Naibbe authority
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: external/naibbe

      - name: Install preexisting runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pandas

      - name: Compile B0 support freezer
        run: python -m py_compile experiments/naibbe-r1-decomposition-v2/b0_support72_v2.py

      - name: Generate exact target-blind rep0-rep4 surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue72-b0
          python experiments/naibbe-r1-decomposition-v2/b0_support72_v2.py \
            external/cremma external/naibbe /tmp/issue72-b0/stage_b0_support.json \
            > /tmp/issue72-b0/stdout.txt
          test -s /tmp/issue72-b0/stage_b0_support.json

      - name: Enforce support population and target firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/issue72-b0/stage_b0_support.json').read_text())
          assert r['status']=='UNCHANGED_NAIBBE_REP0_REP4_SURFACES_FROZEN'
          assert r['coverage_policy']=='CONTINUOUS_DESCRIPTIVE_NO_HARD_CUTOFF'
          assert set(r['reps'])=={'rep0','rep1','rep2','rep3','rep4'}
          assert all(v is False for v in r['target_access'].values())
          rep0=r['reps']['rep0']
          assert rep0['primary_pooled_surface_sha256']=='47d52d28d4e2ac126bb8681c881ec339cb339c9b1bb329fb48263e6c1e9758bd'
          assert rep0['support']['visible_tokens']==33574
          assert rep0['support']['accepted_tokens']==29759
          for i in range(5):
              row=r['reps'][f'rep{i}']
              assert row['rep']==i
              for mi,ms in enumerate(['BIS193','CLM13027','Mazarine915','UBL758']):
                  assert row['per_manuscript'][ms]['seed']==6480000+100*mi+i
          for name,row in r['reps'].items():
              print(name,{
                  'sha':row['primary_pooled_surface_sha256'],
                  'visible':row['support']['visible_tokens'],
                  'accepted':row['support']['accepted_tokens'],
                  'coverage':row['support']['coverage'],
                  'retries':{ms:x['generation_diagnostics']['ambiguity_retries'] for ms,x in row['per_manuscript'].items()},
              })
          PY

      - name: Package exact B0 evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum /tmp/issue72-b0/stage_b0_support.json /tmp/issue72-b0/stdout.txt | sort > /tmp/issue72-b0/SHA256SUMS.txt
          cat > /tmp/issue72-b0/PROVENANCE.txt <<EOF
          workflow_run=${GITHUB_RUN_ID}
          workflow_attempt=${GITHUB_RUN_ATTEMPT}
          branch_head=${GITHUB_SHA}
          parent_main=98a04953aabe9e228a17fa5808adf506a0833362
          stage_b_plan_first_add=${B_PLAN_FIRST_ADD}
          stage_b0_script_first_add=${B0_SCRIPT_FIRST_ADD}
          stage_b0_workflow_first_add=${B0_WORKFLOW_FIRST_ADD}
          rep1_rep4_R1_scored=false
          issue72_intervention_R1_scored=false
          EOF
          cat /tmp/issue72-b0/SHA256SUMS.txt
          cat /tmp/issue72-b0/PROVENANCE.txt

      - name: Upload exact B0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue72-v2-stageB0-support-${{ github.sha }}
          path: /tmp/issue72-b0
          if-no-files-found: error
          retention-days: 90
