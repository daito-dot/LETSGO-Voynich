name: Issue90 Phase0 score-free preflight

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/phase0/**'
      - '.github/workflows/issue90-phase0-preflight.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen source
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Enforce score-free executable boundary
        shell: bash
        run: |
          test -f experiments/predictive-information/phase0/PLAN.md
          test -f experiments/predictive-information/phase0/AMENDMENT_A.md
          test -f experiments/predictive-information/phase0/AMENDMENT_B.md
          test -f experiments/predictive-information/phase0/PREFLIGHT_A_PROVENANCE.md
          test -f experiments/predictive-information/phase0/IMPLEMENTATION_PREFLIGHT.md
          test -f experiments/predictive-information/phase0/phase0_preflight.py
          test -f experiments/predictive-information/phase0/phase0_preflight_b.py
          if grep -E 'output_metrics|score_r1\(|metric_gates\(|evaluate_model\(' experiments/predictive-information/phase0/phase0_preflight.py experiments/predictive-information/phase0/phase0_preflight_b.py; then
            echo 'Target-scoring call found in score-free preflight executable' >&2
            exit 1
          fi

      - name: Compile and self-test
        shell: bash
        run: |
          python -m py_compile experiments/predictive-information/phase0/phase0_preflight.py
          python -m py_compile experiments/predictive-information/phase0/phase0_preflight_b.py
          python experiments/predictive-information/phase0/phase0_preflight_b.py --self-test

      - name: Run authoritative Amendment-B score-free preflight
        shell: bash
        run: |
          python experiments/predictive-information/phase0/phase0_preflight_b.py --preflight "$ZL3B" phase0_preflight_b.json
          python -m json.tool phase0_preflight_b.json > /dev/null
          sha256sum phase0_preflight_b.json

      - name: Assert firewall and print predictive-only summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('phase0_preflight_b.json'))
          assert x['schema'] == 'issue90-phase0-preflight-b-v1'
          assert x['target_score_calls'] == 0
          assert x['firewall'] == {
              'H62_scored': False,
              'R1_target_scored': False,
              'S1_scored': False,
              'S2_scored': False,
              'issue84_target_used_for_selection': False,
          }
          assert x['deterministic_selection'] is True
          assert x['deterministic_generation'] is True
          assert x['amendment_B']['further_phase0_tau_or_window_extension_licensed'] is False
          print(json.dumps({
              'selection': {f:r['selected'] for f,r in x['selections'].items()},
              'predictive': x['outer_heldout_predictive']['summary'],
              'selection_sha256': x['selection_sha256'],
              'fold_identity_sha256': x['fold_identity_sha256'],
              'target_score_calls': x['target_score_calls'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload authoritative score-free authority
        uses: actions/upload-artifact@v4
        with:
          name: issue90-phase0-preflight-b
          path: phase0_preflight_b.json
