name: Issue68 Phase62C first-reveal diff

on:
  push:
    branches: [issue68-joint-constraint-tournament]
    paths:
      - '.github/workflows/issue68-stage0-phase62c-first-reveal-diff.yml'

permissions:
  actions: read
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue68-joint-constraint-tournament
      - name: Recover original first-reveal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9732584331/zip > /tmp/a.zip
          echo 'fe555431c6472b26663a23c842a0c37f70963ca524d7c1759cec6e2799fc4594  /tmp/a.zip' | sha256sum -c -
          mkdir /tmp/a
          unzip -q /tmp/a.zip -d /tmp/a
      - name: Exact semantic diff and scientific gates
        run: |
          python - <<'PY'
          import json,math,hashlib,pathlib
          a=pathlib.Path('/tmp/a/phase62c_c0_a1_results.json')
          b=pathlib.Path('experiments/phase62/phase62c_c0_a1_results.json')
          x=json.loads(a.read_bytes()); y=json.loads(b.read_bytes())
          dif=[]
          def w(p,u,v):
              if type(u)!=type(v): dif.append((p,'TYPE',u,v)); return
              if isinstance(u,dict):
                  for k in sorted(set(u)|set(v)):
                      if k not in u or k not in v: dif.append((p+'.'+k,'KEY',u.get(k),v.get(k)))
                      else: w(p+'.'+k,u[k],v[k])
              elif isinstance(u,list):
                  if len(u)!=len(v): dif.append((p,'LEN',len(u),len(v)))
                  for i,(q,r) in enumerate(zip(u,v)): w(f'{p}[{i}]',q,r)
              elif isinstance(u,(int,float)) and not isinstance(u,bool):
                  if u!=v and not (isinstance(u,float) and isinstance(v,float) and math.isnan(u) and math.isnan(v)): dif.append((p,'NUM',u,v))
              elif u!=v: dif.append((p,'VALUE',u,v))
          w('$',x,y)
          print('first_reveal_sha256',hashlib.sha256(a.read_bytes()).hexdigest())
          print('recorded_sha256',hashlib.sha256(b.read_bytes()).hexdigest())
          print('difference_count',len(dif))
          for d in dif: print(d)
          critical=[
            ('compatibility',),('inputs',),
            ('across_fold','voynich_mean'),('across_fold','N0_mean'),('across_fold','C0_selected_mean'),('across_fold','A1_frozen_mean'),
            ('across_fold','C0_ratio_of_means_to_voynich'),('across_fold','A1_ratio_of_means_to_voynich'),
            ('across_fold','C0_improved_heldout_folds'),('across_fold','C0_LOMO_fold_improvement_counts'),
            ('across_fold','C0_LOMO_conditions_with_majority_improvement'),('across_fold','C0_materially_improves_N0_under_frozen_rule'),
            ('across_fold','A1_materially_competitive_under_frozen_common_score_rule'),('across_fold','selected_C0_by_fold'),('phase62c_decisions',)
          ]
          def g(o,p):
              for k in p:o=o[k]
              return o
          bad=['.'.join(p) for p in critical if g(x,p)!=g(y,p)]
          print('critical_mismatches',bad)
          if bad: raise SystemExit(40)
          PY
