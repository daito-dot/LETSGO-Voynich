name: Phase62C C0 and frozen A1

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/phase62/IMPLEMENTATION_C.md'
      - 'experiments/phase62/phase62c_c0_a1.py'
      - '.github/workflows/phase62c-c0-a1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LETSGO-Voynich
        uses: actions/checkout@v4

      - name: Checkout frozen CREMMA corpus
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen inputs
        shell: bash
        run: |
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run frozen Phase62C comparison
        run: |
          python experiments/phase62/phase62c_c0_a1.py \
            external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            external/cremma \
            > phase62c_c0_a1_results.json

      - name: Print compact result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('phase62c_c0_a1_results.json'))
          print('PHASE62C')
          print('compatibility=', x['compatibility'])
          a=x['across_fold']
          print('voynich=', a['voynich_mean'])
          print('N0=', a['N0_mean'])
          print('C0=', a['C0_selected_mean'])
          print('A1=', a['A1_frozen_mean'])
          print('C0_ratios=', a['C0_ratio_of_means_to_voynich'])
          print('A1_ratios=', a['A1_ratio_of_means_to_voynich'])
          print('selected_C0=', a['selected_C0_by_fold'])
          print('C0_errors=', a['N0_mean_joint_relative_mse'], a['C0_mean_joint_relative_mse'])
          print('C0_improved_folds=', a['C0_improved_heldout_folds'])
          print('C0_LOMO=', a['C0_LOMO_fold_improvement_counts'], 'conditions=', a['C0_LOMO_conditions_with_majority_improvement'])
          print('C0_material=', a['C0_materially_improves_N0_under_frozen_rule'])
          print('A1_competitive=', a['A1_materially_competitive_under_frozen_common_score_rule'])
          for f in x['folds']:
              print('FOLD', f['fold'], 'selected=', f['C0_selected'], 'N0=', f['N0'], 'C0=', f['C0'], 'A1=', f['A1'], 'ratios=', f['ratios_to_heldout_voynich'])
          print('decisions=', x['phase62c_decisions'])
          PY

      - name: Upload Phase62C result
        uses: actions/upload-artifact@v4
        with:
          name: phase62c-c0-a1-results
          path: phase62c_c0_a1_results.json
