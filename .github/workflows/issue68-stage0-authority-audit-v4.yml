name: Issue68 Stage0 authority verification outcome

on:
  push:
    branches: [issue68-joint-constraint-tournament]
    paths:
      - '.github/workflows/issue68-stage0-authority-audit-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue68-joint-constraint-tournament
          fetch-depth: 0

      - name: Checkout frozen ZL3b source
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: _cipher_benchmark
          sparse-checkout: benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          sparse-checkout-cone-mode: false

      - name: Checkout frozen CREMMA controls
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: _cremma
          sparse-checkout: |
            data/BIS-193
            data/CLM13027
            data/Mazarine915
            data/UBL758
          sparse-checkout-cone-mode: false

      - name: Checkout pinned Naibbe publication code
        uses: actions/checkout@v4
        with:
          repository: greshko/naibbe-cipher
          ref: f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
          path: _naibbe
          sparse-checkout: |
            naibbe_v2.py
            sixteentables.csv
          sparse-checkout-cone-mode: false

      - name: Install frozen scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.16.1

      - name: Run all Stage0 checks and persist machine outcome
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/issue68-stage0 experiments/joint-constraint-tournament/stage0
          PLAN=$(git log --diff-filter=A --format=%H -- experiments/joint-constraint-tournament/STAGE0_PLAN.md | tail -1)
          SCRIPT=$(git log --diff-filter=A --format=%H -- experiments/joint-constraint-tournament/authority_audit.py | tail -1)
          export PLAN SCRIPT
          export ZL_COMMIT=$(git -C _cipher_benchmark rev-parse HEAD)
          export ZL_BLOB=$(git -C _cipher_benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)
          export CREMMA_COMMIT=$(git -C _cremma rev-parse HEAD)
          export NAIBBE_COMMIT=$(git -C _naibbe rev-parse HEAD)
          export NAIBBE_PY_BLOB=$(git -C _naibbe hash-object naibbe_v2.py)
          export NAIBBE_TABLE_BLOB=$(git -C _naibbe hash-object sixteentables.csv)

          python experiments/joint-constraint-tournament/authority_audit.py > /tmp/issue68-stage0/authority.json 2>/tmp/issue68-stage0/authority.err
          echo $? > /tmp/issue68-stage0/authority.rc

          ZL=_cipher_benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
          python experiments/phase62/phase62c_c0_a1.py "$ZL" _cremma > /tmp/issue68-stage0/phase62c.json 2>/tmp/issue68-stage0/phase62c.err
          echo $? > /tmp/issue68-stage0/phase62c.rc
          python experiments/phase62/phase62p_h62p1.py "$ZL" _cremma > /tmp/issue68-stage0/phase62p.json 2>/tmp/issue68-stage0/phase62p.err
          echo $? > /tmp/issue68-stage0/phase62p.rc

          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          def sha(path):
              p=Path(path)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None

          def load(path):
              try: return json.loads(Path(path).read_text())
              except Exception: return None

          def first_diff(a,b,path='$',out=None,limit=30):
              if out is None: out=[]
              if len(out)>=limit: return out
              if type(a) != type(b):
                  out.append({'path':path,'old_type':type(a).__name__,'new_type':type(b).__name__}); return out
              if isinstance(a,dict):
                  for k in sorted(set(a)|set(b)):
                      if k not in a or k not in b:
                          out.append({'path':f'{path}.{k}','missing_in':'old' if k not in a else 'new'})
                      else: first_diff(a[k],b[k],f'{path}.{k}',out,limit)
                      if len(out)>=limit: break
              elif isinstance(a,list):
                  if len(a)!=len(b): out.append({'path':path,'old_len':len(a),'new_len':len(b)})
                  for i,(x,y) in enumerate(zip(a,b)):
                      first_diff(x,y,f'{path}[{i}]',out,limit)
                      if len(out)>=limit: break
              elif a != b:
                  out.append({'path':path,'old':a,'new':b})
              return out

          expected={
            'zl_commit':'315f0cad4de3d021bd4185765c037cf2a28d341c',
            'zl_blob':'2a4533ab9bdfa85db9bad602d590978953055df1',
            'cremma_commit':'292525969ad98380b398e6606a9c2a36d51913ae',
            'naibbe_commit':'f2675ec5dd275268bc64dd48ea64fc0e0e9827a2',
          }
          actual={
            'zl_commit':os.environ['ZL_COMMIT'],
            'zl_blob':os.environ['ZL_BLOB'],
            'cremma_commit':os.environ['CREMMA_COMMIT'],
            'naibbe_commit':os.environ['NAIBBE_COMMIT'],
            'naibbe_py_blob':os.environ['NAIBBE_PY_BLOB'],
            'naibbe_table_blob':os.environ['NAIBBE_TABLE_BLOB'],
          }
          source_audit=Path('experiments/phase64/C1_SOURCE_AUDIT_B.md').read_text(encoding='utf-8')
          authority=load('/tmp/issue68-stage0/authority.json')
          oldc=load('experiments/phase62/phase62c_c0_a1_results.json')
          newc=load('/tmp/issue68-stage0/phase62c.json')
          oldp=load('experiments/phase62/phase62p_h62p1_results.json')
          newp=load('/tmp/issue68-stage0/phase62p.json')
          d=load('experiments/occupancy-graph-independent-transcription/first-reveal/issue66_independent_residual_results.json')
          folds_c=[x['test_leaves'] for x in oldc['folds']] if oldc else None
          folds_p=[x['test_leaves'] for x in oldp['folds']] if oldp else None
          folds_d=d['population']['physical_leaf_folds'] if d else None
          naibbe_script=Path('_naibbe/naibbe_v2.py').read_text(encoding='utf-8')
          naibbe_interface=all(x in naibbe_script for x in ['UNAMBIGUOUS = True','REMOVE_SPACES = True','REMOVE_SPACES_PERCENTAGE = 3','RANDOM = True','def encrypt(','def respace(']) and 'def decrypt(' not in naibbe_script and 'def decode(' not in naibbe_script
          checks={
            'plan_predates_audit': bool(os.environ['PLAN'] and os.environ['SCRIPT'] and subprocess.run(['git','merge-base','--is-ancestor',os.environ['PLAN'],os.environ['SCRIPT']]).returncode==0),
            'zl_commit': actual['zl_commit']==expected['zl_commit'],
            'zl_blob': actual['zl_blob']==expected['zl_blob'],
            'cremma_commit': actual['cremma_commit']==expected['cremma_commit'],
            'naibbe_commit': actual['naibbe_commit']==expected['naibbe_commit'],
            'naibbe_py_blob_matches_phase64_audit': actual['naibbe_py_blob'] in source_audit,
            'naibbe_table_blob_matches_phase64_audit': actual['naibbe_table_blob'] in source_audit,
            'naibbe_interface_defaults': naibbe_interface,
            'authority_audit_rc0': Path('/tmp/issue68-stage0/authority.rc').read_text().strip()=='0',
            'authority_no_new_joint_scores': bool(authority and authority.get('new_joint_candidate_scores_computed') is False),
            'common_99_leaf_folds': bool(folds_c and folds_c==folds_p==folds_d and len(set(sum(folds_c,[])))==99),
            'phase62c_rc0': Path('/tmp/issue68-stage0/phase62c.rc').read_text().strip()=='0',
            'phase62c_exact_json': bool(oldc is not None and oldc==newc),
            'phase62p_rc0': Path('/tmp/issue68-stage0/phase62p.rc').read_text().strip()=='0',
            'phase62p_exact_json': bool(oldp is not None and oldp==newp),
          }
          outcome={
            'issue':68,
            'stage':'Stage0 authority/replay diagnostic',
            'new_joint_candidate_scores_computed':False,
            'plan_first_add':os.environ['PLAN'],
            'audit_first_add':os.environ['SCRIPT'],
            'actual_external_authorities':actual,
            'checks':checks,
            'authority_json_sha256':sha('/tmp/issue68-stage0/authority.json'),
            'phase62c_replay_sha256':sha('/tmp/issue68-stage0/phase62c.json'),
            'phase62p_replay_sha256':sha('/tmp/issue68-stage0/phase62p.json'),
            'phase62c_first_differences': first_diff(oldc,newc) if oldc is not None and newc is not None and oldc!=newc else [],
            'phase62p_first_differences': first_diff(oldp,newp) if oldp is not None and newp is not None and oldp!=newp else [],
            'all_checks_pass':all(checks.values()),
          }
          Path('experiments/joint-constraint-tournament/stage0/STAGE0_OUTCOME.json').write_text(json.dumps(outcome,indent=2,sort_keys=True)+'\n')
          if outcome['all_checks_pass']:
              Path('/tmp/issue68-stage0/authority.json').replace('experiments/joint-constraint-tournament/stage0/authority_audit.json')
              text=f'''# Issue #68 Stage 0 replay verification\n\nStatus: **VERIFIED — no new joint candidate score computed**.\n\n- workflow run: `{os.environ.get('GITHUB_RUN_ID','')}`\n- Stage0 plan first-add: `{os.environ['PLAN']}`\n- authority-audit executable first-add: `{os.environ['SCRIPT']}`\n- machine audit JSON SHA-256: `{outcome['authority_json_sha256']}`\n- ZL3b source commit/blob: `{actual['zl_commit']}` / `{actual['zl_blob']}`\n- CREMMA commit: `{actual['cremma_commit']}`\n- Naibbe commit: `{actual['naibbe_commit']}`\n- Naibbe script/table blobs: `{actual['naibbe_py_blob']}` / `{actual['naibbe_table_blob']}`\n\nVerified:\n\n1. Stage0 plan predates audit code.\n2. R1/R2/R3 share the same 99 physical-leaf fold authority.\n3. Current-main Phase62C exactly replays its committed JSON from frozen ZL3b + CREMMA.\n4. Current-main Phase62P/H62 exactly replays its committed JSON from the same authorities.\n5. Pinned Naibbe commit/files match the accepted Phase64 source audit and published interface/defaults; no explicit decrypt/decode function is exposed.\n6. The C0 reversibility boundary and candidate access/complexity schema are recorded by the machine audit.\n7. `new_joint_candidate_scores_computed` remains `false`.\n\nThis authorizes final Stage0 reporting. A separate tournament `PLAN_A.md` is still required before any new candidate joint score.\n'''
              Path('experiments/joint-constraint-tournament/stage0/STAGE0_REPLAY_VERIFIED.md').write_text(text)
          else:
              failed=[k for k,v in checks.items() if not v]
              Path('experiments/joint-constraint-tournament/stage0/STAGE0_FAILURE.md').write_text('# Issue #68 Stage 0 verification failure\n\nNo new joint candidate score was computed.\n\nFailed checks:\n\n'+'\n'.join(f'- `{x}`' for x in failed)+'\n\nSee `STAGE0_OUTCOME.json` for exact diagnostic details.\n')
          PY

      - name: Commit Stage0 outcome regardless of pass/fail
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/joint-constraint-tournament/stage0
          git commit -m 'Record Issue68 Stage0 verification outcome'
          git push origin HEAD:issue68-joint-constraint-tournament
