name: Issue 217 first reveal

on:
  push:
    branches:
      - issue217-page-inventory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4

      - name: Record frozen implementation identity
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee issue217_head_sha.txt
          sha256sum experiments/issue217-page-inventory/issue217_inventory_test.py | tee issue217_script_sha256.txt

      - name: Fetch and verify frozen transcriptions
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue217-transcriptions
          python3 data/fetch_transcriptions.py /tmp/issue217-transcriptions ZL3b IT2a | tee issue217_fetch_log.txt

      - name: Run frozen Issue 217 analysis exactly once
        run: |
          set -euo pipefail
          python3 experiments/issue217-page-inventory/issue217_inventory_test.py \
            --zl3b /tmp/issue217-transcriptions/ZL3b-n.txt \
            --it2a /tmp/issue217-transcriptions/IT2a-n.txt \
            --out issue217_first_reveal_result.json \
            | tee issue217_stdout.txt

      - name: Freeze result manifest
        run: |
          set -euo pipefail
          sha256sum \
            issue217_first_reveal_result.json \
            issue217_fetch_log.txt \
            issue217_stdout.txt \
            issue217_head_sha.txt \
            issue217_script_sha256.txt \
            > issue217_manifest_sha256.txt
          cat issue217_manifest_sha256.txt

      - name: Upload first-reveal artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue217-first-reveal
          if-no-files-found: error
          retention-days: 90
          path: |
            issue217_first_reveal_result.json
            issue217_fetch_log.txt
            issue217_stdout.txt
            issue217_head_sha.txt
            issue217_script_sha256.txt
            issue217_manifest_sha256.txt
