name: Issue84 Phase C0 layout audit

on:
  push:
    branches: [research/issue84-phase-c-genre-controls]
    paths:
      - '.github/workflows/issue84-phase-c0-layout-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  layout-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frozen IA DjVu XML representations
        shell: bash
        run: |
          mkdir -p out/xml
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          items={
            'C-REC-2':'twofifteenthcent00aust',
            'C-HERB-1':'deviribusherbaru00mace',
            'C-MED-1':'leechdomswortcun01cock',
            'C-ACC-1':'cu31924027939820',
            'C-ACC-2':'cu31924027939861',
            'C-LIT-1':'manualeetp00cath',
          }
          ua={'User-Agent':'LETSGO-Voynich-Issue84-C0-layout-audit/1.0'}
          summary={}
          for sid,ia in items.items():
              meta_url=f'https://archive.org/metadata/{ia}'
              meta=json.loads(urllib.request.urlopen(urllib.request.Request(meta_url,headers=ua),timeout=90).read())
              names=[f.get('name','') for f in meta.get('files',[])]
              cand=[n for n in names if n.endswith('_djvu.xml')]
              if not cand:
                  raise RuntimeError(f'{sid}: no _djvu.xml in frozen IA item')
              name=sorted(cand,key=lambda x:(len(x),x))[0]
              url=f'https://archive.org/download/{ia}/{name}'
              raw=urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=90).read()
              Path(f'out/xml/{sid}.xml').write_bytes(raw)
              summary[sid]={
                'ia':ia,'download_file':name,'url':url,'bytes':len(raw),
                'sha256':hashlib.sha256(raw).hexdigest(),
              }
              print(sid,name,len(raw),summary[sid]['sha256'])
          Path('out/layout_source_summary.json').write_text(json.dumps(summary,indent=1)+'\n')
          print('TARGET_SCORE_CALLS=0')
          PY

      - name: Parse page geometry only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET
          report={}
          markers={
            'C-REC-2':['FIFTEENTH','HARLEIAN','ASHMOLE','LAUD','DOUCE','GLOSSARY'],
            'C-HERB-1':['MACER','ARTEMISIA','EXPLICIT','SPURIA','HORTULUS'],
            'C-MED-1':['HERBARIUM','HERBARIVM','QUADRUPEDIBUS','LEECHDOMS'],
            'C-ACC-1':['ANNO','EXECUTORES','EXPENSES','MEMORANDA','ADDITIONAL'],
            'C-ACC-2':['PARCELLIS','EXPENSES','ADDITIONAL','INDEX'],
            'C-LIT-1':['ORDO','PROCESSIONALE','FINIT','APPENDIX'],
          }
          for p in sorted(Path('out/xml').glob('*.xml')):
              sid=p.stem
              root=ET.parse(p).getroot()
              pages=[]
              for pi,obj in enumerate(root.findall('.//OBJECT')):
                  w=int(obj.attrib.get('width') or obj.attrib.get('WIDTH') or 0)
                  h=int(obj.attrib.get('height') or obj.attrib.get('HEIGHT') or 0)
                  lines=[]
                  for ln in obj.findall('.//LINE'):
                      words=[]
                      for wd in ln.findall('.//WORD'):
                          txt=''.join(wd.itertext()).strip()
                          coords=wd.attrib.get('coords') or wd.attrib.get('COORDS') or ''
                          words.append({'t':txt,'c':coords})
                      text=' '.join(x['t'] for x in words if x['t'])
                      if text:
                          lines.append({'text':text,'words':words})
                  pages.append({'page':pi,'width':w,'height':h,'lines':lines})
              hits=[]
              for page in pages:
                  for li,line in enumerate(page['lines']):
                      up=line['text'].upper()
                      if any(m in up for m in markers[sid]):
                          hits.append({'page':page['page'],'line':li,'width':page['width'],'height':page['height'],'text':line['text'][:500],'words':line['words'][:30]})
              # Keep geometry for marker pages plus neighboring pages only; raw XML remains in artifact.
              interesting=set()
              for h in hits:
                  interesting.update(range(max(0,h['page']-1),min(len(pages),h['page']+2)))
              page_samples=[]
              for i in sorted(interesting):
                  page=pages[i]
                  page_samples.append({'page':i,'width':page['width'],'height':page['height'],'lines':page['lines'][:120]})
              report[sid]={'n_pages':len(pages),'marker_hits':hits,'marker_page_samples':page_samples}
          Path('out/layout_geometry.json').write_text(json.dumps(report,ensure_ascii=False,indent=1)+'\n')
          print('TARGET_SCORE_CALLS=0')
          PY

      - name: Freeze source-only layout audit
        shell: bash
        run: |
          cat > out/PROVENANCE_LAYOUT.md <<EOF
          # Issue #84 Phase C0 layout-audit provenance
          - workflow run: ${GITHUB_RUN_ID}
          - scientific head: ${GITHUB_SHA}
          - branch: ${GITHUB_REF_NAME}
          - target statistic calls: 0
          EOF
          sha256sum out/layout_source_summary.json out/layout_geometry.json out/PROVENANCE_LAYOUT.md > out/SHA256SUMS_LAYOUT

      - name: Upload layout-audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: issue84-phasec0-layout-audit
          path: out/
          retention-days: 90
          if-no-files-found: error
