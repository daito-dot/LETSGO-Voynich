name: Issue186 R4 CREMMA S1 Gate0

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ISSUE186_R4_CREMMA_S1_GATE0_PLAN_20260908.md'
      - 'experiments/issue186-r4-cremma-s1/issue186_cremma_gate0.py'
      - '.github/workflows/issue186-r4-cremma-s1-gate0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LETSGO-Voynich
        uses: actions/checkout@v4

      - name: Checkout frozen CREMMA corpus
        uses: actions/checkout@v4
        with:
          repository: HTR-United/CREMMA-Medieval-LAT
          ref: 292525969ad98380b398e6606a9c2a36d51913ae
          path: external/cremma

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Verify frozen external inputs
        shell: bash
        run: |
          test "$(git -C external/cremma rev-parse HEAD)" = "292525969ad98380b398e6606a9c2a36d51913ae"
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"

      - name: Install historical numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run score-free Gate0 audit
        run: |
          python experiments/issue186-r4-cremma-s1/issue186_cremma_gate0.py \
            --zl3b external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt \
            --cremma external/cremma \
            > issue186_cremma_gate0_summary.json

      - name: Assert Gate0 firewall and validity
        run: |
          python - <<'PY'
          import json
          p='issue186_cremma_gate0_summary.json'
          x=json.load(open(p, encoding='utf-8'))
          assert x['schema']=='issue186-r4-cremma-s1-gate0-v1'
          assert x['issue']==186
          assert x['stage']=='gate0_score_free_composability'
          assert x['marker']=='NO ISSUE186 SCIENTIFIC S1 SCORE COMPUTED'
          assert x['scientific_score_computed'] is False
          assert x['authorities']['zl3b_parsed'] is False
          assert x['firewall']['new_s1_fields_emitted'] is False
          assert x['totals']['listed_manuscripts']==21
          assert x['gate0_valid'] is True
          print(x['marker'])
          print('gate0_valid=', x['gate0_valid'])
          print('totals=', json.dumps(x['totals'], ensure_ascii=False, sort_keys=True))
          print('class_support=', json.dumps(x['class_support'], ensure_ascii=False, sort_keys=True))
          for row in x['manuscripts']:
              print('SUPPORT', row['name'], row['type'], row['parse_status'],
                    'items=', row.get('item_total'),
                    'base=', row.get('base_eligible'),
                    's1_eligible=', row.get('s1_eligible'),
                    'lines=', row.get('physical_lines'),
                    'tokens=', row.get('token_count'))
          PY

      - name: Upload Gate0 result
        uses: actions/upload-artifact@v4
        with:
          name: issue186-r4-cremma-s1-gate0
          path: issue186_cremma_gate0_summary.json
