name: Issue184 S0-R1 canonical mask coverage

on:
  push:
    paths:
      - '.github/workflows/issue184-s0r1-masks.yml'
      - 'experiments/issue184-reversible-constrained-code/issue184_s0r1_masks.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s0r1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2'
      - name: Synthetic parser preflight
        run: python experiments/issue184-reversible-constrained-code/issue184_s0r1_masks.py --synthetic-preflight
      - name: Enumerate canonical mask representatives without target corpus access
        run: |
          python experiments/issue184-reversible-constrained-code/issue184_s0r1_masks.py \
            experiments/issue184-reversible-constrained-code/issue184_s0r1_masks_result.json
          sha256sum experiments/issue184-reversible-constrained-code/issue184_s0r1_masks_result.json \
            > experiments/issue184-reversible-constrained-code/issue184_s0r1_masks_result.sha256
          python - <<'PY'
          import json
          p='experiments/issue184-reversible-constrained-code/issue184_s0r1_masks_result.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['voynich_corpus_accessed'] is False
          assert d['g7a_probabilities_accessed'] is False
          assert d['r2_scientific_score_computed'] is False
          print(json.dumps({k:d[k] for k in (
            'mask_population','represented_mask_count','missing_mask_count','coverage_fraction',
            'search_trials_total','representative_table_sha256','classification','missing_masks')},
            ensure_ascii=False, indent=2))
          PY
      - name: Commit S0-R1 authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/issue184-reversible-constrained-code/issue184_s0r1_masks_result.json \
                  experiments/issue184-reversible-constrained-code/issue184_s0r1_masks_result.sha256
          git commit -m 'Issue #184: freeze canonical mask representability result'
          git pull --rebase origin main
          git push origin HEAD:main
