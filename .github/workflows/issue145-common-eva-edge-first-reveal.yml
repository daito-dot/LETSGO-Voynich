name: Issue145 common-EVA edge first reveal

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'experiments/predictive-information/common-eva-edge/issue145_common_eva_first_reveal.py'
      - '.github/workflows/issue145-common-eva-edge-first-reveal.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  ZL3B: external/cipher-benchmark/benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt
  IT2A: external/IT2a-n.txt
  OUT: issue145_common_eva_edge_first_reveal.json
  SCORER: experiments/predictive-information/common-eva-edge/issue145_common_eva_first_reveal.py

jobs:
  first-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head with Gate ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert merged Gate ancestry and frozen scientific blobs
        shell: bash
        run: |
          git merge-base --is-ancestor 692b141ac8457f4026ae482a4a8ae79a4f0fef50 HEAD
          test "$(git hash-object "$SCORER")" = "ce8a167c607fbcf2807f567439ab6837471f4f07"
          test "$(git hash-object experiments/predictive-information/common-eva-edge/issue145_common_eva_gate0.py)" = "80585066e746f42ac10554aaaeece793682a0b84"
          test "$(git hash-object experiments/predictive-information/common-eva-edge/ISSUE145_GATE0_PROVENANCE.md)" = "e98d2fffac1d2500623a7f8660343ead67218332"
          test "$(git hash-object experiments/predictive-information/phase4a/phase4a_boundary_gate0.py)" = "756380dcd6f1b024a359923852627460c0f64dd0"
          test "$(git hash-object experiments/predictive-information/phase4b/phase4b_it2a_gate0.py)" = "7520e1a5f2c64a4ccbc3cc0e65668a4e0a5391cb"
          test "$(git hash-object experiments/issue26-music/issue26e_core.py)" = "8bafba7f2bce4cf77c9001c729936c1ce619759b"

      - name: Checkout frozen ZL3b mirror
        uses: actions/checkout@v4
        with:
          repository: matthewdgreen/cipher_benchmark
          ref: 315f0cad4de3d021bd4185765c037cf2a28d341c
          path: external/cipher-benchmark

      - name: Retrieve exact IT2a authority
        shell: bash
        run: |
          mkdir -p external
          curl --fail --location --retry 3 --retry-delay 2 --output "$IT2A" https://www.voynich.nu/data/IT2a-n.txt

      - name: Verify frozen sources
        shell: bash
        run: |
          test "$(git -C external/cipher-benchmark rev-parse HEAD)" = "315f0cad4de3d021bd4185765c037cf2a28d341c"
          test "$(git -C external/cipher-benchmark hash-object benchmark/unsolved/sources/voynich/transcriptions/ZL3b-n.txt)" = "2a4533ab9bdfa85db9bad602d590978953055df1"
          test "$(sha256sum "$ZL3B" | awk '{print $1}')" = "bf5b6d4ac1e3a51b1847a9c388318d609020441ccd56984c901c32b09beccafc"
          test "$(git hash-object "$IT2A")" = "4d6d3f2537b1f507a257529b49c94af7d6e03446"
          test "$(sha256sum "$IT2A" | awk '{print $1}')" = "7f27a8b0feed8f6de0a99900df6bf912dd1d295c38e5f830bac8b41c3f536fb5"

      - name: Install frozen parser runtime
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Compile and target-free synthetic self-test
        shell: bash
        run: |
          python -m py_compile "$SCORER"
          python "$SCORER" --self-test

      - name: Run frozen common-EVA dual first reveal
        shell: bash
        run: |
          python "$SCORER" --run "$ZL3B" "$IT2A" "$OUT"
          python -m json.tool "$OUT" > /dev/null
          sha256sum "$OUT" | tee issue145_common_eva_edge_first_reveal.sha256

      - name: Assert frozen support classification and equivalence
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open('issue145_common_eva_edge_first_reveal.json',encoding='utf-8'))
          assert x['schema']=='issue145-common-eva-edge-first-reveal-v1'
          assert x['issue']==145 and x['scored'] is True
          assert x['authority']['gate0_reproduced'] is True
          assert x['authority']['gate0_result_sha256']=='563573e81c931133aaa9877bcf79a57a40ebb3e2a946183cac3f6e922d65eb48'
          assert x['authority']['gate0_script_blob']=='80585066e746f42ac10554aaaeece793682a0b84'
          assert x['authority']['gate0_provenance_blob']=='e98d2fffac1d2500623a7f8660343ead67218332'
          assert x['authority']['gate0_merge']=='692b141ac8457f4026ae482a4a8ae79a4f0fef50'
          assert x['frozen_model']['outcome_vocabulary_size']==32
          assert x['frozen_model']['k']==2
          assert x['frozen_model']['alpha']==0.01
          expected={
            'ZL3b': {
              'clean':[4932,5440,6174,6039,5467],
              'primary':[4038,4392,5129,4993,4537],
              'body':[3122,3478,4073,3976,3605],
            },
            'IT2a': {
              'clean':[5788,6400,7212,7128,6428],
              'primary':[4729,5171,6020,5896,5296],
              'body':[4031,4483,5220,5093,4649],
            },
          }
          passes={}
          for name in ('ZL3b','IT2a'):
              r=x['readings'][name]
              assert len(r['outer'])==5
              gains=[]
              for f,row in enumerate(r['outer']):
                  assert row['fold']==f
                  assert row['n_visible_clean_tokens']==expected[name]['clean'][f]
                  assert row['n_scored_primary_targets']==expected[name]['primary'][f]
                  assert row['n_scored_run_body_targets']==expected[name]['body'][f]
                  assert math.isfinite(row['bits_POS2_COMMON'])
                  assert math.isfinite(row['bits_EDGE2_COMMON'])
                  assert row['EDGE2_COMMON_full_run_k2_max_abs_token_logp']<=1e-12
                  g=row['bits_POS2_COMMON']-row['bits_EDGE2_COMMON']
                  assert math.isclose(g,row['G_common'],rel_tol=0.0,abs_tol=1e-12)
                  gains.append(row['G_common'])
              p=r['primary']
              assert p['G_common_by_fold']==gains
              mean=sum(gains)/5
              positive=sum(g>0.0 for g in gains)
              expected_pass=(mean>0.0 and positive>=4)
              assert math.isclose(mean,p['mean_G_common'],rel_tol=0.0,abs_tol=1e-15)
              assert positive==p['positive_folds']
              assert p['pass'] is expected_pass
              passes[name]=expected_pass
          if passes['ZL3b'] and passes['IT2a']:
              expected_class='COMMON-EVA EDGE ROBUST IN BOTH READINGS'
          elif passes['ZL3b']:
              expected_class='COMMON-EVA EDGE ROBUST IN ZL3B ONLY'
          elif passes['IT2a']:
              expected_class='COMMON-EVA EDGE ROBUST IN IT2A ONLY'
          else:
              expected_class='COMMON-EVA EDGE NOT ROBUST IN EITHER READING'
          assert x['classification']==expected_class
          assert x['primary_joint']['classification']==expected_class
          print(json.dumps({
              'classification':x['classification'],
              'ZL3b':x['readings']['ZL3b']['primary'],
              'IT2a':x['readings']['IT2a']['primary'],
              'secondary_non_promoting':x['secondary_non_promoting'],
          },indent=2,sort_keys=True,ensure_ascii=False))
          PY

      - name: Upload first-reveal authority
        uses: actions/upload-artifact@v4
        with:
          name: issue145-common-eva-edge-first-reveal-${{ github.event.pull_request.head.sha }}
          path: |
            issue145_common_eva_edge_first_reveal.json
            issue145_common_eva_edge_first_reveal.sha256
